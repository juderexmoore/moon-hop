    const zapped = new Set([e]);
    let from = e;
    for (let k = 0; k < st.chain; k++) {
      let next = null, bestD = 150;
      for (const o of enemies) {
        if (!o.alive || zapped.has(o)) continue;
        const d = Math.hypot(o.x - from.x, o.y - from.y);
        if (d < bestD) { bestD = d; next = o; }
      }
      if (!next) break;
      zaps.push({ x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 0.2 });
      damageEnemy(next, 1);
      zapped.add(next);
      from = next;
    }
  }
}

function updateBlaster(dt) {
  const p = player;
  const px = p.x + PLAYER_W / 2, py = p.y + PLAYER_H * 0.55;
  p.fireCd -= dt;
  if ((keys.KeyF || keys.KeyJ || keys.MouseR) && p.fireCd <= 0) {
    fireBlaster();
    p.fireCd = st.fireDelay * (p.fxRapid > 0 ? 0.5 : 1);    // RAPID FIRE gift
  }

  if (st.drone) {                                    // Helper Drone
    const tx = px - p.facing * 26, ty = p.y + PLAYER_H + 20;
    drone.x += (tx - drone.x) * Math.min(1, dt * 5);
    drone.y += (ty - drone.y) * Math.min(1, dt * 5);
    drone.cd -= dt;
    if (drone.cd <= 0) {
      const target = nearestTarget(drone.x, drone.y, st.aimRange);
      if (target) { makeShot(drone.x, drone.y, Math.atan2(target.y - drone.y, target.x - drone.x), 1, { drone: true }); drone.cd = 1.1; }
      else drone.cd = 0.2;
    }
  }
  if (st.moonlet) moonletAngle += dt * 3.2;

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    if (s.back) {                                     // Boomerang: fly home
      const dx = px - s.x, dy = py - s.y, d = Math.hypot(dx, dy);
      if (d < 16) { shots.splice(i, 1); continue; }
      s.vx = dx / d * st.shotSpeed;
      s.vy = dy / d * st.shotSpeed;
    } else if (st.homing) {                           // Homing Darts: curve toward enemies
      const target = nearestTarget(s.x, s.y, 220);
      if (target) {
        const want = Math.atan2(target.y - s.y, target.x - s.x);
        let cur = Math.atan2(s.vy, s.vx);
        const diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        cur += clamp(diff, -st.homing * dt, st.homing * dt);
        const sp = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(cur) * sp;
        s.vy = Math.sin(cur) * sp;
      }
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.x < 0 || s.x > VIEW_W) {
      if (s.bounces > 0) { s.bounces--; s.vx = -s.vx; s.x = clamp(s.x, 0, VIEW_W); }
      else if (!s.back) { shots.splice(i, 1); continue; }
    }
    if (s.life <= 0) {
      if (st.boomerang && !s.back) { s.back = true; s.hit.clear(); s.life = 2; }
      else { shots.splice(i, 1); continue; }
    }

    let gone = false;
    for (const e of enemies) {
      if (!e.alive || e.warn > 0 || s.hit.has(e)) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.size) {
        s.hit.add(e);
        shotHits(e, s);
        if (s.pierce > 0) s.pierce--;
        else if (st.boomerang && !s.back) { s.back = true; s.hit.clear(); s.hit.add(e); s.life = 2; }
        else { gone = true; break; }
      }
    }
    if (!gone && st.stopSweepers) {
      for (const pl of sweepers) {
        const sw = pl.sweeper;
        if (sw.frozen > 0) continue;
        if (s.x > sw.x - s.size && s.x < sw.x + SWEEPER_W + s.size && s.y > pl.y - s.size && s.y < pl.y + SWEEPER_H + s.size) {
          sw.frozen = st.stopSweepers;
          ring(sw.x + SWEEPER_W / 2, pl.y + SWEEPER_H / 2, 24, "120,220,255");
          gone = true;
          break;
        }
      }
    }
    if (gone) shots.splice(i, 1);
  }
}

// ---------- Enemies ----------
function moveEnemy(e, edt, px, py) {
  const ease = (tx, ty, rate) => {
    const k = Math.min(1, edt * rate);
    e.x += (tx - e.x) * k;
    e.y += (ty - e.y) * k;
  };
  if (e.boss) {                        // the boss: glide, throw fireballs, dive-bomb
    const angry = e.hp <= e.maxHp / 2;
    if (boss.phase !== "fight") { ease(e.hx, e.hy, 2); return; }
    if (e.mode === "hover") {
      ease(VIEW_W / 2 + 150 * Math.sin(e.t * (angry ? 1.3 : 0.8)), e.hy + 20 * Math.sin(e.t * 1.7), 3);
      const def = boss.def, k = angry ? 1 : 0;          // each boss has its own attack pattern
      e.shootT -= edt;
      if (e.shootT <= 0) {
        e.shootT = def.shotGap[k];
        const n = def.shots[k], aim = Math.atan2(py - e.y, px - e.x);
        for (let i = 0; i < n; i++) {
          const a = aim + (i - (n - 1) / 2) * 0.25;
          const shot = spawnFlyer(def.ammo, e.x, e.y, Math.cos(a) * def.speed, Math.sin(a) * def.speed);
          if (def.tint) shot.tint = def.tint;
        }
      }
      e.diveT -= edt;
      if (e.diveT <= 0) Object.assign(e, { mode: "dive", tx: px, ty: py, diveTime: 1.2 });
    } else if (e.mode === "dive") {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy), stepLen = 380 * edt;
      e.diveTime -= edt;
      if (d <= stepLen || e.diveTime <= 0) { e.mode = "return"; e.diveT = boss.def.diveGap[angry ? 1 : 0]; }
      else { e.x += dx / d * stepLen; e.y += dy / d * stepLen; }
    } else {
      ease(VIEW_W / 2, e.hy, 2.5);
      if (Math.abs(e.y - e.hy) < 15) e.mode = "hover";
    }
  } else if (e.dyn) {                  // flares and asteroids fly in a straight line
    if (e.warn > 0) { e.warn -= edt; return; }
    e.x += e.vx * edt;
    e.y += e.vy * edt;
    if (e.x < -60 || e.x > VIEW_W + 60 || e.y < camY - 150 || e.y > camY + VIEW_H + 100) e.alive = false;   // gone off screen
  } else if (e.move === "orbit") {     // obstacles circle their platform (Round 16)
    const a = e.ph + e.t * e.orbitSp;
    e.x = e.hx + Math.cos(a) * e.orbitR;
    e.y = e.hy + Math.sin(a) * e.orbitR;
    e.pvx = e.pvy = 0;
  } else if (e.move === "patrol") {    // drifts back and forth
    ease(e.hx + e.amp * Math.sin(e.t * 2 * Math.PI / e.period + e.ph), e.hy + 8 * Math.sin(e.t * 1.7 + e.ph), 3);
  } else if (e.move === "zip") {       // zips all the way across the screen
    ease(VIEW_W / 2 + (VIEW_W / 2 - 30) * Math.sin(e.t * 0.9 + e.ph), e.hy + 22 * Math.sin(e.t * 3.2 + e.ph), 6);
  } else if (e.move === "dive") {      // hovers, then dives at you
    if (e.mode === "hover") {
      ease(e.hx + 30 * Math.sin(e.t * 1.3 + e.ph), e.hy + 10 * Math.sin(e.t * 2 + e.ph), 3);
      e.cd -= edt;
      if (e.cd <= 0 && Math.hypot(px - e.x, py - e.y) < 230) {
        Object.assign(e, { mode: "dive", tx: px, ty: py, diveT: 0.9 });
      }
    } else if (e.mode === "dive") {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
      const stepLen = 320 * edt;
      e.diveT -= edt;
      if (d <= stepLen || e.diveT <= 0) { e.mode = "return"; e.cd = 2.5; }
      else { e.x += dx / d * stepLen; e.y += dy / d * stepLen; }
    } else {
      ease(e.hx, e.hy, 2);
      if (Math.hypot(e.hx - e.x, e.hy - e.y) < 12) e.mode = "hover";
    }
  } else {                             // "drift": slowly floats after you
    const near = Math.hypot(px - e.hx, py - e.hy) < 320;
    const tx = near ? px : e.hx, ty = near ? py : e.hy;
    const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
    const stepLen = Math.min(45 * edt, d);
    e.x += dx / d * stepLen;
    e.y += dy / d * stepLen + Math.sin(e.t * 2 + e.ph) * 10 * edt;
  }
}

function updateEnemies(dt) {
  const p = player, px = p.x + PLAYER_W / 2, py = p.y + PLAYER_H / 2;
  const ws = worldScale();
  const hb = hazardBox();
  const moon = st.moonlet ? moonletPos() : null;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.y < camY - 250 || e.y > camY + VIEW_H + 300) continue;    // asleep until you get close
    const edt = dt * ws * (e.frozen > 0 ? 0.35 : 1);
    if (e.frozen > 0) e.frozen -= dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.moonCd > 0) e.moonCd -= dt;
    if (e.burn > 0) {
      e.burn -= dt;
      e.burnTick -= dt;
      if (e.burnTick <= 0) { e.burnTick += 1; damageEnemy(e, 1); if (!e.alive) continue; }
    }
    e.t += edt;
    moveEnemy(e, edt, px, py);

    if (st.repel) {                                   // Repel Field
      const d = Math.hypot(e.x - px, e.y - py);
      if (d < 90 && d > 0.1) { e.pvx += (e.x - px) / d * 900 * dt; e.pvy += (e.y - py) / d * 900 * dt; }
    }
    e.x += e.pvx * dt;
    e.y += e.pvy * dt;
    const drag = Math.min(1, 4 * dt);
    e.pvx -= e.pvx * drag;
    e.pvy -= e.pvy * drag;
    if (!e.dyn) e.x = clamp(e.x, e.r, VIEW_W - e.r);
    if (!e.alive || e.warn > 0) continue;

    if (moon && e.moonCd <= 0 && Math.hypot(e.x - moon.x, e.y - moon.y) < e.r + 8) {   // Orbiting Moonlet
      e.moonCd = 0.6;
      damageEnemy(e, 1);
      const d = Math.hypot(e.x - moon.x, e.y - moon.y) || 1;
      e.pvx += (e.x - moon.x) / d * 250;
      e.pvy += (e.y - moon.y) / d * 250;
      if (!e.alive) continue;
    }

    // Bumping into you knocks you away.
    const nx = clamp(e.x, hb.x, hb.x + hb.w), ny = clamp(e.y, hb.y, hb.y + hb.h);
    if ((nx - e.x) ** 2 + (ny - e.y) ** 2 < e.r * e.r) {
      const dir = px >= e.x ? 1 : -1;
      if (hitPlayer(dir, ENEMY_KNOCK_X, ENEMY_KNOCK_Y, e)) e.pvx -= dir * 200;
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dyn && !enemies[i].alive) enemies.splice(i, 1);
}

// ---------- Confetti ----------
// Two confetti cannons fire from the bottom corners of the screen.
function confettiBurst() {
  for (const side of [-1, 1]) {
    for (let i = 0; i < 80; i++) {
      const tilt = 0.12 + Math.random() * 0.5;            // angle away from straight up
      const speed = 850 + Math.random() * 650;
      confetti.push({
        x: side < 0 ? 0 : VIEW_W, y: VIEW_H,
        vx: -side * Math.sin(tilt) * speed, vy: -Math.cos(tilt) * speed,
        rot: Math.random() * 6.28, spin: (Math.random() * 2 - 1) * 10,
        flip: Math.random() * 6.28, flipSpeed: 6 + Math.random() * 8,
        ph: Math.random() * 6.28, age: 0, life: 3.5 + Math.random() * 1.5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      });
    }
  }
}

function updateConfetti(dt) {
  const drag = Math.min(1, 1.8 * dt);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.vx -= c.vx * drag;
    c.vy -= c.vy * drag;
    c.vy = Math.min(c.vy + 900 * dt, 110);                 // flutters down slowly
    c.x += (c.vx + Math.sin(c.age * 4 + c.ph) * 30) * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    c.flip += c.flipSpeed * dt;
    c.age += dt;
    if (c.age > c.life || c.y > VIEW_H + 20) confetti.splice(i, 1);
  }
}

function updateEffects(dt) {
  for (const list of [rings, zaps, texts]) {
    for (let i = list.length - 1; i >= 0; i--) {
      list[i].life -= dt;
      if (list === texts) list[i].y += 30 * dt;
      if (list[i].life <= 0) list.splice(i, 1);
    }
  }
}

function touchesMoon() {
  const cx = VIEW_W / 2, cy = MOON_Y + MOON_R;
  const nx = clamp(cx, player.x, player.x + PLAYER_W);
  const ny = clamp(cy, player.y, player.y + PLAYER_H);
  return (nx - cx) ** 2 + (ny - cy) ** 2 < MOON_R * MOON_R;
}

// You dropped off the bottom of the screen. Rebound and Safety Flag can save you.
function fellOff() {
  const p = player, cx = p.x + PLAYER_W / 2;
  if (st.rebounds - p.reboundsUsed > 0) {
    p.reboundsUsed++;
    Object.assign(p, { y: camY, vy: 1150, onGround: false, standOn: null, stun: 0, diving: false, jumping: false, dashTime: 0 });
    p.airJumpsLeft = st.airJumps;
    p.dashReady = true;
    ring(cx, camY + 10, 60, "195,155,255");
    floatText(cx, camY + 70, "BOING!", "#c39bff");
    return;
  }
  if (st.safetyFlag && !p.flagUsed) {
    p.flagUsed = true;
    const L = p.lastLedge;
    const x = L.kind === "ground" ? VIEW_W / 2 - PLAYER_W / 2 : L.x + L.w / 2 - PLAYER_W / 2;
    Object.assign(p, { x, y: L.y, vx: 0, vy: 0, onGround: true, standOn: L, landY: L.y, stun: 0, diving: false, invuln: 1.5 });
    camY = Math.max(CAM_MIN, L.y - VIEW_H * 0.42);
    floatText(x + PLAYER_W / 2, L.y + 60, "SAVED!", "#c39bff");
    return;
  }
  loseRelics();                                   // falling = dying: mini-game power-ups are gone
  endRun(false);
}

function update(dt) {
  if (state === "minigame") { updateMinigame(dt); return; }
  if (state === "explore") { updateExplore(dt); return; }
  if (state === "playing") {
    const p = player;
    runTime += dt;
    if (timeSlow > 0) timeSlow -= dt;
    for (const k of ["timeCd", "blinkCd", "cloudCd", "invuln", "starTime", "spellTime", "domeTime",
                     "fxFeather", "fxSpeed", "fxRapid", "powerTextCd", "dmgShake"]) if (p[k] > 0) p[k] -= dt;
    for (const k in p.spellCds) if (p.spellCds[k] > 0) p.spellCds[k] -= dt * st.spellRate;
    if (st.shield && !p.shieldReady) { p.shieldTimer -= dt; if (p.shieldTimer <= 0) p.shieldReady = true; }
    if (st.guardian > 0) {                                   // Guardian Star relic: a free shield now and then
      p.guardT = (p.guardT || 0) + dt;
      if (p.guardT >= 20 / st.guardian) {
        p.guardT = 0;
        if (p.fxShield < 3 + st.guardian) { p.fxShield++; floatText(p.x + PLAYER_W / 2, p.y + 50, "+SHIELD", "#ffe14d"); }
      }
    }
    updateMovers(dt);
    updateTempPlats(dt);
    updatePlayer(dt);
    updateDog(dt);
    checkSweepers();
    updateBlaster(dt);
    updateEnemies(dt);
    updatePoppies(dt);
    maxHeightPx = Math.max(maxHeightPx, p.y);

    // Camera follows you up, but never comes back down. It also keeps the last
    // platform you stood on in view, so a big jump can't scroll it away.
    if (bossActive()) {
      camY += (boss.camY - camY) * Math.min(1, dt * 4);       // the screen locks onto the boss arena
    } else {
      let target = Math.min(p.y - VIEW_H * 0.42, p.landY - 40);
      target = Math.max(target, p.y + PLAYER_H + 80 - VIEW_H);     // never let you leave the top of the screen
      if (boss.phase === "waiting") target = Math.min(target, boss.camY);
      if (target > camY) camY += (target - camY) * Math.min(1, dt * 6);
      camY = Math.max(camY, p.y + PLAYER_H + 20 - VIEW_H);          // even a super-fast launch stays on screen
    }

    if (mode === "sandbox") {                   // your own level: reach the goal star
      if (touchesGoal()) sandboxEnd(true);
      else if (p.y + PLAYER_H < camY - 4) sandboxEnd(false);
    } else {
    if (!confettiDone && maxHeightPx >= CONFETTI_AT) { confettiDone = true; confettiBurst(); }
    // Entering a new section: show its name, and the dog learns a new spell
    const si = sectionAt(p.y / PX_PER_M);
    if (si > sectionReached) {
      sectionReached = si;
      sectionFlash = 3.5;
      newSpell = "";
      if (mode === "main" && !arcade) saveBestBiome(si);   // you can start here next time
      if (SPELLS[si] && !p.spells.includes(si)) {
        p.spells.push(si);
        p.spellSel = p.spells.length - 1;
        newSpell = SPELLS[si].name;
      }
    }
    if (sectionFlash > 0) sectionFlash -= dt;
    updateSections(dt);
    updateBoss(dt);
    if (mode === "main") updatePortal(dt);
    if (arcade) updateArcadeWorld(dt);

    const best = board()[0];
    if (!passedRecord && best && !best.moon && Math.floor(maxHeightPx / PX_PER_M) > best.height) {
      passedRecord = true;
      recordFlash = 2.5;
    }
    if (recordFlash > 0) recordFlash -= dt;

    // Every 100 m: time to pick an upgrade
    const reached = Math.floor(maxHeightPx / (UPGRADE_EVERY_M * PX_PER_M));
    while (milestonesDone < reached && ((milestonesDone + 1) * UPGRADE_EVERY_M < MOON_METERS || arcade)) {
      milestonesDone++;
      pendingPicks++;
      onMilestone();
      if (p.dmgPct > 0) {                                      // every 100 m heals some damage
        p.dmgPct = Math.max(0, p.dmgPct - 30);
        floatText(p.x + PLAYER_W / 2, p.y + 80, "HEALED 30%", "#7dff7a");
      }
    }

    if (state === "playing" && p.y + PLAYER_H < camY - 4) fellOff();   // you win by beating the Black Hole
    if (state === "playing" && pendingPicks > 0 && onSafeGround() && !bossActive()) openChoice();
    }
  }
  if (state === "editor") {
    const dir = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
    ed.camY = clamp(ed.camY + dir * 700 * dt, CAM_MIN, EDIT_MAX_Y - VIEW_H + 200);
    camY = ed.camY;
    if (ed.msgT > 0) ed.msgT -= dt;
  }
  if (state === "credits") creditsT += dt;
  if (state === "choose" && choice.delay > 0) choice.delay -= dt;
  if (state === "over" && overTimer > 0) overTimer -= dt;
  if (state !== "paused" && state !== "choose") {
    updateConfetti(dt);
    updateEffects(dt);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vy -= 200 * dt;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
}

// =====================================================================
//  DRAWING
// =====================================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, rgb(gradientAt(SKY, (camY + VIEW_H) / PX_PER_M)));
  g.addColorStop(1, rgb(gradientAt(SKY, camY / PX_PER_M)));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawStars(t) {
  const vis = clamp(((camY + VIEW_H / 2) / PX_PER_M - 1020) / 80, 0, 1);    // stars come out high in the atmosphere
  if (vis <= 0) return;
  for (const s of stars) {
    const sy = (s.y + camY * s.d) % VIEW_H;
    ctx.fillStyle = `rgba(255,255,255,${vis * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph))})`;
    ctx.fillRect(s.x, sy, s.r, s.r);
  }
}

// The goal: far away the Black Hole hangs small at the top of the sky, and it
// grows as you climb toward it. (Underwater it's hidden by the sea.)
function drawMoon(t) {
  if (arcade && camY > MOON_Y) return;          // arcade: you climbed past it
  const HANG_Y = 110;
  const realY = toScreenY(MOON_Y + MOON_R);
  let cy, r;
  if (realY >= HANG_Y) { cy = realY; r = MOON_R; }
  else { cy = HANG_Y; r = MOON_R / (1 + (HANG_Y - realY) / 1400); }
  const cx = VIEW_W / 2;
  const seen = clamp(((camY + VIEW_H / 2) / PX_PER_M - 300) / 60, 0, 1);
  if (seen <= 0) return;
  ctx.save();
  ctx.globalAlpha = seen;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 2.4);
  glow.addColorStop(0, "rgba(180,100,255,0.45)");
  glow.addColorStop(1, "rgba(80,20,140,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.4);
  ctx.strokeStyle = "rgba(220,160,255,0.85)";
  ctx.lineWidth = Math.max(1.5, r * 0.12);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.5, r * 0.45, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "#05010a";
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawClouds(t) {
  const m = camY / PX_PER_M;                 // clouds from the jungle up through the sky
  const alpha = clamp((m - 300) / 40, 0, 1) * clamp(1 - (m - 1040) / 50, 0, 1) * 0.9;
  if (alpha <= 0) return;
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  for (const c of clouds) {
    const sy = VIEW_H - (c.py - camY * 0.5);
    if (sy < -60 || sy > VIEW_H + 60) continue;
    const x = ((c.x + t * c.speed) % (VIEW_W + 160)) - 80;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(x, sy, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, sy - 9 * s, 19 * s, 0, Math.PI * 2);
    ctx.arc(x + 44 * s, sy, 21 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, sy + 6 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Section backgrounds and weather (Round 7) ----------
function sectionWeight(i) {                 // 1 inside the section, fading out near its edges
  const m = (camY + VIEW_H / 2) / PX_PER_M, s = SECTIONS[i];
  const below = i === 0 ? 1 : clamp((m - s.from + 40) / 80, 0, 1);
  const above = i === SECTIONS.length - 1 ? 1 : clamp((s.to - m + 40) / 80, 0, 1);
  return below * above;
}

function drawBackItem(b, x, sy, t) {
  const s = b.s;
  const circle = (cx, cy, r) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  switch (b.kind) {
    case "hill":
      ctx.fillStyle = b.sec % 2 ? "rgba(70,150,80,0.9)" : "rgba(90,170,95,0.9)";
      ctx.beginPath(); ctx.ellipse(b.x, sy + 70, 130 * s, 80 * s, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(b.x - 130 * s, sy + 69, 260 * s, VIEW_H);
      break;
    case "kelp":                                     // swaying seaweed
      ctx.strokeStyle = "rgba(60,170,110,0.75)";
      ctx.lineWidth = 6 * s;
      ctx.beginPath();
      for (let k = 0; k <= 8; k++) ctx.lineTo(b.x + Math.sin(t * 1.5 + k * 0.7 + b.ph) * 10 * s, sy + 120 * s - k * 22 * s);
      ctx.stroke();
      break;
    case "fish": {                                   // little fish swimming by
      const dir = b.speed >= 0 ? 1 : -1;
      ctx.fillStyle = ["rgba(255,160,70,0.9)", "rgba(255,220,90,0.9)", "rgba(120,200,255,0.9)"][Math.floor(b.ph) % 3];
      ctx.beginPath(); ctx.ellipse(x, sy, 10 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - dir * 9 * s, sy); ctx.lineTo(x - dir * 17 * s, sy - 6 * s); ctx.lineTo(x - dir * 17 * s, sy + 6 * s); ctx.fill();
      break;
    }
    case "palm":                                     // jungle palm trees
      ctx.fillStyle = "rgba(110,80,50,0.85)";
      ctx.fillRect(b.x - 4 * s, sy - 90 * s, 8 * s, 160 * s);
      ctx.fillStyle = "rgba(50,140,60,0.85)";
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI / 2 + (k - 2) * 0.6 + Math.sin(t + b.ph) * 0.05;
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * 26 * s, sy - 90 * s + Math.sin(a) * 14 * s, 30 * s, 7 * s, a, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case "peak":                                     // grey mountains
    case "snowpeak": {
      const w = 130 * s, h = 170 * s;
      ctx.fillStyle = b.kind === "peak" ? "rgba(110,105,110,0.85)" : "rgba(150,165,190,0.85)";
      ctx.beginPath(); ctx.moveTo(b.x - w, sy + h); ctx.lineTo(b.x, sy); ctx.lineTo(b.x + w, sy + h); ctx.fill();
      ctx.fillStyle = "rgba(250,252,255,0.9)";      // snowy tip
      const cap = b.kind === "peak" ? 0.18 : 0.42;
      ctx.beginPath(); ctx.moveTo(b.x - w * cap, sy + h * cap); ctx.lineTo(b.x, sy); ctx.lineTo(b.x + w * cap, sy + h * cap); ctx.fill();
      break;
    }
    case "moonbig":                                  // the Moon's cratered surface
      ctx.fillStyle = "rgba(210,205,190,0.9)";
      circle(VIEW_W / 2, sy + 260, 300);
      ctx.fillStyle = "rgba(160,150,130,0.6)";
      for (const c of craters) circle(VIEW_W / 2 + c.dx * 280, sy + 260 + c.dy * 280, c.r * 260);
      break;
    case "mars":                                     // the red planet
      ctx.fillStyle = "rgba(200,90,50,0.9)";
      circle(380, sy, 70);
      ctx.fillStyle = "rgba(150,60,35,0.7)";
      circle(360, sy - 20, 16);
      circle(400, sy + 25, 11);
      break;
    case "mesa":                                     // red rock towers
      ctx.fillStyle = "rgba(150,70,45,0.85)";
      rr(b.x - 30 * s, sy, 60 * s, 150 * s, 6);
      ctx.fill();
      ctx.fillStyle = "rgba(190,95,60,0.85)";
      ctx.fillRect(b.x - 30 * s, sy, 60 * s, 8 * s);
      break;
    case "castle":
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for (const [dx, h] of [[-26, 60], [0, 85], [26, 60]]) ctx.fillRect(x + dx * s - 9 * s, sy - h * s, 18 * s, h * s);
      ctx.fillStyle = "rgba(255,190,225,0.7)";
      for (const [dx, h] of [[-26, 60], [0, 85], [26, 60]]) {
        ctx.beginPath(); ctx.moveTo(x + dx * s - 11 * s, sy - h * s); ctx.lineTo(x + dx * s, sy - (h + 18) * s);
        ctx.lineTo(x + dx * s + 11 * s, sy - h * s); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (let i = -2; i <= 2; i++) circle(x + i * 18 * s, sy + 4, 16 * s);
      break;
    case "thunderhead":
      ctx.fillStyle = "rgba(38,42,58,0.85)";
      for (const [dx, dy, r] of [[-30, 6, 24], [0, -8, 32], [30, 4, 26], [8, 14, 26]]) circle(x + dx * s, sy + dy * s, r * s);
      break;
    case "island":
      ctx.fillStyle = "rgba(110,90,80,0.75)";
      ctx.beginPath(); ctx.moveTo(x - 34 * s, sy); ctx.lineTo(x + 34 * s, sy); ctx.lineTo(x, sy + 40 * s); ctx.fill();
      ctx.fillStyle = "rgba(110,190,110,0.8)";
      ctx.fillRect(x - 34 * s, sy - 5 * s, 68 * s, 6 * s);
      circle(x + 10 * s, sy - 16 * s, 9 * s);
      break;
    case "ribbon":
      for (const [color, off] of [["rgba(120,255,200,0.22)", 0], ["rgba(190,120,255,0.18)", 22]]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 16 * s;
        ctx.beginPath();
        for (let xx = -20; xx <= VIEW_W + 20; xx += 20) {
          ctx.lineTo(xx, sy + off + Math.sin(xx * 0.018 + t * 0.7 + b.ph) * 22);
        }
        ctx.stroke();
      }
      break;
    case "satellite":
      ctx.save();
      ctx.translate(x, sy);
      ctx.rotate(t * 0.3 + b.ph);
      ctx.fillStyle = "rgba(90,130,220,0.85)";
      ctx.fillRect(-26 * s, -4 * s, 16 * s, 8 * s);
      ctx.fillRect(10 * s, -4 * s, 16 * s, 8 * s);
      ctx.fillStyle = "rgba(200,205,215,0.9)";
      ctx.fillRect(-9 * s, -6 * s, 18 * s, 12 * s);
      ctx.restore();
      break;
    case "sun": {
      const sx = VIEW_W - 40, r = 140;
      const g = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, r * 1.8);
      g.addColorStop(0, "rgba(255,230,120,0.9)");
      g.addColorStop(0.55, "rgba(255,140,40,0.55)");
      g.addColorStop(1, "rgba(255,90,30,0)");
      ctx.fillStyle = g;
      circle(sx, sy, r * 1.8);
      ctx.fillStyle = "#ffcf4a";
      circle(sx, sy, r);
      ctx.fillStyle = "rgba(230,120,30,0.5)";
      circle(sx - 50, sy - 30, 14);
      circle(sx - 20, sy + 50, 10);
      break;
    }
    case "rock":
      ctx.fillStyle = "rgba(110,95,85,0.8)";
      circle(x, sy, 9 * s);
      ctx.fillStyle = "rgba(70,60,55,0.8)";
      circle(x + 3 * s, sy - 2 * s, 3 * s);
      break;
    case "ember": {                                  // glowing bits of lava floating up in the mantle
      const glow = 0.6 + 0.4 * Math.sin(t * 3 + b.ph);
      ctx.fillStyle = `rgba(255,${120 + 80 * glow | 0},40,${0.8 * glow})`;
      circle(x, sy, 3.5 * s);
      break;
    }
    case "jupiter": case "saturn": case "uranus": case "neptune": case "pluto":
      drawPlanet(b.kind, sy, t);
      break;
    case "earth":
      ctx.fillStyle = "#3f7fe0";
      circle(90, sy, 40);
      ctx.fillStyle = "#5cc04a";
      circle(78, sy - 10, 14);
      circle(104, sy + 12, 11);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fillRect(66, sy + 20, 30, 4);
      break;
  }
}

// Big planets hanging in the sky (Round 16): striped bands, and rings for Saturn and Uranus.
const PLANETS = {
  jupiter: { x: 130, r: 120, bands: ["#d9a066", "#f2d3a8", "#b8743a", "#f0c890", "#c98a50"], spot: "#c0503a" },
  saturn: { x: 330, r: 72, bands: ["#f2d68a", "#e0bc6a", "#f6e2a8"], ring: "rgba(240,220,170,0.85)" },
  uranus: { x: 120, r: 64, bands: ["#a8f0f0", "#90e0e8"], ring: "rgba(200,250,250,0.6)", tilt: 1.4 },
  neptune: { x: 350, r: 66, bands: ["#4a6cff", "#3a58d8", "#5a80ff"], spot: "#1a2a80" },
  pluto: { x: 140, r: 34, bands: ["#e8d8c8", "#c8b098"], heart: true },
};
function drawPlanet(kind, sy, t) {
  const P = PLANETS[kind], r = P.r, x = P.x;
  const ringPath = () => { ctx.beginPath(); ctx.ellipse(x, sy, r * 1.9, r * 0.42, P.tilt || -0.25, 0, Math.PI * 2); };
  if (P.ring) { ctx.strokeStyle = P.ring; ctx.lineWidth = r * 0.16; ringPath(); ctx.stroke(); }
  ctx.save();
  ctx.beginPath(); ctx.arc(x, sy, r, 0, Math.PI * 2); ctx.clip();
  const bh = (r * 2) / (P.bands.length * 2);
  for (let k = 0; k < P.bands.length * 2; k++) {
    ctx.fillStyle = P.bands[k % P.bands.length];
    ctx.fillRect(x - r, sy - r + k * bh, r * 2, bh + 1);
  }
  if (P.spot) { ctx.fillStyle = P.spot; ctx.beginPath(); ctx.ellipse(x + r * 0.35, sy + r * 0.3, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill(); }
  if (P.heart) { ctx.fillStyle = "#fff4e6"; ctx.beginPath(); ctx.arc(x - 6, sy + 4, 9, 0, Math.PI * 2); ctx.arc(x + 6, sy + 4, 9, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "rgba(0,0,0,0.3)";                         // the night side
  ctx.beginPath(); ctx.arc(x + r * 0.45, sy, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (P.ring) {                                              // the front half of the ring goes over the planet
    ctx.save(); ctx.beginPath(); ctx.rect(x - r * 2, sy, r * 4, r * 2); ctx.clip();
    ctx.strokeStyle = P.ring; ctx.lineWidth = r * 0.16; ringPath(); ctx.stroke();
    ctx.restore();
  }
}

// ---------- Horizons (Round 13) ----------
// Each land biome has ground on the horizon: it starts low on the screen when you enter the
// biome and sinks out of sight as you climb above it, so nothing floats in mid-air.
// snow: 0..1, how high up the snow line is (0.7 = snow on the top 30% of the tallest peaks)
function drawRidge(base, hs, amp, color, flat = false, snow = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-10, VIEW_H + 20);
  const step = (VIEW_W + 20) / (hs.length - 1);
  hs.forEach((h, k) => {
    const x = -10 + k * step, y = base - h * amp;
    if (flat) { ctx.lineTo(x - step * 0.3, y); ctx.lineTo(x + step * 0.3, y); }   // mesas: flat tops
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(VIEW_W + 10, VIEW_H + 20);
  ctx.closePath();
  ctx.fill();
  if (snow > 0) {                                     // white above the snow line
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "rgba(248,252,255,0.97)";
    ctx.fillRect(-10, -10, VIEW_W + 20, base - amp * snow + 10);
    ctx.restore();
  }
}

function drawLandscapes(t) {
  const m = (camY + VIEW_H / 2) / PX_PER_M;
  SECTIONS.forEach((sec, i) => {
    const w = sectionWeight(i);
    if (w <= 0) return;
    const p = clamp((m - sec.from) / (sec.to - sec.from), 0, 1);
    const base = lerp(VIEW_H * 0.62, VIEW_H * 1.3, p);        // the horizon sinks as you climb
    const R = RIDGES[sec.id];
    ctx.save();
    ctx.globalAlpha = w;
    switch (sec.id) {
      case "mantle": {                                   // glowing lava far below, dark rock walls
        const g = ctx.createLinearGradient(0, base - 40, 0, base + 120);
        g.addColorStop(0, "rgba(255,120,30,0)");
        g.addColorStop(1, "rgba(255,90,20,0.9)");
        ctx.fillStyle = g;
        ctx.fillRect(0, base - 40, VIEW_W, VIEW_H);
        drawRidge(base - 10, R.far, 120, "rgba(60,22,18,0.95)");
        drawRidge(base + 60, R.near, 80, "rgba(35,14,12,0.97)", true);
        ctx.fillStyle = `rgba(255,${150 + 60 * Math.sin(t * 2) | 0},40,0.9)`;      // lava cracks
        for (let k = 0; k < 5; k++) ctx.fillRect(20 + k * 100, base + 90 + (k % 2) * 20, 50, 4);
        break;
      }
      case "water": {
        ctx.fillStyle = "rgba(200,240,255,0.07)";            // sunbeams from the surface
        for (let k = 0; k < 4; k++) {
          const x = 60 + k * 120 + Math.sin(t * 0.3 + k) * 20;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, 0); ctx.lineTo(x - 40, VIEW_H); ctx.lineTo(x - 90, VIEW_H); ctx.fill();
        }
        drawRidge(base + 40, R.far, 40, "rgba(170,150,110,0.8)");       // sand dunes
        ctx.strokeStyle = "rgba(60,170,110,0.75)";                       // kelp growing from the sea floor
        ctx.lineWidth = 6;
        for (let k = 0; k < 9; k++) {
          const kx = 20 + k * 55, ky = base + 50;
          ctx.beginPath();
          for (let j = 0; j <= 8; j++) ctx.lineTo(kx + Math.sin(t * 1.5 + j * 0.7 + k) * 8, ky - j * 22);
          ctx.stroke();
        }
        break;
      }
      case "jungle":
        drawRidge(base - 30, R.far, 70, "rgba(90,150,110,0.85)");       // misty hills
        ctx.fillStyle = "rgba(40,110,50,0.95)";                          // the tree line
        for (let k = 0; k < 18; k++) {
          const x = k * 29 - 5, y = base + 10 - R.near[k] * 30;
          ctx.beginPath(); ctx.arc(x, y, 22 + R.near[k] * 12, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillRect(0, base + 10, VIEW_W, VIEW_H);
        break;
      case "mountains":
        drawRidge(base - 40, R.far, 200, "rgba(140,150,175,0.9)", false, 0.82);   // far peaks, snowy tips
        drawRidge(base + 30, R.near, 130, "rgba(100,96,104,0.97)");               // near peaks
        break;
      case "snowy":
        drawRidge(base - 40, R.far, 210, "rgba(105,125,160,0.95)", false, 0.5);   // snow halfway down
        drawRidge(base + 40, R.near, 130, "rgba(75,90,120,0.97)", false, 0.6);
        break;
      case "sky":
        ctx.fillStyle = "rgba(255,255,255,0.9)";                         // a sea of clouds below you
        for (let k = 0; k < 14; k++) {
          ctx.beginPath(); ctx.arc(k * 36 + Math.sin(t * 0.2 + k) * 6, base + 40 - R.near[k] * 30, 34, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillRect(0, base + 40, VIEW_W, VIEW_H);
        break;
      case "darksky":
        ctx.fillStyle = "rgba(40,44,70,0.95)";                           // storm clouds far below
        for (let k = 0; k < 14; k++) {
          ctx.beginPath(); ctx.arc(k * 36, base + 60 - R.near[k] * 26, 32, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillRect(0, base + 60, VIEW_W, VIEW_H);
        break;
      case "space": {
        const ey = base + 900;                                          // the curve of the Earth
        ctx.fillStyle = "rgba(120,190,255,0.35)";
        ctx.beginPath(); ctx.arc(VIEW_W / 2, ey, 970, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#2f6fd0";
        ctx.beginPath(); ctx.arc(VIEW_W / 2, ey, 950, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(90,170,80,0.8)";
        ctx.beginPath(); ctx.ellipse(VIEW_W * 0.35, base + 70, 90, 20, 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillRect(VIEW_W * 0.55, base + 60, 70, 6);
        break;
      }
      case "moon":
        drawRidge(base + 20, R.far, 30, "rgba(190,184,168,0.95)");       // the Moon's grey ground
        ctx.fillStyle = "rgba(140,134,120,0.7)";                         // craters
        for (let k = 0; k < 6; k++) {
          ctx.beginPath(); ctx.ellipse(30 + k * 85, base + 50 + (k % 2) * 30, 26, 7, 0, 0, Math.PI * 2); ctx.fill();
        }
        break;
      case "mars":
        ctx.fillStyle = "rgba(230,200,180,0.8)";                         // Mars' two tiny moons
        ctx.beginPath(); ctx.arc(110, 140, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(360, 90, 3, 0, Math.PI * 2); ctx.fill();
        drawRidge(base - 20, R.far, 90, "rgba(170,85,55,0.85)");         // red hills
        drawRidge(base + 40, R.near, 70, "rgba(130,58,38,0.95)", true);  // flat-topped mesas
        break;
    }
    ctx.restore();
  });
}

function drawBackdrop(t) {
  const weights = SECTIONS.map((_, i) => sectionWeight(i));
  for (const b of backdrop) {
    const w = weights[b.sec];
    if (w <= 0) continue;
    const sy = VIEW_H - (b.py - camY * BACK_P);
    if (sy < -300 || sy > VIEW_H + 300) continue;
    const span = VIEW_W + 200;
    const x = (((b.x + t * b.speed) % span) + span) % span - 100;
    ctx.save();
    ctx.globalAlpha = w;
    drawBackItem(b, x, sy, t);
    ctx.restore();
  }
}

// Bubbles in the sea, snow on the peaks, rain in the storm, wind and dust, and lightning.
function drawWeather(t) {
  const water = sectionWeight(secIndex("water")), snow = sectionWeight(secIndex("snowy"));
  const rain = sectionWeight(secIndex("darksky"));
  const windW = Math.max(sectionWeight(secIndex("sky")), sectionWeight(secIndex("mars")));
  const dusty = sectionWeight(secIndex("mars")) > 0.5;
  if (water > 0) {                                   // underwater: a blue tint and rising bubbles
    ctx.fillStyle = `rgba(30,110,200,${0.16 * water})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.strokeStyle = `rgba(200,240,255,${0.55 * water})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 24; i++) {
      const x = (i * 67 + Math.sin(t + i) * 8) % VIEW_W, y = VIEW_H - (i * 113 + t * 50) % (VIEW_H + 20);
      ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (snow > 0) {                                    // snowflakes drifting down
    ctx.fillStyle = `rgba(255,255,255,${0.8 * snow})`;
    for (let i = 0; i < 50; i++) {
      const x = (i * 59 + Math.sin(t * 0.8 + i) * 14) % VIEW_W, y = (i * 89 + t * 60) % VIEW_H;
      ctx.fillRect(x, y, 3, 3);
    }
  }
  if (rain > 0) {
    ctx.strokeStyle = `rgba(190,210,255,${0.35 * rain})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 60; i++) {
      const x = (i * 53 + t * 80) % VIEW_W, y = (i * 97 + t * 620) % VIEW_H;
      ctx.moveTo(x, y);
      ctx.lineTo(x - 3, y + 12);
    }
    ctx.stroke();
  }
  if (windW > 0) {
    const blowing = mode === "main" && wind.phase === "blow";
    const speed = blowing ? 900 * wind.dir : 160;
    ctx.strokeStyle = dusty ? `rgba(230,140,90,${(blowing ? 0.55 : 0.22) * windW})`
                            : `rgba(255,255,255,${(blowing ? 0.45 : 0.18) * windW})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 26; i++) {
      const x = (((i * 71 + t * speed) % (VIEW_W + 60)) + VIEW_W + 60) % (VIEW_W + 60) - 30;
      const y = (i * 131) % VIEW_H;
      ctx.moveTo(x, y);
      ctx.lineTo(x + 24, y);
    }
    ctx.stroke();
  }
  if (mode !== "main") return;
  if (storm.warn > 0) {
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = `rgba(255,255,190,${0.3 + 0.25 * Math.sin(t * 40)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(storm.x, 0); ctx.lineTo(storm.x, VIEW_H); ctx.stroke();
    ctx.restore();
    txt("!", storm.x, 60, 18, "#ffd447", "center");
  } else if (storm.strike > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 * storm.strike / 0.25})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    for (const [color, width] of [["#ffe680", 7], ["#ffffff", 3]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (let y = 0; y <= VIEW_H; y += 40) ctx.lineTo(storm.x + Math.sin(y * 0.7 + t * 50) * 10, y);
      ctx.stroke();
    }
  }
}

// The boss gate on the ledge, and the glowing barrier that blocks the way up.
function drawBossArena(t) {
  if (boss.phase === "none" || !boss.gate) return;
  const g = boss.gate, gy = toScreenY(boss.ledge.y);
  const open = boss.phase !== "waiting";
  ctx.fillStyle = "#4a4458";                         // stone arch
  rr(g.x - 6, gy - g.h - 8, g.w + 12, g.h + 8, 10);
  ctx.fill();
  const swirl = ctx.createRadialGradient(g.x + g.w / 2, gy - g.h / 2, 2, g.x + g.w / 2, gy - g.h / 2, g.w);
  swirl.addColorStop(0, open ? "#2a2238" : "#ffd447");
  swirl.addColorStop(0.5 + 0.2 * Math.sin(t * 4), open ? "#1a1626" : "#ff7a2a");
  swirl.addColorStop(1, open ? "#120f1a" : "#7a2a8a");
  ctx.fillStyle = swirl;
  rr(g.x, gy - g.h, g.w, g.h, 8);
  ctx.fill();
  if (boss.phase === "waiting") {
    txt("BOSS GATE", g.x + g.w / 2, gy - g.h - 24, 7, "#ffd447", "center");
    ctx.fillStyle = "#ffd447";                       // bouncing arrow
    const ay = gy - g.h - 34 + Math.sin(t * 6) * 4;
    ctx.beginPath(); ctx.moveTo(g.x + g.w / 2 - 6, ay - 8); ctx.lineTo(g.x + g.w / 2 + 6, ay - 8); ctx.lineTo(g.x + g.w / 2, ay); ctx.fill();
  }
  if (barrierUp()) {
    const by = toScreenY(boss.ceiling);
    if (by > -20 && by < VIEW_H + 20) {
      const glow = ctx.createLinearGradient(0, by - 16, 0, by + 16);
      glow.addColorStop(0, "rgba(255,90,60,0)");
      glow.addColorStop(0.5, `rgba(255,90,60,${0.55 + 0.25 * Math.sin(t * 8)})`);
      glow.addColorStop(1, "rgba(255,90,60,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, by - 16, VIEW_W, 32);
      txt("BEAT THE BOSS TO GO ON", VIEW_W / 2, by + 14, 7, "#ffb3a8", "center");
    }
  }
}

// A soft glow marks a boundary: blue for the edge of space, red for the danger zone.
function drawEdgeGlow(y, color) {
  const sy = toScreenY(y);
  if (sy < -60 || sy > VIEW_H + 60) return;
  const g = ctx.createLinearGradient(0, sy - 50, 0, sy + 50);
  g.addColorStop(0, `rgba(${color},0)`);
  g.addColorStop(0.5, `rgba(${color},0.22)`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, sy - 50, VIEW_W, 100);
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (c.life - c.age) / 0.6);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.scale(1, Math.cos(c.flip));                         // tumbling flip
    ctx.fillStyle = c.color;
    ctx.fillRect(-4.5, -3, 9, 6);
    ctx.restore();
  }
}

function drawRecordLines() {
  const colors = ["#ffd447", "#d7dde8", "#e39a5a"], list = board();
  for (let i = 0; i < Math.min(3, list.length); i++) {
    const s = list[i];
    if (s.moon) continue;
    const sy = toScreenY(s.height * PX_PER_M);
    if (sy < -20 || sy > VIEW_H + 20) continue;
    ctx.save();
    ctx.strokeStyle = colors[i];
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(0, sy);
    ctx.lineTo(VIEW_W, sy);
    ctx.stroke();
    ctx.restore();
    txt(`#${i + 1} ${s.initials} ${s.height} m`, VIEW_W - 22, sy - 13, 8, colors[i], "right");
  }
}

// ---------- 3D view (Round 12) ----------
// Still played flat, but drawn with depth: every platform is a solid slab whose top and
// sides recede toward a vanishing point near the middle of the screen. The point slides a
// little as you run, so the camera seems to look in at an angle.
let VIEW3D = (() => {                        // 3D is the default (Round 13); your own choice is remembered
  try { const v = localStorage.getItem("moonhop.view3d"); return v === null ? true : v === "1"; } catch (e) { return true; }
})();
function toggle3D() {
  VIEW3D = !VIEW3D;
  try { localStorage.setItem("moonhop.view3d", VIEW3D ? "1" : "0"); } catch (e) { /* just for this visit */ }
}
const DEPTH = 0.08;                          // how deep the slabs go (bigger = deeper)
const vp = { x: VIEW_W / 2, y: VIEW_H * 0.38 };
function updateVanishingPoint() {
  vp.x = VIEW_W / 2 + (player.x + PLAYER_W / 2 - VIEW_W / 2) * 0.35;
  vp.y = VIEW_H * 0.38;
}
const backPt = (x, y) => [vp.x + (x - vp.x) * (1 - DEPTH), vp.y + (y - vp.y) * (1 - DEPTH)];

function quad(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(...pts[0]);
  for (const pt of pts.slice(1)) ctx.lineTo(...pt);
  ctx.closePath();
  ctx.fill();
}

// The faces you can see behind a slab's front: its top (or bottom) and the side facing the middle.
function drawSlab(x, sy, w, h, topRGB, bodyRGB) {
  const top = sy, bot = sy + h, l = x, r = x + w;
  if (l > vp.x) quad([[l, top], [l, bot], backPt(l, bot), backPt(l, top)], mixHex(rgbHex(bodyRGB), [0, 0, 0], 0.45));
  else if (r < vp.x) quad([[r, top], [r, bot], backPt(r, bot), backPt(r, top)], mixHex(rgbHex(bodyRGB), [0, 0, 0], 0.45));
  if (top > vp.y) quad([[l, top], [r, top], backPt(r, top), backPt(l, top)], mixHex(rgbHex(topRGB), [255, 255, 255], 0.15));
  else if (bot < vp.y) quad([[l, bot], [r, bot], backPt(r, bot), backPt(l, bot)], mixHex(rgbHex(bodyRGB), [0, 0, 0], 0.6));
}
const rgbHex = c => "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");

// A soft shadow on the platform under you, smaller and fainter the higher you are.
function drawPlayerShadow() {
  const p = player, cx = p.x + PLAYER_W / 2;
  let s = p.onGround ? p.standOn : null;
  if (!s) {
    for (const c of tower) {
      if (c.y <= p.y + 1 && p.y - c.y < 400 && cx > c.x && cx < c.x + c.w && solidNow(c) && (!s || c.y > s.y)) s = c;
    }
  }
  if (!s) return;
  const sy = toScreenY(s.y), k = clamp(1 - (p.y - s.y) / 400, 0.2, 1);
  const [, by] = backPt(cx, sy);
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
  ctx.beginPath();
  ctx.ellipse(cx, (sy + by) / 2, 13 * k, Math.max(1.5, Math.abs(by - sy) / 2) * k + 1, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawDepthHaze() {                   // pushes the background back
  ctx.fillStyle = "rgba(10,12,30,0.22)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawVignette() {                    // darker edges, like a camera lens
  const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawGround(sy) {                                    // the floor of Earth's mantle: dark rock over lava
  ctx.fillStyle = "#3a1a14";
  ctx.fillRect(0, sy, VIEW_W, VIEW_H - sy + 2);
  ctx.fillStyle = "#5a2a1e";
  ctx.fillRect(0, sy, VIEW_W, 10);
  ctx.fillStyle = "#ff7a2a";                                 // glowing cracks
  for (const x of [30, 150, 280, 400]) ctx.fillRect(x, sy + 14, 36, 3);
  if (VIEW3D && sy > vp.y) {                                 // 3D: the rock floor stretches back
    quad([[0, sy], [VIEW_W, sy], backPt(VIEW_W, sy), backPt(0, sy)], "#4a2218");
  }
}

function drawSign(s, sy) {
  const label = s.kind === "pad" ? "LAST JUMP!" : `${s.mark} m`;
  ctx.font = `8px ${FONT}`;
  const w = ctx.measureText(label).width + 14;
  const x = s.x + 12;
  ctx.fillStyle = "#5a3d24";
  ctx.fillRect(x + w / 2 - 2, sy - 22, 4, 22);
  ctx.fillStyle = "#f3e3c0";
  rr(x, sy - 38, w, 18, 3);
  ctx.fill();
  ctx.strokeStyle = "#5a3d24";
  ctx.lineWidth = 2;
  ctx.stroke();
  txtPlain(label, x + w / 2, sy - 33, 8, "#3a2614", "center");
}

function drawSweeper(s, sy) {
  const sw = s.sweeper, x = sw.x, y = sy - SWEEPER_H;
  const frozen = sw.frozen > 0;
  ctx.fillStyle = "rgba(0,0,0,0.35)";                         // the track it runs along
  ctx.fillRect(s.x + 3, sy + 1, s.w - 6, 2);
  if (!frozen) {
    ctx.fillStyle = "rgba(255,212,71,0.25)";                  // speed streak behind it
    ctx.fillRect(sw.dir > 0 ? x - 10 : x + SWEEPER_W, y + 3, 10, SWEEPER_H - 6);
  }
  ctx.save();
  rr(x, y, SWEEPER_W, SWEEPER_H, 3);
  ctx.fillStyle = frozen ? "#bfefff" : "#ffd447";
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = frozen ? "#4a8fb0" : "#1a1a1a";
  ctx.lineWidth = 3;
  for (let k = -SWEEPER_H; k < SWEEPER_W + SWEEPER_H; k += 7) {
    ctx.beginPath();
    ctx.moveTo(x + k, y + SWEEPER_H);
    ctx.lineTo(x + k + SWEEPER_H, y);
    ctx.stroke();
  }
  ctx.restore();
  rr(x, y, SWEEPER_W, SWEEPER_H, 3);
  ctx.strokeStyle = frozen ? "#2a6f90" : "#5a4300";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawPlatform(s, time) {
  const sy = toScreenY(s.y);
  if (sy < -40 || sy > VIEW_H + 20) return;
  if (s.kind === "ground") { drawGround(sy); return; }
  const t = s.y / PX_PER_M;
  if (!solidNow(s)) {                                         // blinked out or crumbled away: just a faint outline
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    rr(s.x, sy, s.w, 14, 5);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (s.bouncy) {                                             // bouncy jungle mushroom
    const squish = 1 + Math.sin(time * 4 + s.x) * 0.04;
    ctx.fillStyle = "#f3e3c0";                                // stem
    ctx.fillRect(s.x + s.w / 2 - 6, sy + 6, 12, 14);
    ctx.fillStyle = "#e8423a";                                // red cap
    ctx.beginPath();
    ctx.ellipse(s.x + s.w / 2, sy + 8, s.w / 2, 12 * squish, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(s.x, sy + 7, s.w, 4);
    ctx.fillStyle = "#ffffff";                                // white spots
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(s.x + i * s.w / 4, sy + (i === 2 ? -1 : 3), 3, 0, Math.PI * 2);
      ctx.fill();
    }
    return;
  }
  ctx.save();
  if (s.blink) {                                              // flickers just before it blinks out
    const ph = (runTime + s.blinkPh) % BLINK_CYCLE;
    if (ph > BLINK_ON - 0.5) ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(time * 25));
  }
  if (s.crumbleT > 0) ctx.translate((Math.random() - 0.5) * 3, 0);   // shaking before it falls
  if (s.amp) {                                                // thrusters under moving platforms
    const flick = 0.55 + 0.45 * Math.sin(time * 30 + s.phase);
    ctx.fillStyle = `rgba(120,220,255,${0.5 * flick})`;
    for (const ex of [s.x + 8, s.x + s.w - 8]) {
      ctx.beginPath();
      ctx.ellipse(ex, sy + 17, 4, 5 + 3 * flick, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (VIEW3D) drawSlab(s.x, sy, s.w, 14, gradientAt(PLAT_TOP, t), gradientAt(PLAT_BODY, t));   // 3D sides and top
  ctx.fillStyle = rgb(gradientAt(PLAT_BODY, t));
  rr(s.x, sy, s.w, 14, 5);
  ctx.fill();
  ctx.fillStyle = rgb(gradientAt(PLAT_TOP, t));
  rr(s.x, sy, s.w, 5, 3);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(s.x + 5, sy + 10, s.w - 10, 2);
  if (s.crumble) {                                            // cracks: this one will crumble
    ctx.strokeStyle = "rgba(20,20,30,0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x + s.w * 0.3, sy);
    ctx.lineTo(s.x + s.w * 0.36, sy + 6);
    ctx.lineTo(s.x + s.w * 0.3, sy + 13);
    ctx.moveTo(s.x + s.w * 0.7, sy);
    ctx.lineTo(s.x + s.w * 0.64, sy + 7);
    ctx.stroke();
  }
  if (s.icy) {                                                // slippery ice: pale blue with a shine
    ctx.fillStyle = "rgba(170,225,255,0.85)";
    rr(s.x, sy, s.w, 6, 3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(s.x + 6, sy + 1, Math.min(14, s.w / 3), 2);
  }
  if (s.blink) {                                              // a soft glow
    ctx.fillStyle = "rgba(120,255,200,0.25)";
    rr(s.x - 3, sy - 3, s.w + 6, 20, 8);
    ctx.fill();
  }
  ctx.restore();
  if (s.kind === "ledge" || s.kind === "pad") drawSign(s, sy);
  if (s.kind === "ledge" && mode === "main") {                 // checkpoint flag: red, then green once reached
    const fx = s.x + s.w / 2 + 6, got = checkpoint && checkpoint.y >= s.y;
    ctx.fillStyle = "#d8d8e0";
    ctx.fillRect(fx, sy - 30, 2, 30);
    ctx.fillStyle = got ? "#7dff7a" : "#ff5a5a";
    ctx.beginPath();
    ctx.moveTo(fx + 2, sy - 30);
    ctx.lineTo(fx + 16, sy - 25 + Math.sin(time * 6 + s.x) * 1.5);
    ctx.lineTo(fx + 2, sy - 20);
    ctx.fill();
  }
  if (s.sweeper) drawSweeper(s, sy);
}

function drawCloudPlat(c) {
  const sy = toScreenY(c.y);
  ctx.save();
  ctx.globalAlpha = Math.min(1, c.life);
  if (c.kind === "bubble") {                                  // the dog's Bubble Bounce
    ctx.fillStyle = "rgba(150,220,255,0.55)";
    ctx.beginPath();
    ctx.ellipse(c.x + c.w / 2, sy + 6, c.w / 2, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillRect(c.x + c.w * 0.3, sy + 1, 8, 3);
    ctx.restore();
    return;
  }
  if (c.kind === "rainbow") {                                 // the dog's Rainbow Bridge
    ["#ff5a5a", "#ff9f40", "#ffd447", "#7dff7a", "#5a9bff", "#a565f0"].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.fillRect(c.x, sy + i * 2.5, c.w, 2.5);
    });
    ctx.restore();
    return;
  }
  ctx.fillStyle = "#ffffff";
  rr(c.x, sy, c.w, 10, 5);
  ctx.fill();
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(c.x + 12 + i * (c.w - 24) / 3, sy + 2, 9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    const a = q.life / q.max;
    ctx.fillStyle = `rgba(${q.color},${0.7 * a})`;
    ctx.beginPath();
    ctx.arc(q.x, toScreenY(q.y), 1.5 + 2 * a, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Gift-givers: Mommy's poppy in the jungle, and something different in every other biome.
function drawPoppy(f, t) {
  const sy = toScreenY(f.y);
  if (sy < -40 || sy > VIEW_H + 30) return;
  const look = f.giver ? f.giver.look : "poppy";
  if (look !== "poppy") { drawGiver(f, look, sy, t); return; }
  const hx = f.x + Math.sin(t * 1.6 + f.ph) * 2, hy = sy - 20;
  ctx.strokeStyle = "#3f8f3a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(f.x, sy);
  ctx.quadraticCurveTo(f.x - 2, sy - 10, hx, hy);
  ctx.stroke();
  ctx.fillStyle = "#4fae45";
  ctx.beginPath();
  ctx.ellipse(f.x + 4, sy - 7, 5, 2.2, -0.6, 0, Math.PI * 2);
  ctx.fill();
  // Petals shrink right after shooting, then grow back.
  const grow = 1 - 0.6 * clamp(f.cool / POPPY_COOLDOWN, 0, 1);
  const pr = 6.5 * grow * (1 + f.bounce * 0.35);
  ctx.fillStyle = "#e8322b";
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    ctx.beginPath();
    ctx.arc(hx + Math.cos(a) * pr * 0.75, hy + Math.sin(a) * pr * 0.75, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#2a1414";
  ctx.beginPath();
  ctx.arc(hx, hy, 2.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawGiver(f, look, sy, t) {
  const x = f.x, grow = 1 - 0.5 * clamp(f.cool / POPPY_COOLDOWN, 0, 1), pop = 1 + f.bounce * 0.3;
  const dot = (cx, cy, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  const stem = h => {
    ctx.strokeStyle = "#3f8f3a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + Math.sin(t * 1.6 + f.ph) * 2, sy - h); ctx.stroke();
  };
  const crystal = (c1, c2) => {
    for (const [dx, h, w] of [[-5, 14, 5], [0, 22, 6], [6, 16, 5]]) {
      ctx.fillStyle = dx === 0 ? c1 : c2;
      ctx.beginPath(); ctx.moveTo(x + dx - w, sy); ctx.lineTo(x + dx, sy - h * grow * pop); ctx.lineTo(x + dx + w, sy); ctx.fill();
    }
  };
  switch (look) {
    case "clam": {                                    // a clam that opens to show its pearl
      const open = 4 + 4 * grow * pop;
      ctx.fillStyle = "#e8a8c0";
      ctx.beginPath(); ctx.ellipse(x, sy - 4, 11, 5, 0, 0, Math.PI); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x, sy - 4 - open, 11, 5, 0, Math.PI, 0); ctx.fill();
      if (grow > 0.8) dot(x, sy - 6, 3, "#ffffff");
      break;
    }
    case "crystal": crystal("#9fe0ff", "#5aa8e0"); break;
    case "redcrystal": crystal("#ff9a7a", "#d0503a"); break;
    case "snowflower":
      stem(18);
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + t;
        dot(x + Math.cos(a) * 5 * grow * pop, sy - 20 + Math.sin(a) * 5 * grow * pop, 3.5 * grow, "#f4fbff");
      }
      dot(x, sy - 20, 2.5, "#7ac8ff");
      break;
    case "dandelion":
      stem(20);
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(x, sy - 22, 8 * grow * pop, 0, Math.PI * 2); ctx.fill();
      dot(x, sy - 22, 2, "#d8d0a0");
      break;
    case "orb":                                       // a crackling storm orb on a pedestal
      ctx.fillStyle = "#4a4458"; ctx.fillRect(x - 4, sy - 10, 8, 10);
      dot(x, sy - 16, 7 * grow * pop, `rgba(255,230,90,${0.6 + 0.3 * Math.sin(t * 12)})`);
      dot(x, sy - 16, 3, "#ffffff");
      break;
    case "dish":                                      // a little satellite dish
      ctx.fillStyle = "#9aa3b8"; ctx.fillRect(x - 2, sy - 10, 4, 10);
      ctx.save(); ctx.translate(x, sy - 14); ctx.rotate(-0.5 + Math.sin(t) * 0.2);
      ctx.beginPath(); ctx.ellipse(0, 0, 10 * pop, 5, 0, 0, Math.PI); ctx.fill();
      ctx.restore();
      dot(x + 3, sy - 18, 2.5 * grow, "#c8a0ff");
      break;
    case "moonrock":
      dot(x, sy - 6, 8, "#cfc8b0");
      dot(x - 2, sy - 8, 2, "#a8a090");
      dot(x, sy - 12, 4 * grow * pop, `rgba(255,250,220,${0.4 + 0.3 * Math.sin(t * 4)})`);
      break;
    case "sunflower":
      stem(20);
      ctx.fillStyle = "#ffd447";
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * 7 * grow * pop, sy - 22 + Math.sin(a) * 7 * grow * pop, 4, 2.2, a, 0, Math.PI * 2); ctx.fill();
      }
      dot(x, sy - 22, 4, "#7a4a1a");
      break;
    case "starshard":
      ctx.strokeStyle = "#7a5aa8"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, sy - 14); ctx.stroke();
      drawStar(x, sy - 20, 8 * grow * pop, "#c39bff", t);
      break;
  }
}

// One gift flying through the air, drawn as whatever its giver shoots.
function drawGift(q, alpha) {
  const sx = q.x, sy = toScreenY(q.y), c = q.color || "238,58,47";
  if (!q.item || q.item === "petal") { drawPetal(sx, sy, q.rot, 1.3, alpha); return; }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(sx, sy);
  ctx.rotate(q.rot);
  ctx.fillStyle = `rgb(${c})`;
  ctx.strokeStyle = `rgb(${c})`;
  switch (q.item) {
    case "pearl": case "dust":
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fillRect(-2, -3, 2, 2);
      break;
    case "shard":
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(4, 0); ctx.lineTo(0, 7); ctx.lineTo(-4, 0); ctx.fill();
      break;
    case "flake":
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.stroke(); }
      break;
    case "seed":
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 7); ctx.stroke();
      ctx.globalAlpha = alpha * 0.8;
      ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
      break;
    case "spark":
      ctx.beginPath(); ctx.moveTo(-2, -7); ctx.lineTo(3, -1); ctx.lineTo(0, 0); ctx.lineTo(2, 7); ctx.lineTo(-3, 1); ctx.lineTo(0, 0); ctx.fill();
      break;
    case "star":
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = alpha;
      drawStar(sx, sy, 7, `rgb(${c})`, q.rot);
      break;
  }
  ctx.restore();
}

function drawPetal(x, y, rot, size, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = "#ee3a2f";
  ctx.beginPath();
  ctx.ellipse(0, 0, 6 * size, 3.8 * size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7a1010";
  ctx.beginPath();
  ctx.arc(-3.6 * size, 0, 1.6 * size, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPetals() {
  for (const q of petals) {
    drawGift(q, Math.min(1, (PETAL_LIFE - q.age) / 0.8));
  }
}

function drawEnemy(e, t) {
  const sy = toScreenY(e.y);
  if (sy < -40 || sy > VIEW_H + 40) return;
  const r = e.r;
  // Eyes look at you.
  const lx = player.x + PLAYER_W / 2 - e.x, ly = -(player.y + PLAYER_H / 2 - e.y);
  const ld = Math.hypot(lx, ly) || 1;
  const ex = lx / ld * 1.6, ey = ly / ld * 1.6;
  const eyes = (y, gap, size, angry) => {
    for (const s of [-1, 1]) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s * gap, y, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1a1030";
      ctx.beginPath();
      ctx.arc(s * gap + ex, y + ey, size * 0.55, 0, Math.PI * 2);
      ctx.fill();
      if (angry) {
        ctx.strokeStyle = "#1a1030";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s * (gap + size), y - size - 2);
        ctx.lineTo(s * (gap - size * 0.6), y - size + 1);
        ctx.stroke();
      }
    }
  };

  if (e.warn > 0) {                                  // a flare is coming: blinking arrow at the right edge
    if (Math.floor(e.warn * 8) % 2 === 0) {
      ctx.fillStyle = "#ff9f40";
      ctx.beginPath();
      ctx.moveTo(VIEW_W - 22, sy);
      ctx.lineTo(VIEW_W - 6, sy - 9);
      ctx.lineTo(VIEW_W - 6, sy + 9);
      ctx.closePath();
      ctx.fill();
    }
    return;
  }
  ctx.save();
  ctx.translate(e.x, sy);
  if (e.type === "boss" && e.kind === "golem") {     // BOULDER BULLY (mini boss)
    const angry = e.hp <= e.maxHp / 2, bob = Math.sin(t * 4) * 3;
    ctx.fillStyle = "#7a746c";                       // rock fists
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(s * (r + 10), 8 + bob * s, 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = angry ? "#8a6a60" : "#8c867c";   // lumpy rock body
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5, rad = r * (0.88 + 0.12 * Math.sin(i * 3.1));
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#5fae4a";                       // moss on top
    ctx.beginPath(); ctx.ellipse(0, -r * 0.75, r * 0.7, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(40,36,32,0.7)";          // cracks
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.1); ctx.lineTo(-r * 0.2, r * 0.4); ctx.lineTo(-r * 0.35, r * 0.7); ctx.stroke();
    eyes(-4, 10, 5, true);
    ctx.strokeStyle = "#2a2420";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 14); ctx.lineTo(9, 14); ctx.stroke();
  } else if (e.type === "boss" && e.kind === "void") {   // THE BLACK HOLE (final boss)
    const angry = e.hp <= e.maxHp / 2;
    const glow = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 2);
    glow.addColorStop(0, angry ? "rgba(255,90,160,0.55)" : "rgba(170,90,255,0.5)");
    glow.addColorStop(1, "rgba(80,20,140,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.save();                                      // spinning ring of glowing dust
    ctx.rotate(t * 1.5);
    for (const [w, color] of [[7, angry ? "#ff6ab4" : "#c39bff"], [3, "#ffffff"]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.45, r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = "#05010a";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    eyes(-6, 12, 6, true);
  } else if (e.type === "boss") {                    // THE SUN KING
    const angry = e.hp <= e.maxHp / 2;
    ctx.fillStyle = angry ? "#ff5a3a" : "#ffb347";
    for (let i = 0; i < 12; i++) {                   // flickering flames all around
      const a = i * Math.PI / 6 + t * 1.5, len = r + 10 + Math.sin(t * 12 + i * 1.7) * 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.22) * r * 0.9, Math.sin(a - 0.22) * r * 0.9);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.lineTo(Math.cos(a + 0.22) * r * 0.9, Math.sin(a + 0.22) * r * 0.9);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(-8, -8, 4, 0, 0, r);
    g.addColorStop(0, "#fff3b0");
    g.addColorStop(1, angry ? "#ff7a2a" : "#ffb02e");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd447";                       // crown
    ctx.beginPath();
    ctx.moveTo(-18, -r + 4); ctx.lineTo(-18, -r - 14); ctx.lineTo(-9, -r - 4); ctx.lineTo(0, -r - 18);
    ctx.lineTo(9, -r - 4); ctx.lineTo(18, -r - 14); ctx.lineTo(18, -r + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.arc(0, -r - 6, 3, 0, Math.PI * 2); ctx.fill();
    eyes(-6, 11, 6, true);
    ctx.strokeStyle = "#5a1a0a";                     // grumpy mouth
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 18, 9, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  } else if (e.type === "asteroid") {
    ctx.rotate(e.t * e.spin);
    ctx.fillStyle = e.rock ? "#8c867c" : "#8a7864";
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i * Math.PI * 2 / 9, rad = r * (0.8 + 0.2 * Math.sin(i * 2.7 + e.ph));
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(60,48,40,0.6)";
    ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.2, r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, r * 0.3, r * 0.18, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === "flare") {
    ctx.rotate(Math.atan2(e.vy, -e.vx));             // tail trails behind it
    const tail = ctx.createLinearGradient(0, 0, 40, 0);
    tail.addColorStop(0, e.tint ? `rgba(${e.tint},0.8)` : "rgba(255,170,60,0.8)");
    tail.addColorStop(1, e.tint ? `rgba(${e.tint},0)` : "rgba(255,90,40,0)");
    ctx.fillStyle = tail;
    ctx.beginPath(); ctx.ellipse(18, 0, 22, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.tint ? `rgb(${e.tint})` : "#ffd447";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-2, -2, r * 0.45, 0, Math.PI * 2); ctx.fill();
  } else if (ENEMY_INFO[e.type].art === "spike") {   // obstacles: a spinning spiky ball
    ctx.rotate(e.t * 3);
    ctx.fillStyle = "#5a6178";
    ctx.beginPath();
    for (let k = 0; k < 16; k++) {
      const a = k * Math.PI / 8, rad = k % 2 ? r * 0.7 : r * 1.35;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = e.flash > 0 ? "#ffffff" : ENEMY_INFO[e.type].fill;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
  } else if (ENEMY_INFO[e.type].art === "cloud") {   // grumpy clouds, rock bats, snow puffs
    ctx.fillStyle = ENEMY_INFO[e.type].fill;
    for (const [cx, cy, cr] of [[-r * 0.55, 3, r * 0.6], [r * 0.55, 3, r * 0.6], [0, -r * 0.25, r * 0.75], [0, 4, r * 0.7]]) {
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fill();
    }
    eyes(-1, 5, 3.4, true);
  } else if (ENEMY_INFO[e.type].art === "bug") {     // buzz bugs
    const flap = Math.abs(Math.sin(t * 40 + e.ph));
    ctx.fillStyle = "rgba(220,240,255,0.75)";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * 4, -r * 0.9, 4, 7 * flap + 2, s * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = ENEMY_INFO[e.type].fill;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-r * 0.35, -r, 4, r * 2);
    ctx.fillRect(r * 0.25, -r, 4, r * 2);
    ctx.restore();
    eyes(-2, 4, 2.8, false);
  } else if (ENEMY_INFO[e.type].art === "fish") {    // puffer fish (puffs up when you're close)
    const info = ENEMY_INFO[e.type];
    const puffed = Math.hypot(player.x + PLAYER_W / 2 - e.x, player.y + PLAYER_H / 2 - e.y) < 120;
    const rr2 = r * (puffed ? 1.15 : 0.9), face = Math.cos(e.t * 2 * Math.PI / (e.period || 5) + e.ph) >= 0 ? 1 : -1;
    ctx.fillStyle = info.fill;
    ctx.beginPath(); ctx.moveTo(-face * rr2, 0); ctx.lineTo(-face * (rr2 + 9), -7); ctx.lineTo(-face * (rr2 + 9), 7); ctx.fill();
    if (info.spiky && puffed) {
      ctx.strokeStyle = "#b8862a";
      ctx.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); ctx.lineTo(Math.cos(a) * (rr2 + 5), Math.sin(a) * (rr2 + 5)); ctx.stroke();
      }
    }
    ctx.fillStyle = info.fill;
    ctx.beginPath(); ctx.arc(0, 0, rr2, 0, Math.PI * 2); ctx.fill();
    eyes(-3, 5, 3, puffed);
  } else if (ENEMY_INFO[e.type].art === "ufo") {     // flying saucers
    const info = ENEMY_INFO[e.type];
    ctx.fillStyle = info.dome;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(0, -3, r * 0.55, Math.PI, 0); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = info.fill;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.2, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = -2; i <= 2; i++) {                  // blinking lights
      ctx.fillStyle = Math.floor(t * 6 + i) % 2 ? "#ffd447" : "#ff5a5a";
      ctx.beginPath(); ctx.arc(i * r * 0.4, 2, 2, 0, Math.PI * 2); ctx.fill();
    }
    eyes(-6, 4, 2.4, true);
  } else if (ENEMY_INFO[e.type].art === "flame") {   // sparks, dust devils, fire sprites, comets
    const info = ENEMY_INFO[e.type];
    ctx.fillStyle = info.fill;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const a = Math.PI + i * Math.PI / 10, flick = 1 + Math.sin(t * 18 + i * 2.1) * 0.25;
      ctx.lineTo(Math.cos(a) * r * (i % 2 ? 1.5 * flick : 0.9), Math.sin(a) * r * (i % 2 ? 1.5 * flick : 0.9));
    }
    ctx.arc(0, 0, r * 0.9, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = info.core;
    ctx.beginPath(); ctx.arc(0, 2, r * 0.5, 0, Math.PI * 2); ctx.fill();
    eyes(-1, 4, 2.6, true);
  } else if (ENEMY_INFO[e.type].art === "eye") {     // void eyes at the black hole
    ctx.fillStyle = "rgba(195,155,255,0.35)";
    ctx.beginPath(); ctx.arc(0, 0, r + 5 + Math.sin(t * 5) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ENEMY_INFO[e.type].fill;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.75, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a565f0";
    ctx.beginPath(); ctx.arc(ex * 2, ey * 2, r * 0.35, 0, Math.PI * 2); ctx.fill();   // it watches you
    ctx.fillStyle = "#05010a";
    ctx.beginPath(); ctx.arc(ex * 2, ey * 2, r * 0.16, 0, Math.PI * 2); ctx.fill();
  } else if (ENEMY_INFO[e.type].art === "bird") {    // swoopers, parrots, hawks, ice birds...
    const flap = Math.sin(t * (e.mode === "dive" ? 30 : 12) + e.ph) * 7;
    ctx.fillStyle = ENEMY_INFO[e.type].wing;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 5, 0);
      ctx.lineTo(s * (r + 9), -6 + flap);
      ctx.lineTo(s * (r + 2), 5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = ENEMY_INFO[e.type].fill;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.8, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff9f40";
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(4, 4);
    ctx.lineTo(0, 11);
    ctx.closePath();
    ctx.fill();
    eyes(-3, 4, 3, true);
  } else {                                           // jellies (space jelly, jellyfish, aliens)
    const c = ENEMY_INFO[e.type].fill;
    ctx.strokeStyle = `rgba(${c},0.8)`;
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 5, 2);
      for (let k = 1; k <= 4; k++) ctx.lineTo(i * 5 + Math.sin(t * 4 + k + i) * 3, 2 + k * 5);
      ctx.stroke();
    }
    const g = ctx.createRadialGradient(0, -4, 2, 0, -2, r);
    g.addColorStop(0, "rgba(255,240,250,0.95)");
    g.addColorStop(1, `rgba(${c},0.8)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 2, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    eyes(-4, 5, 2.6, false);
  }
  if (e.frozen > 0) {
    ctx.strokeStyle = "rgba(140,220,255,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (e.burn > 0) {
    ctx.fillStyle = `rgba(255,140,40,${0.25 + 0.2 * Math.sin(t * 20)})`;
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
    ctx.fill();
  }
  if (e.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    ctx.arc(0, 0, r + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  if (e.hp < e.maxHp && !e.boss) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(-12, -r - 10, 24, 4);
    ctx.fillStyle = "#ff5a5a";
    ctx.fillRect(-12, -r - 10, 24 * e.hp / e.maxHp, 4);
  }
  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    const sy = toScreenY(s.y);
    const color = s.big ? "255,107,213" : s.drone ? "143,227,255" : "255,224,102";
    ctx.fillStyle = `rgba(${color},0.3)`;
    ctx.beginPath();
    ctx.arc(s.x, sy, s.size * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgb(${color})`;
    ctx.beginPath();
    ctx.arc(s.x, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEffects() {
  for (const g of rings) {
    const k = 1 - g.life / 0.35;
    ctx.strokeStyle = `rgba(${g.color},${1 - k})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(g.x, toScreenY(g.y), g.r * (0.3 + 0.7 * k), 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const z of zaps) {
    ctx.strokeStyle = `rgba(140,230,255,${z.life / 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(z.x1, toScreenY(z.y1));
    for (let k = 1; k < 5; k++) {
      ctx.lineTo(lerp(z.x1, z.x2, k / 5) + (Math.random() - 0.5) * 10, toScreenY(lerp(z.y1, z.y2, k / 5)) + (Math.random() - 0.5) * 10);
    }
    ctx.lineTo(z.x2, toScreenY(z.y2));
    ctx.stroke();
  }
  for (const f of texts) {
    ctx.globalAlpha = Math.min(1, f.life / 0.4);
    txt(f.str, f.x, toScreenY(f.y), 8, f.color, "center");
    ctx.globalAlpha = 1;
  }
}

// The astronaut, in your character's colors and hat. Drawn facing right with
// the feet at (0, 0); the caller moves, flips and sizes it.
function drawAstronaut(c, air, swing) {
  const suit = PALETTE[c.suit], black = [0, 0, 0], white = [255, 255, 255];

  ctx.fillStyle = PALETTE[c.pack];                        // backpack
  rr(-13, -22, 6, 13, 2);
  ctx.fill();

  ctx.fillStyle = mixHex(suit, black, 0.15);              // legs
  rr(-7, -9 - (air ? 2 : Math.max(0, swing)), 5, 9, 2);
  ctx.fill();
  rr(2, -9 - (air ? 3 : Math.max(0, -swing)), 5, 9, 2);
  ctx.fill();

  ctx.fillStyle = suit;                                   // body
  ctx.strokeStyle = mixHex(suit, black, 0.4);
  ctx.lineWidth = 1.5;
  rr(-10, -23, 20, 16, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#ff6b5a";
  ctx.fillRect(1, -18, 4, 3);

  ctx.fillStyle = "#59617a";                              // blaster
  ctx.fillRect(6, -16, 9, 4);

  ctx.fillStyle = suit;                                   // helmet + visor
  ctx.beginPath();
  ctx.arc(0, -27, 9.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  const vg = ctx.createLinearGradient(0, -32, 0, -22);
  vg.addColorStop(0, mixHex(PALETTE[c.visor], white, 0.45));
  vg.addColorStop(1, mixHex(PALETTE[c.visor], black, 0.55));
  ctx.fillStyle = vg;
  rr(0, -31, 9, 8, 3.5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(3, -30, 2, 2);
  drawHat(c);
}

function drawHat(c) {
  const hc = PALETTE[c.hatColor], dark = mixHex(hc, [0, 0, 0], 0.35);
  const poly = (pts, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(...pts[0]);
    for (const pt of pts.slice(1)) ctx.lineTo(...pt);
    ctx.closePath();
    ctx.fill();
  };
  const dot = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
  switch (HATS[c.hat]) {
    case "CAP":
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.arc(0, -34, 8.5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(2, -35, 12, 3);
      break;
    case "CROWN":
      poly([[-8, -34], [-8, -43], [-4, -38], [0, -45], [4, -38], [8, -43], [8, -34]], "#ffd447");
      dot(0, -40, 1.5, "#ff5a5a");
      break;
    case "PARTY HAT":
      poly([[-7, -35], [7, -35], [1, -52]], hc);
      ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(-3, -42, 7, 2);
      dot(1, -52, 2.5, "#ffffff");
      break;
    case "BOW":
      poly([[0, -37], [-9, -42], [-9, -32]], hc);
      poly([[0, -37], [9, -42], [9, -32]], hc);
      dot(0, -37, 2.5, dark);
      break;
    case "ANTENNA":
      ctx.strokeStyle = "#59617a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(3, -47); ctx.stroke();
      dot(3, -48, 3, hc);
      break;
    case "COWBOY HAT":
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.ellipse(0, -35, 15, 3, 0, 0, Math.PI * 2); ctx.fill();
      rr(-7, -45, 14, 10, 3); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(-7, -38, 14, 2);
      break;
    case "FLOWER":
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        dot(-5 + Math.cos(a) * 3.5, -36 + Math.sin(a) * 3.5, 2.8, hc);
      }
      dot(-5, -36, 2, "#ffd447");
      break;
  }
}

function drawPlayer(t) {
  const p = player;
  const sy = toScreenY(p.y);
  if (sy < -60 || sy > VIEW_H + 60) return;
  const cx = p.x + PLAYER_W / 2;

  if (p.starTime > 0) {                                  // Star Power glow
    ctx.fillStyle = `hsla(${(t * 360) % 360},100%,60%,0.35)`;
    ctx.beginPath();
    ctx.arc(cx, sy - 16, 26, 0, Math.PI * 2);
    ctx.fill();
  }
  if (st.drone) {                                        // Helper Drone
    const dy = toScreenY(drone.y);
    ctx.fillStyle = "#9aa3b8";
    rr(drone.x - 8, dy - 4, 16, 8, 3);
    ctx.fill();
    ctx.fillStyle = "#8fe3ff";
    ctx.fillRect(drone.x - 2, dy - 2, 4, 3);
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    const w = 9 * Math.abs(Math.sin(t * 30));
    ctx.beginPath();
    ctx.moveTo(drone.x - w, dy - 7);
    ctx.lineTo(drone.x + w, dy - 7);
    ctx.stroke();
  }

  const blink = p.invuln > 0 && p.starTime <= 0 && Math.floor(t * 12) % 2 === 0;
  ctx.save();
  if (blink) ctx.globalAlpha = 0.45;
  const sq = p.squash, k = st.tiny ? 0.8 : 1;
  ctx.translate(cx, sy);
  ctx.scale(p.facing / Math.sqrt(sq) * k, sq * k);

  const air = !p.onGround;
  const swing = p.onGround && Math.abs(p.vx) > 20 ? Math.sin(p.walk) * 2.5 : 0;
  drawAstronaut(currentChar(), air, swing);
  ctx.restore();

  if (st.shield && p.shieldReady) {                      // Bubble Shield
    ctx.strokeStyle = "rgba(140,220,255,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, sy - 16, 22, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (st.moonlet) {                                      // Orbiting Moonlet
    const m = moonletPos(), my = toScreenY(m.y);
    ctx.fillStyle = "#d8d2bd";
    ctx.beginPath();
    ctx.arc(m.x, my, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(150,140,115,0.6)";
    ctx.beginPath();
    ctx.arc(m.x - 2, my - 1, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Saved super jumps circle your helmet.
  for (let i = 0; i < boosts; i++) {
    const a = t * 3 + i * (Math.PI * 2 / Math.max(3, st.boostMax));
    drawPetal(cx + Math.cos(a) * 17, sy - 27 + Math.sin(a) * 6, a, 0.7);
  }
}

function drawDog(t) {
  const sy = toScreenY(dog.y) + Math.sin(t * 3) * 3;      // gentle bobbing
  if (sy < -40 || sy > VIEW_H + 40) return;
  drawDogAt(dog.x, sy, dog.facing, 1.1, t);
}

function drawDogAt(x, sy, facing, scale, t) {
  const black = "#1b1b22";
  const wingHex = PALETTE[currentChar().wings];
  const flap = Math.sin(t * 18);
  const wing = (x, color, lean) => {
    ctx.save();
    ctx.translate(x, -4);
    ctx.rotate(lean + flap * 0.5);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, -6, 4, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };
  const ellipse = (x, y, rx, ry, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  };
  ctx.save();
  ctx.translate(x, sy);
  ctx.scale(facing * scale, scale);

  wing(-4, mixHex(wingHex, [0, 0, 0], 0.25), -0.6);       // back wing
  ctx.save();                                              // teeny crank tail, whirling
  ctx.translate(-9, -3);
  ctx.rotate(t * 25);
  ctx.strokeStyle = black;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(3.5, 0);
  ctx.stroke();
  ctx.restore();
  for (const lx of [-6, -2, 3, 6]) {                       // little legs with white paws
    ctx.fillStyle = black;
    ctx.fillRect(lx, 3, 2.2, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(lx, 6, 2.2, 1.6);
  }
  ellipse(0, 0, 9.5, 6, black);                            // body
  ellipse(5, 2, 4, 3.5, "#ffffff");                        // white chest
  wing(0, wingHex, -0.2);                                  // front wing

  ellipse(10, -6, 6.5, 6.5, black);                        // head
  for (const [a, b, c] of [[[5, -10], [4, -19], [9, -12]], [[10, -12], [13, -19], [15, -10]]]) {   // bat ears
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2a3b3";
    ctx.beginPath();
    ctx.moveTo(a[0] * 0.75 + b[0] * 0.25 + 0.5, a[1] * 0.75 + b[1] * 0.25);
    ctx.lineTo(b[0], b[1] + 3);
    ctx.lineTo(c[0] * 0.75 + b[0] * 0.25 - 0.5, c[1] * 0.75 + b[1] * 0.25);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "#ffffff";                               // white blaze down the face
  ctx.fillRect(10.5, -12.5, 2, 6);
  ellipse(14, -4, 3.8, 2.9, "#ffffff");                    // muzzle
  ellipse(17.2, -5, 1.4, 1.2, black);                      // nose
