        p.spellSel = p.spells.length - 1;
        newSpell = SPELLS[si].name;
      }
    }
    if (sectionFlash > 0) sectionFlash -= dt;
    updateSections(dt);
    updateBoss(dt);

    const best = scores[0];
    if (!passedRecord && best && !best.moon && Math.floor(maxHeightPx / PX_PER_M) > best.height) {
      passedRecord = true;
      recordFlash = 2.5;
    }
    if (recordFlash > 0) recordFlash -= dt;

    // Every 100 m: time to pick an upgrade
    const reached = Math.floor(maxHeightPx / (UPGRADE_EVERY_M * PX_PER_M));
    while (milestonesDone < reached && (milestonesDone + 1) * UPGRADE_EVERY_M < MOON_METERS) {
      milestonesDone++;
      pendingPicks++;
      onMilestone();
    }

    if (state === "playing" && p.y + PLAYER_H < camY - 4) fellOff();   // you win by beating the Black Hole
    if (state === "playing" && pendingPicks > 0 && onSafeGround() && !bossActive()) openChoice();
    }
  }
  if (state === "editor") {
    const dir = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
    ed.camY = clamp(ed.camY + dir * 700 * dt, CAM_MIN, EDIT_MAX_Y - VIEW_H + 200);
    camY = ed.camY;
    if (ed.msgT > 0) ed.msgT -= dt;
  }
  if (state === "credits") creditsT += dt;
  if (state === "choose" && choice.delay > 0) choice.delay -= dt;
  if (state === "over" && overTimer > 0) overTimer -= dt;
  if (state !== "paused" && state !== "choose") {
    updateConfetti(dt);
    updateEffects(dt);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vy -= 200 * dt;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
}

// =====================================================================
//  DRAWING
// =====================================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, rgb(gradientAt(SKY, (camY + VIEW_H) / PX_PER_M)));
  g.addColorStop(1, rgb(gradientAt(SKY, camY / PX_PER_M)));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawStars(t) {
  const vis = clamp(((camY + VIEW_H / 2) / PX_PER_M - 820) / 80, 0, 1);    // stars come out high in the atmosphere
  if (vis <= 0) return;
  for (const s of stars) {
    const sy = (s.y + camY * s.d) % VIEW_H;
    ctx.fillStyle = `rgba(255,255,255,${vis * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph))})`;
    ctx.fillRect(s.x, sy, s.r, s.r);
  }
}

// The goal: far away the Black Hole hangs small at the top of the sky, and it
// grows as you climb toward it. (Underwater it's hidden by the sea.)
function drawMoon(t) {
  const HANG_Y = 110;
  const realY = toScreenY(MOON_Y + MOON_R);
  let cy, r;
  if (realY >= HANG_Y) { cy = realY; r = MOON_R; }
  else { cy = HANG_Y; r = MOON_R / (1 + (HANG_Y - realY) / 1400); }
  const cx = VIEW_W / 2;
  const seen = clamp(((camY + VIEW_H / 2) / PX_PER_M - 100) / 60, 0, 1);
  if (seen <= 0) return;
  ctx.save();
  ctx.globalAlpha = seen;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 2.4);
  glow.addColorStop(0, "rgba(180,100,255,0.45)");
  glow.addColorStop(1, "rgba(80,20,140,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.4);
  ctx.strokeStyle = "rgba(220,160,255,0.85)";
  ctx.lineWidth = Math.max(1.5, r * 0.12);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.5, r * 0.45, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "#05010a";
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawClouds(t) {
  const m = camY / PX_PER_M;                 // clouds from the jungle up through the sky
  const alpha = clamp((m - 100) / 40, 0, 1) * clamp(1 - (m - 840) / 50, 0, 1) * 0.9;
  if (alpha <= 0) return;
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  for (const c of clouds) {
    const sy = VIEW_H - (c.py - camY * 0.5);
    if (sy < -60 || sy > VIEW_H + 60) continue;
    const x = ((c.x + t * c.speed) % (VIEW_W + 160)) - 80;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(x, sy, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, sy - 9 * s, 19 * s, 0, Math.PI * 2);
    ctx.arc(x + 44 * s, sy, 21 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, sy + 6 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Section backgrounds and weather (Round 7) ----------
function sectionWeight(i) {                 // 1 inside the section, fading out near its edges
  const m = (camY + VIEW_H / 2) / PX_PER_M, s = SECTIONS[i];
  const below = i === 0 ? 1 : clamp((m - s.from + 40) / 80, 0, 1);
  const above = i === SECTIONS.length - 1 ? 1 : clamp((s.to - m + 40) / 80, 0, 1);
  return below * above;
}

function drawBackItem(b, x, sy, t) {
  const s = b.s;
  const circle = (cx, cy, r) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  switch (b.kind) {
    case "hill":
      ctx.fillStyle = b.sec % 2 ? "rgba(70,150,80,0.9)" : "rgba(90,170,95,0.9)";
      ctx.beginPath(); ctx.ellipse(b.x, sy + 70, 130 * s, 80 * s, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(b.x - 130 * s, sy + 69, 260 * s, VIEW_H);
      break;
    case "kelp":                                     // swaying seaweed
      ctx.strokeStyle = "rgba(60,170,110,0.75)";
      ctx.lineWidth = 6 * s;
      ctx.beginPath();
      for (let k = 0; k <= 8; k++) ctx.lineTo(b.x + Math.sin(t * 1.5 + k * 0.7 + b.ph) * 10 * s, sy + 120 * s - k * 22 * s);
      ctx.stroke();
      break;
    case "fish": {                                   // little fish swimming by
      const dir = b.speed >= 0 ? 1 : -1;
      ctx.fillStyle = ["rgba(255,160,70,0.9)", "rgba(255,220,90,0.9)", "rgba(120,200,255,0.9)"][Math.floor(b.ph) % 3];
      ctx.beginPath(); ctx.ellipse(x, sy, 10 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - dir * 9 * s, sy); ctx.lineTo(x - dir * 17 * s, sy - 6 * s); ctx.lineTo(x - dir * 17 * s, sy + 6 * s); ctx.fill();
      break;
    }
    case "palm":                                     // jungle palm trees
      ctx.fillStyle = "rgba(110,80,50,0.85)";
      ctx.fillRect(b.x - 4 * s, sy - 90 * s, 8 * s, 160 * s);
      ctx.fillStyle = "rgba(50,140,60,0.85)";
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI / 2 + (k - 2) * 0.6 + Math.sin(t + b.ph) * 0.05;
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * 26 * s, sy - 90 * s + Math.sin(a) * 14 * s, 30 * s, 7 * s, a, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case "peak":                                     // grey mountains
    case "snowpeak": {
      const w = 130 * s, h = 170 * s;
      ctx.fillStyle = b.kind === "peak" ? "rgba(110,105,110,0.85)" : "rgba(150,165,190,0.85)";
      ctx.beginPath(); ctx.moveTo(b.x - w, sy + h); ctx.lineTo(b.x, sy); ctx.lineTo(b.x + w, sy + h); ctx.fill();
      ctx.fillStyle = "rgba(250,252,255,0.9)";      // snowy tip
      const cap = b.kind === "peak" ? 0.18 : 0.42;
      ctx.beginPath(); ctx.moveTo(b.x - w * cap, sy + h * cap); ctx.lineTo(b.x, sy); ctx.lineTo(b.x + w * cap, sy + h * cap); ctx.fill();
      break;
    }
    case "moonbig":                                  // the Moon's cratered surface
      ctx.fillStyle = "rgba(210,205,190,0.9)";
      circle(VIEW_W / 2, sy + 260, 300);
      ctx.fillStyle = "rgba(160,150,130,0.6)";
      for (const c of craters) circle(VIEW_W / 2 + c.dx * 280, sy + 260 + c.dy * 280, c.r * 260);
      break;
    case "mars":                                     // the red planet
      ctx.fillStyle = "rgba(200,90,50,0.9)";
      circle(380, sy, 70);
      ctx.fillStyle = "rgba(150,60,35,0.7)";
      circle(360, sy - 20, 16);
      circle(400, sy + 25, 11);
      break;
    case "mesa":                                     // red rock towers
      ctx.fillStyle = "rgba(150,70,45,0.85)";
      rr(b.x - 30 * s, sy, 60 * s, 150 * s, 6);
      ctx.fill();
      ctx.fillStyle = "rgba(190,95,60,0.85)";
      ctx.fillRect(b.x - 30 * s, sy, 60 * s, 8 * s);
      break;
    case "castle":
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for (const [dx, h] of [[-26, 60], [0, 85], [26, 60]]) ctx.fillRect(x + dx * s - 9 * s, sy - h * s, 18 * s, h * s);
      ctx.fillStyle = "rgba(255,190,225,0.7)";
      for (const [dx, h] of [[-26, 60], [0, 85], [26, 60]]) {
        ctx.beginPath(); ctx.moveTo(x + dx * s - 11 * s, sy - h * s); ctx.lineTo(x + dx * s, sy - (h + 18) * s);
        ctx.lineTo(x + dx * s + 11 * s, sy - h * s); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      for (let i = -2; i <= 2; i++) circle(x + i * 18 * s, sy + 4, 16 * s);
      break;
    case "thunderhead":
      ctx.fillStyle = "rgba(38,42,58,0.85)";
      for (const [dx, dy, r] of [[-30, 6, 24], [0, -8, 32], [30, 4, 26], [8, 14, 26]]) circle(x + dx * s, sy + dy * s, r * s);
      break;
    case "island":
      ctx.fillStyle = "rgba(110,90,80,0.75)";
      ctx.beginPath(); ctx.moveTo(x - 34 * s, sy); ctx.lineTo(x + 34 * s, sy); ctx.lineTo(x, sy + 40 * s); ctx.fill();
      ctx.fillStyle = "rgba(110,190,110,0.8)";
      ctx.fillRect(x - 34 * s, sy - 5 * s, 68 * s, 6 * s);
      circle(x + 10 * s, sy - 16 * s, 9 * s);
      break;
    case "ribbon":
      for (const [color, off] of [["rgba(120,255,200,0.22)", 0], ["rgba(190,120,255,0.18)", 22]]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 16 * s;
        ctx.beginPath();
        for (let xx = -20; xx <= VIEW_W + 20; xx += 20) {
          ctx.lineTo(xx, sy + off + Math.sin(xx * 0.018 + t * 0.7 + b.ph) * 22);
        }
        ctx.stroke();
      }
      break;
    case "satellite":
      ctx.save();
      ctx.translate(x, sy);
      ctx.rotate(t * 0.3 + b.ph);
      ctx.fillStyle = "rgba(90,130,220,0.85)";
      ctx.fillRect(-26 * s, -4 * s, 16 * s, 8 * s);
      ctx.fillRect(10 * s, -4 * s, 16 * s, 8 * s);
      ctx.fillStyle = "rgba(200,205,215,0.9)";
      ctx.fillRect(-9 * s, -6 * s, 18 * s, 12 * s);
      ctx.restore();
      break;
    case "sun": {
      const sx = VIEW_W - 40, r = 140;
      const g = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, r * 1.8);
      g.addColorStop(0, "rgba(255,230,120,0.9)");
      g.addColorStop(0.55, "rgba(255,140,40,0.55)");
      g.addColorStop(1, "rgba(255,90,30,0)");
      ctx.fillStyle = g;
      circle(sx, sy, r * 1.8);
      ctx.fillStyle = "#ffcf4a";
      circle(sx, sy, r);
      ctx.fillStyle = "rgba(230,120,30,0.5)";
      circle(sx - 50, sy - 30, 14);
      circle(sx - 20, sy + 50, 10);
      break;
    }
    case "rock":
      ctx.fillStyle = "rgba(110,95,85,0.8)";
      circle(x, sy, 9 * s);
      ctx.fillStyle = "rgba(70,60,55,0.8)";
      circle(x + 3 * s, sy - 2 * s, 3 * s);
      break;
    case "earth":
      ctx.fillStyle = "#3f7fe0";
      circle(90, sy, 40);
      ctx.fillStyle = "#5cc04a";
      circle(78, sy - 10, 14);
      circle(104, sy + 12, 11);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fillRect(66, sy + 20, 30, 4);
      break;
  }
}

function drawBackdrop(t) {
  const weights = SECTIONS.map((_, i) => sectionWeight(i));
  for (const b of backdrop) {
    const w = weights[b.sec];
    if (w <= 0) continue;
    const sy = VIEW_H - (b.py - camY * BACK_P);
    if (sy < -300 || sy > VIEW_H + 300) continue;
    const span = VIEW_W + 200;
    const x = (((b.x + t * b.speed) % span) + span) % span - 100;
    ctx.save();
    ctx.globalAlpha = w;
    drawBackItem(b, x, sy, t);
    ctx.restore();
  }
}

// Bubbles in the sea, snow on the peaks, rain in the storm, wind and dust, and lightning.
function drawWeather(t) {
  const water = sectionWeight(secIndex("water")), snow = sectionWeight(secIndex("snowy"));
  const rain = sectionWeight(secIndex("darksky"));
  const windW = Math.max(sectionWeight(secIndex("sky")), sectionWeight(secIndex("mars")));
  const dusty = sectionWeight(secIndex("mars")) > 0.5;
  if (water > 0) {                                   // underwater: a blue tint and rising bubbles
    ctx.fillStyle = `rgba(30,110,200,${0.16 * water})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.strokeStyle = `rgba(200,240,255,${0.55 * water})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 24; i++) {
      const x = (i * 67 + Math.sin(t + i) * 8) % VIEW_W, y = VIEW_H - (i * 113 + t * 50) % (VIEW_H + 20);
      ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (snow > 0) {                                    // snowflakes drifting down
    ctx.fillStyle = `rgba(255,255,255,${0.8 * snow})`;
    for (let i = 0; i < 50; i++) {
      const x = (i * 59 + Math.sin(t * 0.8 + i) * 14) % VIEW_W, y = (i * 89 + t * 60) % VIEW_H;
      ctx.fillRect(x, y, 3, 3);
    }
  }
  if (rain > 0) {
    ctx.strokeStyle = `rgba(190,210,255,${0.35 * rain})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 60; i++) {
      const x = (i * 53 + t * 80) % VIEW_W, y = (i * 97 + t * 620) % VIEW_H;
      ctx.moveTo(x, y);
      ctx.lineTo(x - 3, y + 12);
    }
    ctx.stroke();
  }
  if (windW > 0) {
    const blowing = mode === "main" && wind.phase === "blow";
    const speed = blowing ? 900 * wind.dir : 160;
    ctx.strokeStyle = dusty ? `rgba(230,140,90,${(blowing ? 0.55 : 0.22) * windW})`
                            : `rgba(255,255,255,${(blowing ? 0.45 : 0.18) * windW})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 26; i++) {
      const x = (((i * 71 + t * speed) % (VIEW_W + 60)) + VIEW_W + 60) % (VIEW_W + 60) - 30;
      const y = (i * 131) % VIEW_H;
      ctx.moveTo(x, y);
      ctx.lineTo(x + 24, y);
    }
    ctx.stroke();
  }
  if (mode !== "main") return;
  if (storm.warn > 0) {
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = `rgba(255,255,190,${0.3 + 0.25 * Math.sin(t * 40)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(storm.x, 0); ctx.lineTo(storm.x, VIEW_H); ctx.stroke();
    ctx.restore();
    txt("!", storm.x, 60, 18, "#ffd447", "center");
  } else if (storm.strike > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 * storm.strike / 0.25})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    for (const [color, width] of [["#ffe680", 7], ["#ffffff", 3]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (let y = 0; y <= VIEW_H; y += 40) ctx.lineTo(storm.x + Math.sin(y * 0.7 + t * 50) * 10, y);
      ctx.stroke();
    }
  }
}

// The boss gate on the ledge, and the glowing barrier that blocks the way up.
function drawBossArena(t) {
  if (boss.phase === "none" || !boss.gate) return;
  const g = boss.gate, gy = toScreenY(boss.ledge.y);
  const open = boss.phase !== "waiting";
  ctx.fillStyle = "#4a4458";                         // stone arch
  rr(g.x - 6, gy - g.h - 8, g.w + 12, g.h + 8, 10);
  ctx.fill();
  const swirl = ctx.createRadialGradient(g.x + g.w / 2, gy - g.h / 2, 2, g.x + g.w / 2, gy - g.h / 2, g.w);
  swirl.addColorStop(0, open ? "#2a2238" : "#ffd447");
  swirl.addColorStop(0.5 + 0.2 * Math.sin(t * 4), open ? "#1a1626" : "#ff7a2a");
  swirl.addColorStop(1, open ? "#120f1a" : "#7a2a8a");
  ctx.fillStyle = swirl;
  rr(g.x, gy - g.h, g.w, g.h, 8);
  ctx.fill();
  if (boss.phase === "waiting") {
    txt("BOSS GATE", g.x + g.w / 2, gy - g.h - 24, 7, "#ffd447", "center");
    ctx.fillStyle = "#ffd447";                       // bouncing arrow
    const ay = gy - g.h - 34 + Math.sin(t * 6) * 4;
    ctx.beginPath(); ctx.moveTo(g.x + g.w / 2 - 6, ay - 8); ctx.lineTo(g.x + g.w / 2 + 6, ay - 8); ctx.lineTo(g.x + g.w / 2, ay); ctx.fill();
  }
  if (barrierUp()) {
    const by = toScreenY(boss.ceiling);
    if (by > -20 && by < VIEW_H + 20) {
      const glow = ctx.createLinearGradient(0, by - 16, 0, by + 16);
      glow.addColorStop(0, "rgba(255,90,60,0)");
      glow.addColorStop(0.5, `rgba(255,90,60,${0.55 + 0.25 * Math.sin(t * 8)})`);
      glow.addColorStop(1, "rgba(255,90,60,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, by - 16, VIEW_W, 32);
      txt("BEAT THE BOSS TO GO ON", VIEW_W / 2, by + 14, 7, "#ffb3a8", "center");
    }
  }
}

// A soft glow marks a boundary: blue for the edge of space, red for the danger zone.
function drawEdgeGlow(y, color) {
  const sy = toScreenY(y);
  if (sy < -60 || sy > VIEW_H + 60) return;
  const g = ctx.createLinearGradient(0, sy - 50, 0, sy + 50);
  g.addColorStop(0, `rgba(${color},0)`);
  g.addColorStop(0.5, `rgba(${color},0.22)`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, sy - 50, VIEW_W, 100);
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (c.life - c.age) / 0.6);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.scale(1, Math.cos(c.flip));                         // tumbling flip
    ctx.fillStyle = c.color;
    ctx.fillRect(-4.5, -3, 9, 6);
    ctx.restore();
  }
}

function drawRecordLines() {
  const colors = ["#ffd447", "#d7dde8", "#e39a5a"];
  for (let i = 0; i < Math.min(3, scores.length); i++) {
    const s = scores[i];
    if (s.moon) continue;
    const sy = toScreenY(s.height * PX_PER_M);
    if (sy < -20 || sy > VIEW_H + 20) continue;
    ctx.save();
    ctx.strokeStyle = colors[i];
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(0, sy);
    ctx.lineTo(VIEW_W, sy);
    ctx.stroke();
    ctx.restore();
    txt(`#${i + 1} ${s.initials} ${s.height} m`, VIEW_W - 22, sy - 13, 8, colors[i], "right");
  }
}

function drawGround(sy) {                                    // the sandy sea floor
  ctx.fillStyle = "#b89a62";
  ctx.fillRect(0, sy, VIEW_W, VIEW_H - sy + 2);
  ctx.fillStyle = "#e6cf94";
  ctx.fillRect(0, sy, VIEW_W, 10);
  ctx.fillStyle = "#cdb47a";
  ctx.fillRect(0, sy + 10, VIEW_W, 3);
  ctx.fillStyle = "#f0e0b0";                                 // a few shells
  for (const x of [40, 170, 300, 420]) { ctx.beginPath(); ctx.arc(x, sy + 22, 4, Math.PI, 0); ctx.fill(); }
}

function drawSign(s, sy) {
  const label = s.kind === "pad" ? "LAST JUMP!" : `${s.mark} m`;
  ctx.font = `8px ${FONT}`;
  const w = ctx.measureText(label).width + 14;
  const x = s.x + 12;
  ctx.fillStyle = "#5a3d24";
  ctx.fillRect(x + w / 2 - 2, sy - 22, 4, 22);
  ctx.fillStyle = "#f3e3c0";
  rr(x, sy - 38, w, 18, 3);
  ctx.fill();
  ctx.strokeStyle = "#5a3d24";
  ctx.lineWidth = 2;
  ctx.stroke();
  txtPlain(label, x + w / 2, sy - 33, 8, "#3a2614", "center");
}

function drawSweeper(s, sy) {
  const sw = s.sweeper, x = sw.x, y = sy - SWEEPER_H;
  const frozen = sw.frozen > 0;
  ctx.fillStyle = "rgba(0,0,0,0.35)";                         // the track it runs along
  ctx.fillRect(s.x + 3, sy + 1, s.w - 6, 2);
  if (!frozen) {
    ctx.fillStyle = "rgba(255,212,71,0.25)";                  // speed streak behind it
    ctx.fillRect(sw.dir > 0 ? x - 10 : x + SWEEPER_W, y + 3, 10, SWEEPER_H - 6);
  }
  ctx.save();
  rr(x, y, SWEEPER_W, SWEEPER_H, 3);
  ctx.fillStyle = frozen ? "#bfefff" : "#ffd447";
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = frozen ? "#4a8fb0" : "#1a1a1a";
  ctx.lineWidth = 3;
  for (let k = -SWEEPER_H; k < SWEEPER_W + SWEEPER_H; k += 7) {
    ctx.beginPath();
    ctx.moveTo(x + k, y + SWEEPER_H);
    ctx.lineTo(x + k + SWEEPER_H, y);
    ctx.stroke();
  }
  ctx.restore();
  rr(x, y, SWEEPER_W, SWEEPER_H, 3);
  ctx.strokeStyle = frozen ? "#2a6f90" : "#5a4300";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawPlatform(s, time) {
  const sy = toScreenY(s.y);
  if (sy < -40 || sy > VIEW_H + 20) return;
  if (s.kind === "ground") { drawGround(sy); return; }
  const t = s.y / PX_PER_M;
  if (!solidNow(s)) {                                         // blinked out or crumbled away: just a faint outline
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    rr(s.x, sy, s.w, 14, 5);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (s.bouncy) {                                             // bouncy jungle mushroom
    const squish = 1 + Math.sin(time * 4 + s.x) * 0.04;
    ctx.fillStyle = "#f3e3c0";                                // stem
    ctx.fillRect(s.x + s.w / 2 - 6, sy + 6, 12, 14);
    ctx.fillStyle = "#e8423a";                                // red cap
    ctx.beginPath();
    ctx.ellipse(s.x + s.w / 2, sy + 8, s.w / 2, 12 * squish, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(s.x, sy + 7, s.w, 4);
    ctx.fillStyle = "#ffffff";                                // white spots
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(s.x + i * s.w / 4, sy + (i === 2 ? -1 : 3), 3, 0, Math.PI * 2);
      ctx.fill();
    }
    return;
  }
  ctx.save();
  if (s.blink) {                                              // flickers just before it blinks out
    const ph = (runTime + s.blinkPh) % BLINK_CYCLE;
    if (ph > BLINK_ON - 0.5) ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(time * 25));
  }
  if (s.crumbleT > 0) ctx.translate((Math.random() - 0.5) * 3, 0);   // shaking before it falls
  if (s.amp) {                                                // thrusters under moving platforms
    const flick = 0.55 + 0.45 * Math.sin(time * 30 + s.phase);
    ctx.fillStyle = `rgba(120,220,255,${0.5 * flick})`;
    for (const ex of [s.x + 8, s.x + s.w - 8]) {
      ctx.beginPath();
      ctx.ellipse(ex, sy + 17, 4, 5 + 3 * flick, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.fillStyle = rgb(gradientAt(PLAT_BODY, t));
  rr(s.x, sy, s.w, 14, 5);
  ctx.fill();
  ctx.fillStyle = rgb(gradientAt(PLAT_TOP, t));
  rr(s.x, sy, s.w, 5, 3);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(s.x + 5, sy + 10, s.w - 10, 2);
  if (s.crumble) {                                            // cracks: this one will crumble
    ctx.strokeStyle = "rgba(20,20,30,0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x + s.w * 0.3, sy);
    ctx.lineTo(s.x + s.w * 0.36, sy + 6);
    ctx.lineTo(s.x + s.w * 0.3, sy + 13);
    ctx.moveTo(s.x + s.w * 0.7, sy);
    ctx.lineTo(s.x + s.w * 0.64, sy + 7);
    ctx.stroke();
  }
  if (s.icy) {                                                // slippery ice: pale blue with a shine
    ctx.fillStyle = "rgba(170,225,255,0.85)";
    rr(s.x, sy, s.w, 6, 3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(s.x + 6, sy + 1, Math.min(14, s.w / 3), 2);
  }
  if (s.blink) {                                              // a soft glow
    ctx.fillStyle = "rgba(120,255,200,0.25)";
    rr(s.x - 3, sy - 3, s.w + 6, 20, 8);
    ctx.fill();
  }
  ctx.restore();
  if (s.kind === "ledge" || s.kind === "pad") drawSign(s, sy);
  if (s.sweeper) drawSweeper(s, sy);
}

function drawCloudPlat(c) {
  const sy = toScreenY(c.y);
  ctx.save();
  ctx.globalAlpha = Math.min(1, c.life);
  if (c.kind === "bubble") {                                  // the dog's Bubble Bounce
    ctx.fillStyle = "rgba(150,220,255,0.55)";
    ctx.beginPath();
    ctx.ellipse(c.x + c.w / 2, sy + 6, c.w / 2, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillRect(c.x + c.w * 0.3, sy + 1, 8, 3);
    ctx.restore();
    return;
  }
  if (c.kind === "rainbow") {                                 // the dog's Rainbow Bridge
    ["#ff5a5a", "#ff9f40", "#ffd447", "#7dff7a", "#5a9bff", "#a565f0"].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.fillRect(c.x, sy + i * 2.5, c.w, 2.5);
    });
    ctx.restore();
    return;
  }
  ctx.fillStyle = "#ffffff";
  rr(c.x, sy, c.w, 10, 5);
  ctx.fill();
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(c.x + 12 + i * (c.w - 24) / 3, sy + 2, 9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    const a = q.life / q.max;
    ctx.fillStyle = `rgba(${q.color},${0.7 * a})`;
    ctx.beginPath();
    ctx.arc(q.x, toScreenY(q.y), 1.5 + 2 * a, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPoppy(f, t) {
  const sy = toScreenY(f.y);
  if (sy < -40 || sy > VIEW_H + 30) return;
  const hx = f.x + Math.sin(t * 1.6 + f.ph) * 2, hy = sy - 20;
  ctx.strokeStyle = "#3f8f3a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(f.x, sy);
  ctx.quadraticCurveTo(f.x - 2, sy - 10, hx, hy);
  ctx.stroke();
  ctx.fillStyle = "#4fae45";
  ctx.beginPath();
  ctx.ellipse(f.x + 4, sy - 7, 5, 2.2, -0.6, 0, Math.PI * 2);
  ctx.fill();
  // Petals shrink right after shooting, then grow back.
  const grow = 1 - 0.6 * clamp(f.cool / POPPY_COOLDOWN, 0, 1);
  const pr = 6.5 * grow * (1 + f.bounce * 0.35);
  ctx.fillStyle = "#e8322b";
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    ctx.beginPath();
    ctx.arc(hx + Math.cos(a) * pr * 0.75, hy + Math.sin(a) * pr * 0.75, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#2a1414";
  ctx.beginPath();
  ctx.arc(hx, hy, 2.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawPetal(x, y, rot, size, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = "#ee3a2f";
  ctx.beginPath();
  ctx.ellipse(0, 0, 6 * size, 3.8 * size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7a1010";
  ctx.beginPath();
  ctx.arc(-3.6 * size, 0, 1.6 * size, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPetals() {
  for (const q of petals) {
    drawPetal(q.x, toScreenY(q.y), q.rot, 1.3, Math.min(1, (PETAL_LIFE - q.age) / 0.8));
  }
}

function drawEnemy(e, t) {
  const sy = toScreenY(e.y);
  if (sy < -40 || sy > VIEW_H + 40) return;
  const r = e.r;
  // Eyes look at you.
  const lx = player.x + PLAYER_W / 2 - e.x, ly = -(player.y + PLAYER_H / 2 - e.y);
  const ld = Math.hypot(lx, ly) || 1;
  const ex = lx / ld * 1.6, ey = ly / ld * 1.6;
  const eyes = (y, gap, size, angry) => {
    for (const s of [-1, 1]) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s * gap, y, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1a1030";
      ctx.beginPath();
      ctx.arc(s * gap + ex, y + ey, size * 0.55, 0, Math.PI * 2);
      ctx.fill();
      if (angry) {
        ctx.strokeStyle = "#1a1030";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s * (gap + size), y - size - 2);
        ctx.lineTo(s * (gap - size * 0.6), y - size + 1);
        ctx.stroke();
      }
    }
  };

  if (e.warn > 0) {                                  // a flare is coming: blinking arrow at the right edge
    if (Math.floor(e.warn * 8) % 2 === 0) {
      ctx.fillStyle = "#ff9f40";
      ctx.beginPath();
      ctx.moveTo(VIEW_W - 22, sy);
      ctx.lineTo(VIEW_W - 6, sy - 9);
      ctx.lineTo(VIEW_W - 6, sy + 9);
      ctx.closePath();
      ctx.fill();
    }
    return;
  }
  ctx.save();
  ctx.translate(e.x, sy);
  if (e.type === "boss" && e.kind === "golem") {     // BOULDER BULLY (mini boss)
    const angry = e.hp <= e.maxHp / 2, bob = Math.sin(t * 4) * 3;
    ctx.fillStyle = "#7a746c";                       // rock fists
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(s * (r + 10), 8 + bob * s, 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = angry ? "#8a6a60" : "#8c867c";   // lumpy rock body
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5, rad = r * (0.88 + 0.12 * Math.sin(i * 3.1));
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#5fae4a";                       // moss on top
    ctx.beginPath(); ctx.ellipse(0, -r * 0.75, r * 0.7, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(40,36,32,0.7)";          // cracks
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.1); ctx.lineTo(-r * 0.2, r * 0.4); ctx.lineTo(-r * 0.35, r * 0.7); ctx.stroke();
    eyes(-4, 10, 5, true);
    ctx.strokeStyle = "#2a2420";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 14); ctx.lineTo(9, 14); ctx.stroke();
  } else if (e.type === "boss" && e.kind === "void") {   // THE BLACK HOLE (final boss)
    const angry = e.hp <= e.maxHp / 2;
    const glow = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 2);
    glow.addColorStop(0, angry ? "rgba(255,90,160,0.55)" : "rgba(170,90,255,0.5)");
    glow.addColorStop(1, "rgba(80,20,140,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.save();                                      // spinning ring of glowing dust
    ctx.rotate(t * 1.5);
    for (const [w, color] of [[7, angry ? "#ff6ab4" : "#c39bff"], [3, "#ffffff"]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.45, r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = "#05010a";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    eyes(-6, 12, 6, true);
  } else if (e.type === "boss") {                    // THE SUN KING
    const angry = e.hp <= e.maxHp / 2;
    ctx.fillStyle = angry ? "#ff5a3a" : "#ffb347";
    for (let i = 0; i < 12; i++) {                   // flickering flames all around
      const a = i * Math.PI / 6 + t * 1.5, len = r + 10 + Math.sin(t * 12 + i * 1.7) * 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.22) * r * 0.9, Math.sin(a - 0.22) * r * 0.9);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.lineTo(Math.cos(a + 0.22) * r * 0.9, Math.sin(a + 0.22) * r * 0.9);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(-8, -8, 4, 0, 0, r);
    g.addColorStop(0, "#fff3b0");
    g.addColorStop(1, angry ? "#ff7a2a" : "#ffb02e");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd447";                       // crown
    ctx.beginPath();
    ctx.moveTo(-18, -r + 4); ctx.lineTo(-18, -r - 14); ctx.lineTo(-9, -r - 4); ctx.lineTo(0, -r - 18);
    ctx.lineTo(9, -r - 4); ctx.lineTo(18, -r - 14); ctx.lineTo(18, -r + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.arc(0, -r - 6, 3, 0, Math.PI * 2); ctx.fill();
    eyes(-6, 11, 6, true);
    ctx.strokeStyle = "#5a1a0a";                     // grumpy mouth
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 18, 9, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  } else if (e.type === "asteroid") {
    ctx.rotate(e.t * e.spin);
    ctx.fillStyle = e.rock ? "#8c867c" : "#8a7864";
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i * Math.PI * 2 / 9, rad = r * (0.8 + 0.2 * Math.sin(i * 2.7 + e.ph));
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(60,48,40,0.6)";
    ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.2, r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, r * 0.3, r * 0.18, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === "flare") {
    ctx.rotate(Math.atan2(e.vy, -e.vx));             // tail trails behind it
    const tail = ctx.createLinearGradient(0, 0, 40, 0);
    tail.addColorStop(0, e.tint ? `rgba(${e.tint},0.8)` : "rgba(255,170,60,0.8)");
    tail.addColorStop(1, e.tint ? `rgba(${e.tint},0)` : "rgba(255,90,40,0)");
    ctx.fillStyle = tail;
    ctx.beginPath(); ctx.ellipse(18, 0, 22, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.tint ? `rgb(${e.tint})` : "#ffd447";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-2, -2, r * 0.45, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === "grumble") {
    ctx.fillStyle = "#6d6a8c";
    for (const [cx, cy, cr] of [[-r * 0.55, 3, r * 0.6], [r * 0.55, 3, r * 0.6], [0, -r * 0.25, r * 0.75], [0, 4, r * 0.7]]) {
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fill();
    }
    eyes(-1, 5, 3.4, true);
  } else if (e.type === "buzzer") {
    const flap = Math.abs(Math.sin(t * 40 + e.ph));
    ctx.fillStyle = "rgba(220,240,255,0.75)";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * 4, -r * 0.9, 4, 7 * flap + 2, s * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#f2d046";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-r * 0.35, -r, 4, r * 2);
    ctx.fillRect(r * 0.25, -r, 4, r * 2);
    ctx.restore();
    eyes(-2, 4, 2.8, false);
  } else if (e.type === "swooper") {
    const flap = Math.sin(t * (e.mode === "dive" ? 30 : 12) + e.ph) * 7;
    ctx.fillStyle = "#2f418f";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 5, 0);
      ctx.lineTo(s * (r + 9), -6 + flap);
      ctx.lineTo(s * (r + 2), 5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#4f69d2";
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.8, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff9f40";
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(4, 4);
    ctx.lineTo(0, 11);
    ctx.closePath();
    ctx.fill();
    eyes(-3, 4, 3, true);
  } else {
    ctx.strokeStyle = "rgba(255,170,215,0.8)";
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 5, 2);
      for (let k = 1; k <= 4; k++) ctx.lineTo(i * 5 + Math.sin(t * 4 + k + i) * 3, 2 + k * 5);
      ctx.stroke();
    }
    const g = ctx.createRadialGradient(0, -4, 2, 0, -2, r);
    g.addColorStop(0, "rgba(255,220,240,0.95)");
    g.addColorStop(1, "rgba(255,120,190,0.75)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 2, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    eyes(-4, 5, 2.6, false);
  }
  if (e.frozen > 0) {
    ctx.strokeStyle = "rgba(140,220,255,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (e.burn > 0) {
    ctx.fillStyle = `rgba(255,140,40,${0.25 + 0.2 * Math.sin(t * 20)})`;
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
    ctx.fill();
  }
  if (e.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    ctx.arc(0, 0, r + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  if (e.hp < e.maxHp && !e.boss) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(-12, -r - 10, 24, 4);
    ctx.fillStyle = "#ff5a5a";
    ctx.fillRect(-12, -r - 10, 24 * e.hp / e.maxHp, 4);
  }
  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    const sy = toScreenY(s.y);
    const color = s.big ? "255,107,213" : s.drone ? "143,227,255" : "255,224,102";
    ctx.fillStyle = `rgba(${color},0.3)`;
    ctx.beginPath();
    ctx.arc(s.x, sy, s.size * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgb(${color})`;
    ctx.beginPath();
    ctx.arc(s.x, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEffects() {
  for (const g of rings) {
    const k = 1 - g.life / 0.35;
    ctx.strokeStyle = `rgba(${g.color},${1 - k})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(g.x, toScreenY(g.y), g.r * (0.3 + 0.7 * k), 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const z of zaps) {
    ctx.strokeStyle = `rgba(140,230,255,${z.life / 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(z.x1, toScreenY(z.y1));
    for (let k = 1; k < 5; k++) {
      ctx.lineTo(lerp(z.x1, z.x2, k / 5) + (Math.random() - 0.5) * 10, toScreenY(lerp(z.y1, z.y2, k / 5)) + (Math.random() - 0.5) * 10);
    }
    ctx.lineTo(z.x2, toScreenY(z.y2));
    ctx.stroke();
  }
  for (const f of texts) {
    ctx.globalAlpha = Math.min(1, f.life / 0.4);
    txt(f.str, f.x, toScreenY(f.y), 8, f.color, "center");
    ctx.globalAlpha = 1;
  }
}

// The astronaut, in your character's colors and hat. Drawn facing right with
// the feet at (0, 0); the caller moves, flips and sizes it.
function drawAstronaut(c, air, swing) {
  const suit = PALETTE[c.suit], black = [0, 0, 0], white = [255, 255, 255];

  ctx.fillStyle = PALETTE[c.pack];                        // backpack
  rr(-13, -22, 6, 13, 2);
  ctx.fill();

  ctx.fillStyle = mixHex(suit, black, 0.15);              // legs
  rr(-7, -9 - (air ? 2 : Math.max(0, swing)), 5, 9, 2);
  ctx.fill();
  rr(2, -9 - (air ? 3 : Math.max(0, -swing)), 5, 9, 2);
  ctx.fill();

  ctx.fillStyle = suit;                                   // body
  ctx.strokeStyle = mixHex(suit, black, 0.4);
  ctx.lineWidth = 1.5;
  rr(-10, -23, 20, 16, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#ff6b5a";
  ctx.fillRect(1, -18, 4, 3);

  ctx.fillStyle = "#59617a";                              // blaster
  ctx.fillRect(6, -16, 9, 4);

  ctx.fillStyle = suit;                                   // helmet + visor
  ctx.beginPath();
  ctx.arc(0, -27, 9.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  const vg = ctx.createLinearGradient(0, -32, 0, -22);
  vg.addColorStop(0, mixHex(PALETTE[c.visor], white, 0.45));
  vg.addColorStop(1, mixHex(PALETTE[c.visor], black, 0.55));
  ctx.fillStyle = vg;
  rr(0, -31, 9, 8, 3.5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillRect(3, -30, 2, 2);
  drawHat(c);
}

function drawHat(c) {
  const hc = PALETTE[c.hatColor], dark = mixHex(hc, [0, 0, 0], 0.35);
  const poly = (pts, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(...pts[0]);
    for (const pt of pts.slice(1)) ctx.lineTo(...pt);
    ctx.closePath();
    ctx.fill();
  };
  const dot = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
  switch (HATS[c.hat]) {
    case "CAP":
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.arc(0, -34, 8.5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(2, -35, 12, 3);
      break;
    case "CROWN":
      poly([[-8, -34], [-8, -43], [-4, -38], [0, -45], [4, -38], [8, -43], [8, -34]], "#ffd447");
      dot(0, -40, 1.5, "#ff5a5a");
      break;
    case "PARTY HAT":
      poly([[-7, -35], [7, -35], [1, -52]], hc);
      ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(-3, -42, 7, 2);
      dot(1, -52, 2.5, "#ffffff");
      break;
    case "BOW":
      poly([[0, -37], [-9, -42], [-9, -32]], hc);
      poly([[0, -37], [9, -42], [9, -32]], hc);
      dot(0, -37, 2.5, dark);
      break;
    case "ANTENNA":
      ctx.strokeStyle = "#59617a"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(3, -47); ctx.stroke();
      dot(3, -48, 3, hc);
      break;
    case "COWBOY HAT":
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.ellipse(0, -35, 15, 3, 0, 0, Math.PI * 2); ctx.fill();
      rr(-7, -45, 14, 10, 3); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(-7, -38, 14, 2);
      break;
    case "FLOWER":
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        dot(-5 + Math.cos(a) * 3.5, -36 + Math.sin(a) * 3.5, 2.8, hc);
      }
      dot(-5, -36, 2, "#ffd447");
      break;
  }
}

function drawPlayer(t) {
  const p = player;
  const sy = toScreenY(p.y);
  if (sy < -60 || sy > VIEW_H + 60) return;
  const cx = p.x + PLAYER_W / 2;

  if (p.starTime > 0) {                                  // Star Power glow
    ctx.fillStyle = `hsla(${(t * 360) % 360},100%,60%,0.35)`;
    ctx.beginPath();
    ctx.arc(cx, sy - 16, 26, 0, Math.PI * 2);
    ctx.fill();
  }
  if (st.drone) {                                        // Helper Drone
    const dy = toScreenY(drone.y);
    ctx.fillStyle = "#9aa3b8";
    rr(drone.x - 8, dy - 4, 16, 8, 3);
    ctx.fill();
    ctx.fillStyle = "#8fe3ff";
    ctx.fillRect(drone.x - 2, dy - 2, 4, 3);
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    const w = 9 * Math.abs(Math.sin(t * 30));
    ctx.beginPath();
    ctx.moveTo(drone.x - w, dy - 7);
    ctx.lineTo(drone.x + w, dy - 7);
    ctx.stroke();
  }

  const blink = p.invuln > 0 && p.starTime <= 0 && Math.floor(t * 12) % 2 === 0;
  ctx.save();
  if (blink) ctx.globalAlpha = 0.45;
  const sq = p.squash, k = st.tiny ? 0.8 : 1;
  ctx.translate(cx, sy);
  ctx.scale(p.facing / Math.sqrt(sq) * k, sq * k);

  const air = !p.onGround;
  const swing = p.onGround && Math.abs(p.vx) > 20 ? Math.sin(p.walk) * 2.5 : 0;
  drawAstronaut(currentChar(), air, swing);
  ctx.restore();

  if (st.shield && p.shieldReady) {                      // Bubble Shield
    ctx.strokeStyle = "rgba(140,220,255,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, sy - 16, 22, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (st.moonlet) {                                      // Orbiting Moonlet
    const m = moonletPos(), my = toScreenY(m.y);
    ctx.fillStyle = "#d8d2bd";
    ctx.beginPath();
    ctx.arc(m.x, my, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(150,140,115,0.6)";
    ctx.beginPath();
    ctx.arc(m.x - 2, my - 1, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Saved super jumps circle your helmet.
  for (let i = 0; i < boosts; i++) {
    const a = t * 3 + i * (Math.PI * 2 / Math.max(3, st.boostMax));
    drawPetal(cx + Math.cos(a) * 17, sy - 27 + Math.sin(a) * 6, a, 0.7);
  }
}

function drawDog(t) {
  const sy = toScreenY(dog.y) + Math.sin(t * 3) * 3;      // gentle bobbing
  if (sy < -40 || sy > VIEW_H + 40) return;
  drawDogAt(dog.x, sy, dog.facing, 1.1, t);
}

function drawDogAt(x, sy, facing, scale, t) {
  const black = "#1b1b22";
  const wingHex = PALETTE[currentChar().wings];
  const flap = Math.sin(t * 18);
  const wing = (x, color, lean) => {
    ctx.save();
    ctx.translate(x, -4);
    ctx.rotate(lean + flap * 0.5);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, -6, 4, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };
  const ellipse = (x, y, rx, ry, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  };
  ctx.save();
  ctx.translate(x, sy);
  ctx.scale(facing * scale, scale);

  wing(-4, mixHex(wingHex, [0, 0, 0], 0.25), -0.6);       // back wing
  ctx.save();                                              // teeny crank tail, whirling
  ctx.translate(-9, -3);
  ctx.rotate(t * 25);
  ctx.strokeStyle = black;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(3.5, 0);
  ctx.stroke();
  ctx.restore();
  for (const lx of [-6, -2, 3, 6]) {                       // little legs with white paws
    ctx.fillStyle = black;
    ctx.fillRect(lx, 3, 2.2, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(lx, 6, 2.2, 1.6);
  }
  ellipse(0, 0, 9.5, 6, black);                            // body
  ellipse(5, 2, 4, 3.5, "#ffffff");                        // white chest
  wing(0, wingHex, -0.2);                                  // front wing

  ellipse(10, -6, 6.5, 6.5, black);                        // head
  for (const [a, b, c] of [[[5, -10], [4, -19], [9, -12]], [[10, -12], [13, -19], [15, -10]]]) {   // bat ears
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2a3b3";
    ctx.beginPath();
    ctx.moveTo(a[0] * 0.75 + b[0] * 0.25 + 0.5, a[1] * 0.75 + b[1] * 0.25);
    ctx.lineTo(b[0], b[1] + 3);
    ctx.lineTo(c[0] * 0.75 + b[0] * 0.25 - 0.5, c[1] * 0.75 + b[1] * 0.25);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "#ffffff";                               // white blaze down the face
  ctx.fillRect(10.5, -12.5, 2, 6);
  ellipse(14, -4, 3.8, 2.9, "#ffffff");                    // muzzle
  ellipse(17.2, -5, 1.4, 1.2, black);                      // nose
  ellipse(12.5, -8, 2.4, 2.4, "#ffffff");                  // big eye
  ellipse(12.9, -8, 1.7, 1.7, "#2a1a1a");
  ellipse(13.4, -8.6, 0.6, 0.6, "#ffffff");
  ctx.restore();
}

function drawSpellCloud(t) {
  const p = player;
  if (p.domeTime > 0) {                                     // Safety Dome
    const cx = p.x + PLAYER_W / 2, cy = toScreenY(p.y) - 16;
    ctx.fillStyle = "rgba(120,255,200,0.15)";
    ctx.strokeStyle = `rgba(120,255,200,${0.6 + 0.3 * Math.sin(t * 10)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  if (p.spellTime <= 0) return;
  const cx = p.x + PLAYER_W / 2, cy = toScreenY(p.y) - 16;
  const fading = p.spellTime < 1 && Math.floor(t * 10) % 2 === 0;   // blinks when almost over
  ctx.save();
  ctx.fillStyle = "#b46bff";
  ctx.globalAlpha = fading ? 0.08 : 0.18;
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = fading ? 0.25 : 0.5;
  for (let i = 0; i < 8; i++) {
    const a = t * 1.5 + i * Math.PI / 4;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * 25, cy + Math.sin(a) * 25, 10 + 2 * Math.sin(t * 3 + i), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(cx + Math.cos(t * 4 + i * 1.7) * 22, cy + Math.sin(t * 3 + i * 2.1) * 22, 2, 2);
  }
  ctx.restore();
}

function drawRadar() {
  for (const e of enemies) {
    if (!e.alive || e.y < camY + VIEW_H || e.y > camY + VIEW_H + 450) continue;
    ctx.fillStyle = "rgba(255,90,90,0.85)";
    ctx.beginPath();
    ctx.moveTo(e.x, 4);
    ctx.lineTo(e.x - 6, 14);
    ctx.lineTo(e.x + 6, 14);
    ctx.closePath();
    ctx.fill();
  }
}

function drawAbilityHUD() {
  const p = player, dim = "rgba(255,255,255,0.4)", on = CATEGORY.ability.color;
  const timer = (label, t) => (t > 0 ? [`${label} ${Math.ceil(t)}`, dim] : [label, on]);
  const lines = [];
  const sp = SPELLS[p.spells[p.spellSel]];
  if (p.spellTime > 0) lines.push([`PURPLE CLOUD ${Math.ceil(p.spellTime)}`, "#e0a8ff"]);
  if (p.domeTime > 0) lines.push([`SAFETY DOME ${Math.ceil(p.domeTime)}`, "#78ffc8"]);
  lines.push(timer(`${IS_TOUCH ? "SPELL:" : "CTRL+B"} ${sp.name}`, p.spellCds[sp.id] || 0));
  if (p.spells.length > 1) lines.push([`${IS_TOUCH ? "NEXT" : "V"} = NEXT SPELL (${p.spellSel + 1}/${p.spells.length})`, "rgba(255,255,255,0.6)"]);
  if (st.rebounds) { const n = st.rebounds - p.reboundsUsed; lines.push([`BOUNCES ${n}`, n > 0 ? on : dim]); }
  if (st.safetyFlag) lines.push(p.flagUsed ? ["FLAG USED", dim] : ["FLAG READY", on]);
  if (st.shield) lines.push(p.shieldReady ? ["SHIELD READY", "#8fe3ff"] : [`SHIELD ${Math.ceil(p.shieldTimer)}`, dim]);
  const k = (key, name) => (IS_TOUCH ? name : `${key} ${name}`);    // on touch screens, the button says the name
  if (st.timeBubble) lines.push(timer(k("Q", "SLOW-MO"), p.timeCd));
  if (st.blink) lines.push(timer(k("E", "BLINK"), p.blinkCd));
  if (st.cloud) lines.push(timer(k("C", "CLOUD"), p.cloudCd));
  if (st.dash) lines.push([k("SHIFT", "DASH"), p.dashReady ? CATEGORY.jump.color : dim]);
  if (st.dive) lines.push([k("DOWN", "DIVE"), CATEGORY.jump.color]);
  lines.forEach(([str, color], i) => txt(str, 12, VIEW_H - 18 - (lines.length - 1 - i) * 14, 7, color));
}

function drawHUD() {
  const p = player;
  txt("SCORE", 12, 12, 8, "#c8d3ff");
  txt(`${Math.floor(maxHeightPx / PX_PER_M)} m`, 12, 26, 18, "#ffffff");
  txt(`TIME ${fmtTime(runTime)}`, 12, 52, 8, "#c8d3ff");
  txt("BOOST", 12, 70, 8, "#ffb3a8");
  for (let i = 0; i < st.boostMax; i++) {
    drawPetal(66 + i * 17, 74, -0.5, 1, i < boosts ? 1 : 0.22);
  }
  let y = 90;
  const sec = SECTIONS[sectionAt(Math.max(0, p.y) / PX_PER_M)];
  txt(sec.name, 12, y, 8, sec.color);
  y += 16;
  if (p.y >= SPACE_Y) { txt("LOW GRAVITY", 12, y, 8, "#8fe3ff"); y += 16; }
  if (timeSlow > 0) txt("SLOW-MO", 12, y, 8, "#8fe3ff");
  if (mode === "main" && wind.phase !== "calm") {
    txt(wind.dir > 0 ? "WIND >>>" : "<<< WIND", VIEW_W / 2, 250, 12, wind.phase === "warn" ? "#ffd447" : "#ffffff", "center");
  }

  if (mode === "sandbox") {
    const g = currentLevel() && currentLevel().goal;
    txt(`MY LEVEL ${ed.level + 1}`, VIEW_W - 12, 12, 8, "#7dff7a", "right");
    txt(g ? `GOAL ${Math.round(g.y / PX_PER_M)} m` : "NO GOAL YET", VIEW_W - 12, 26, 10, "#ffffff", "right");
    drawAbilityHUD();
    return;
  }

  const hi = scores[0];
  txt("HI", VIEW_W - 12, 12, 8, "#ffd447", "right");
  txt(hi ? `${hi.initials} ${hi.moon ? "WIN!" : hi.height + " m"}` : "---", VIEW_W - 12, 26, 12, "#ffffff", "right");

  // Progress bar: ground at the bottom, Moon at the top
  const bx = VIEW_W - 10, top = 96, bot = 690;
  const yFor = h => bot - (bot - top) * clamp(h / MOON_Y, 0, 1);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  rr(bx - 3, top, 6, bot - top, 3);
  ctx.fill();
  ctx.fillStyle = "#c39bff";                                 // the Black Hole at the top
  ctx.beginPath();
  ctx.arc(bx, top - 9, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,110,110,0.8)";
  ctx.fillRect(bx - 5, yFor(DANGER_Y) - 1, 10, 2);
  ctx.fillStyle = "rgba(120,210,255,0.9)";
  ctx.fillRect(bx - 5, yFor(SPACE_Y) - 1, 10, 2);
  if (hi && !hi.moon) {
    ctx.fillStyle = "#ffd447";
    ctx.fillRect(bx - 6, yFor(hi.height * PX_PER_M) - 1.5, 12, 3);
  }
  ctx.fillStyle = "#7fd4ff";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(bx, yFor(p.y), 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  drawAbilityHUD();

  if (recordFlash > 0 && Math.floor(recordFlash * 6) % 2 === 0) {
    txt("NEW RECORD!", VIEW_W / 2, 136, 16, "#ffd447", "center");
  }
  if (bossActive() && boss.e) {                      // boss health bar
    txt(boss.def.name, VIEW_W / 2, 58, 9, "#ffb347", "center");
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    rr(110, 72, 260, 12, 4);
    ctx.fill();
    ctx.fillStyle = boss.e.hp <= boss.e.maxHp / 2 ? "#ff5a3a" : "#ffb347";
    rr(110, 72, 260 * Math.max(0, boss.e.hp) / boss.e.maxHp, 12, 4);
    ctx.fill();
  }
  if (boss.phase === "intro") {
    txt("BOSS FIGHT!", VIEW_W / 2, 290, 22, "#ff6a3a", "center");
    txt(boss.def.name, VIEW_W / 2, 326, 14, "#ffd447", "center");
  } else if (boss.phase === "won") {
    txt(`${boss.def.name} IS BEATEN!`, VIEW_W / 2, 290, 12, "#7dff7a", "center");
    txt("THE WAY UP IS OPEN!", VIEW_W / 2, 312, 9, "#ffffff", "center");
  } else if (boss.phase === "waiting" && p.y >= boss.ledge.y - 40) {
    txt("WALK INTO THE BOSS GATE!", VIEW_W / 2, 250, 10, "#ffd447", "center");
  }
  if (pendingPicks > 0 && Math.floor(performance.now() / 400) % 2 === 0) {   // an upgrade is waiting
    txt("UPGRADE READY! LAND ON A SOLID PLATFORM", VIEW_W / 2, 236, 8, "#ffd447", "center");
  }
  if (sectionFlash > 0) {                            // a new section!
    const s = SECTIONS[sectionReached];
    ctx.globalAlpha = Math.min(1, sectionFlash / 0.5);
    txt(s.name, VIEW_W / 2, 172, 18, s.color, "center");
    txt(s.tip, VIEW_W / 2, 200, 8, "#ffffff", "center");
    if (newSpell) txt(`NEW DOG SPELL: ${newSpell}!`, VIEW_W / 2, 218, 8, "#e0a8ff", "center");
    ctx.globalAlpha = 1;
  }
}

function drawBoard(cx, y, highlight, t) {
  const colors = ["#ffd447", "#d7dde8", "#e39a5a"];
  for (let i = 0; i < MAX_SCORES; i++) {
    const s = scores[i];
    const rank = String(i + 1).padStart(2, " ") + ".";
    const right = s ? (s.moon ? "WIN! " + fmtTime(s.time) : (s.height + " m").padStart(9)) : "".padStart(9);
    const line = `${rank} ${s ? s.initials : "---"}  ${right}`;
    const ry = y + i * 20;
    if (i === highlight) {
      ctx.fillStyle = Math.floor(t * 4) % 2 ? "rgba(255,212,71,0.35)" : "rgba(255,212,71,0.18)";
      rr(cx - 110, ry - 4, 220, 18, 4);
      ctx.fill();
    }
    txt(line, cx, ry, 10, s ? (colors[i] || "#ffffff") : "rgba(255,255,255,0.35)", "center");
  }
}

function drawTitle(t) {

  panel(28, 28, VIEW_W - 56, 572);
  txt("MOON HOP", cx, 54, 34, "#fff3b0", "center");
  txt("Climb from the sea to the black hole!", cx, 102, 9, "#c8d3ff", "center");

  const rows = IS_TOUCH

function drawCardIcon(cat, x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (cat === "jump") {                // an up arrow
    ctx.moveTo(x, y - 16); ctx.lineTo(x + 14, y); ctx.lineTo(x + 5, y); ctx.lineTo(x + 5, y + 14);
    ctx.lineTo(x - 5, y + 14); ctx.lineTo(x - 5, y); ctx.lineTo(x - 14, y);
  } else if (cat === "weapon") {       // a lightning bolt
    ctx.moveTo(x + 4, y - 16); ctx.lineTo(x - 10, y + 2); ctx.lineTo(x - 1, y + 2);
    ctx.lineTo(x - 5, y + 16); ctx.lineTo(x + 10, y - 3); ctx.lineTo(x + 1, y - 3);
  } else {                             // a shield
    ctx.moveTo(x, y - 16); ctx.lineTo(x + 13, y - 10); ctx.lineTo(x + 11, y + 4);
    ctx.lineTo(x, y + 16); ctx.lineTo(x - 11, y + 4); ctx.lineTo(x - 13, y - 10);
  }
  ctx.closePath();
  ctx.fill();
}

function drawStar(x, y, r, color, spin = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = spin - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
}

function drawGoal(t) {
  const g = currentLevel() && currentLevel().goal;
  if (!g) return;
  const sy = toScreenY(g.y);
  if (sy < -40 || sy > VIEW_H + 40) return;
  const glow = ctx.createRadialGradient(g.x, sy, 4, g.x, sy, 34);
  glow.addColorStop(0, "rgba(255,230,120,0.6)");
  glow.addColorStop(1, "rgba(255,230,120,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(g.x, sy, 34, 0, Math.PI * 2);
  ctx.fill();
  drawStar(g.x, sy, 15, "#ffd447", Math.sin(t * 2) * 0.3);
  txt("GOAL", g.x, sy - 32, 8, "#ffd447", "center");
}

// Small pictures for the builder's toolbar.
function drawToolIcon(id, x, y) {
  const bar = (bx, by, w) => { ctx.fillStyle = "#b8a4ff"; rr(bx, by, w, 6, 2); ctx.fill(); };
  if (id === "plat") bar(x - 14, y, 28);
  else if (id === "move") {
    bar(x - 10, y, 20);
    ctx.fillStyle = "#78dcff";
    ctx.beginPath(); ctx.moveTo(x - 18, y + 3); ctx.lineTo(x - 13, y - 1); ctx.lineTo(x - 13, y + 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 18, y + 3); ctx.lineTo(x + 13, y - 1); ctx.lineTo(x + 13, y + 7); ctx.fill();
  } else if (id === "sweep") {
    bar(x - 14, y + 4, 28);
    ctx.fillStyle = "#ffd447"; ctx.fillRect(x - 5, y - 6, 10, 10);
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(x - 2, y - 6, 3, 10);
  } else if (id === "poppy") {
    ctx.strokeStyle = "#3f8f3a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = "#e8322b"; ctx.beginPath(); ctx.arc(x, y - 2, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a1414"; ctx.beginPath(); ctx.arc(x, y - 2, 2, 0, Math.PI * 2); ctx.fill();
  } else if (ENEMY_INFO[id]) {
    ctx.fillStyle = `rgb(${ENEMY_INFO[id].color})`;
    ctx.beginPath(); ctx.arc(x, y + 1, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x - 3, y - 1, 2.5, 0, Math.PI * 2); ctx.arc(x + 3, y - 1, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (id === "goal") drawStar(x, y + 1, 10, "#ffd447");
  else if (id === "erase") {
    ctx.strokeStyle = "#ff6a6a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 7, y - 6); ctx.lineTo(x + 7, y + 8); ctx.moveTo(x + 7, y - 6); ctx.lineTo(x - 7, y + 8); ctx.stroke();
  }
}

function drawEditor(t) {
  // Height lines every 5 m, with a label every 25 m.
  for (let m = Math.ceil(camY / PX_PER_M / 5) * 5; m * PX_PER_M < camY + VIEW_H; m += 5) {
    const sy = toScreenY(m * PX_PER_M);
    ctx.fillStyle = m % 25 === 0 ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.06)";
    ctx.fillRect(0, sy, VIEW_W, 1);
    if (m % 25 === 0 && m > 0) txt(`${m} m`, 4, sy - 10, 7, "rgba(255,255,255,0.6)");
  }
  // How far each moving platform slides
  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = "rgba(120,220,255,0.6)";
  for (const s of movers) ctx.strokeRect(s.baseX - s.amp, toScreenY(s.y) - 2, s.w + s.amp * 2, 18);
  ctx.restore();

  // What you're about to place
  const m = ed.mouse, tool = TOOLS[ed.tool];
  if (ed.drag) {
    const x1 = Math.min(ed.drag.x, snap(m.x)), x2 = Math.max(ed.drag.x, snap(m.x));
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    rr(x1, toScreenY(ed.drag.y), Math.max(x2 - x1, 4), 14, 5);
    ctx.fill();
  } else if (m.in && m.y < VIEW_H - TOOLBAR_H) {
    ctx.globalAlpha = 0.5;
    if (tool.id === "plat" || tool.id === "move") { ctx.fillStyle = "#ffffff"; rr(snap(m.x) - 40, toScreenY(snap(edWorldY(m.y))), 80, 14, 5); ctx.fill(); }
    else if (tool.id === "erase") drawToolIcon("erase", m.x, m.y);
    else drawToolIcon(tool.id, m.x, m.y);
    ctx.globalAlpha = 1;
  }

  // Top bar
  ctx.fillStyle = "rgba(8,10,30,0.85)";
  ctx.fillRect(0, 0, VIEW_W, 44);
  txt(`LEVEL ${ed.level + 1}   ${tool.name}`, 10, 8, 9, "#7dff7a");
  txt(tool.tip, 10, 26, 7, "#c8d3ff");
  if (IS_TOUCH) {
    const scroll = d => () => { ed.camY = clamp(ed.camY + d, CAM_MIN, EDIT_MAX_Y - VIEW_H + 200); };
    uiButton("TEST", VIEW_W - 150, 6, 66, 32, () => handleEditorKey({ code: "Enter" }), "#7dff7a", 8);
    uiButton("SAVE", VIEW_W - 78, 6, 70, 32, () => handleEditorKey({ code: "Escape" }), "#ffd447", 8);
    uiButton("UP", VIEW_W - 58, 260, 50, 46, scroll(240), "#ffffff", 9);
    uiButton("DOWN", VIEW_W - 58, 314, 50, 46, scroll(-240), "#ffffff", 7);
    txt("TAP A TOOL, THEN TAP OR DRAG TO BUILD", cx0(), VIEW_H - TOOLBAR_H - 16, 7, "rgba(255,255,255,0.8)", "center");
  } else {
    if (m.in) txt(`${Math.max(0, Math.round(edWorldY(m.y) / PX_PER_M))} m`, VIEW_W - 10, 8, 9, "#ffffff", "right");
    txt("WHEEL or W/S SCROLL   ENTER TEST   ESC SAVE", cx0(), VIEW_H - TOOLBAR_H - 16, 7, "rgba(255,255,255,0.8)", "center");
  }

  // Toolbar
  const cw = VIEW_W / TOOLS.length, ty = VIEW_H - TOOLBAR_H;
  ctx.fillStyle = "rgba(8,10,30,0.92)";
  ctx.fillRect(0, ty, VIEW_W, TOOLBAR_H);
  TOOLS.forEach((tl, i) => {
    const x = i * cw;
    if (i === ed.tool) { ctx.fillStyle = "rgba(125,255,122,0.25)"; rr(x + 2, ty + 3, cw - 4, TOOLBAR_H - 6, 6); ctx.fill(); }
    txtPlain(String((i + 1) % 10), x + 4, ty + 5, 7, i === ed.tool ? "#7dff7a" : "rgba(255,255,255,0.5)");
    drawToolIcon(tl.id, x + cw / 2, ty + 30);
  });
  if (ed.msgT > 0) txt(ed.msg, cx0(), 300, 10, "#ffd447", "center");
}

        if (label === "NAME") {
          const n = window.prompt("Character name (up to 8 letters):", c.name);
          if (n !== null) c.name = n.toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 8);
        } else {
          handleCharKey({ code: m.x < VIEW_W / 2 ? "ArrowLeft" : "ArrowRight", key: "" });
        }
      }, "", 0, false);
    }
    txt(label, 64, y + 2, 8, sel ? "#ffd447" : "#c8d3ff");
    const vx = VIEW_W - 150;
    if (label === "CHARACTER") txt(`< ${sandbox.selected + 1} OF ${sandbox.characters.length} >`, vx + 40, y + 2, 9, "#ffffff", "center");
    else if (label === "NAME") txt(c.name + (sel && Math.floor(t * 3) % 2 ? "_" : ""), vx - 20, y + 2, 9, "#ffffff");
    else if (label === "HAT") txt(`< ${HATS[c.hat]} >`, vx + 40, y + 2, 8, "#ffffff", "center");
    else {
      const hex = PALETTE[c[COLOR_ROWS[label]]];
      txt("<", vx, y + 2, 9, "#ffffff");
      ctx.fillStyle = hex;
      rr(vx + 18, y - 2, 46, 16, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();
      txt(">", vx + 72, y + 2, 9, "#ffffff");
    }
  });
  if (IS_TOUCH) {
    txt("TAP THE LEFT OR RIGHT SIDE OF A ROW", cx, 514, 7, "#c8d3ff", "center");
    const key = code => () => handleCharKey({ code, key: "" });
    uiButton("NEW", 60, 536, 110, 32, key("Insert"), "#7dff7a", 9);
    uiButton("DELETE", 185, 536, 110, 32, key("Delete"), "#ff8a7a", 9);
    uiButton("DONE", 310, 536, 110, 32, key("Escape"), "#ffd447", 9);
  } else {
    const hints = ["UP / DOWN = PICK A ROW", "LEFT / RIGHT = CHANGE IT", "TYPE ON THE NAME ROW",
                   "N = NEW CHARACTER   DEL = DELETE", "ENTER or ESC = SAVE"];
    hints.forEach((h, i) => txt(h, cx, 520 + i * 16, 7, "#c8d3ff", "center"));
  }
  txt("YOUR CHARACTER PLAYS IN THE MAIN GAME TOO!", cx, 610, 7, "#7dff7a", "center");
}

function render(t) {
  // 1) The world, drawn small for the chunky pixel look
  ctx = wctx;
  wctx.setTransform(1 / PIXEL, 0, 0, 1 / PIXEL, 0, 0);
  drawSky();
  drawStars(t);
  drawBackdrop(t);
  drawMoon(t);
  drawClouds(t);
  const main = mode === "main";
  if (main) {
    drawEdgeGlow(DANGER_Y, "255,80,80");
    drawEdgeGlow(SPACE_Y, "120,210,255");
  }
  const inRun = state === "playing" || state === "paused" || state === "choose" || state === "over";
  if (inRun && main) drawRecordLines();
  for (const s of tower) drawPlatform(s, t);
  if (!main) drawGoal(t);
  if (main) drawBossArena(t);
  for (const c of tempPlats) drawCloudPlat(c);
  for (const f of poppies) drawPoppy(f, t);
  for (const e of enemies) if (e.alive) drawEnemy(e, t);
  drawParticles();
  drawPetals();
  drawShots();
  drawEffects();
  drawDog(t);
  drawPlayer(t);
  drawSpellCloud(t);
  drawWeather(t);
  drawConfetti();
  if (timeSlow > 0) {
    ctx.fillStyle = "rgba(80,140,255,0.12)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  // 2) Blow it up with sharp pixel edges, then put the words on top
  ctx = mainCtx;
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.drawImage(worldCanvas, 0, 0, VIEW_W, VIEW_H);
  for (const [fn, ...args] of textQueue) {
    mainCtx.globalAlpha = args.pop();
    fn(...args);
  }
  mainCtx.globalAlpha = 1;
  textQueue.length = 0;

  // 3) Menus and the HUD, drawn at full sharpness
  uiButtons.length = 0;
  if (inRun) {
    if (st.radar) drawRadar();
    drawHUD();
  }
  if (state === "title") drawTitle(t);
  else if (state === "editor") drawEditor(t);
  else if (state === "sandbox") drawSandboxHub(t);
  else if (state === "chars") drawCharMaker(t);
  else if (state === "credits") drawCredits();
  else if (state === "paused") drawPaused();
  else if (state === "choose") drawChoose(t);
  else if (state === "over") drawOver(t);
}

// =====================================================================
//  ON-SCREEN BUTTONS for touch screens (Round 9)
//  "Hold" buttons act like holding a key; "tap" buttons act like pressing one.
// =====================================================================
const pad = document.getElementById("pad"), pauseBtn = document.getElementById("pauseBtn");
const padExtras = document.getElementById("padExtras");

function bindPadButton(b) {
  const code = b.dataset.hold, tap = b.dataset.tap;
  const press = e => {
    e.preventDefault();
    if (b.dataset.down) return;
    b.dataset.down = "1";
    b.classList.add("on");
    if (code) { keys[code] = true; onKeyPress({ code, key: "", repeat: false }); }
    else if (tap === "spell") { if (state === "playing") castDogSpell(); }
    else if (tap) onKeyPress({ code: tap, key: "", repeat: false });
  };
  const release = () => {
    if (!b.dataset.down) return;
    delete b.dataset.down;
    b.classList.remove("on");
    if (code) keys[code] = false;
  };
  b.addEventListener("pointerdown", e => {
    try { b.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }   // lets a finger slide to the next button
    press(e);
  });
  b.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse" && e.pressure > 0) press(e); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, release);
  b.addEventListener("contextmenu", e => e.preventDefault());
}
document.querySelectorAll("#pad .pb, #pauseBtn").forEach(bindPadButton);

// Ability buttons only show up once you have that upgrade.
let padExtrasKey = "";
function updatePad() {
  const show = IS_TOUCH && state === "playing";
  pad.classList.toggle("hidden", !show);
  pauseBtn.classList.toggle("hidden", !show);
  if (!show) return;
  const extras = [[st.dive, "DIVE", "ArrowDown"], [st.dash, "DASH", "ShiftLeft"], [st.timeBubble, "SLOW", "KeyQ"],
                  [st.blink, "BLINK", "KeyE"], [st.cloud, "CLOUD", "KeyC"]].filter(x => x[0]);
  const key = extras.map(x => x[1]).join();
  if (key === padExtrasKey) return;
  padExtrasKey = key;
  padExtras.innerHTML = "";
  for (const [, label, codeName] of extras) {
    const b = document.createElement("button");
    b.className = "pb small";
    b.dataset.tap = codeName;
    b.textContent = label;
    bindPadButton(b);
    padExtras.appendChild(b);
  }
}
window.addEventListener("orientationchange", () => setTimeout(resize, 200));

// Phones (Round 10): iPhone Safari ignores "no zooming" in the page settings, so block
// pinch-zoom and double-tap zoom directly, and go full screen where the browser allows it.
if (IS_TOUCH) {
  for (const ev of ["gesturestart", "gesturechange", "gestureend"]) {
    document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  }
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();          // no double-tap zoom
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  const goFull = () => {
    const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try { const r = fs.call(el); if (r && r.catch) r.catch(() => {}); } catch (err) { /* not allowed here */ }
    }
  };
  document.addEventListener("pointerdown", goFull, { passive: true });
  document.addEventListener("fullscreenchange", resize);
  document.addEventListener("webkitfullscreenchange", resize);
}
// iPhone can only go truly full screen from the home screen, so the title screen says how.
const IOS_BROWSER = IS_TOUCH && navigator.standalone === false;

// =====================================================================
//  MAIN LOOP (fixed steps so the jumping feels the same on every computer)
// =====================================================================
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(now / 1000);
  updatePad();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
