<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Moon Hop">
<title>Moon Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05040f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  /* Touch screens (Round 9): no zooming, scrolling, text selection or tap flashes */
  html, body, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                       -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* Fill the whole phone screen and never scroll (Round 10) */
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; -webkit-text-size-adjust: 100%; }
  #pad { position: fixed; inset: 0; pointer-events: none; font-family: "Press Start 2P", monospace; }
  #pad.hidden, #pauseBtn.hidden { display: none; }
  .pb { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        border: 3px solid rgba(255,255,255,0.55); background: rgba(30,34,70,0.8); color: #fff; font: inherit;
        font-size: 12px; border-radius: 16px; width: 76px; height: 76px; padding: 0; }
  .pb.big { width: 92px; height: 92px; font-size: 13px; border-color: #7dff7a; }
  .pb.small { width: 62px; height: 42px; font-size: 8px; border-color: #c39bff; border-radius: 12px; }
  .pb.on { background: rgba(125,255,122,0.5); }
  #padLeft, #padRight, #padExtras { position: absolute; display: flex; gap: 8px; align-items: flex-end; }
  #padLeft { left: calc(10px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  #padExtras { left: calc(10px + env(safe-area-inset-left)); bottom: calc(104px + env(safe-area-inset-bottom)); flex-wrap: wrap; width: 200px; }
  #padRight { right: calc(10px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
              flex-wrap: wrap; justify-content: flex-end; width: 184px; }
  #pauseBtn { position: fixed; width: 40px; height: 40px; font-size: 10px; border-radius: 10px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="pad" class="hidden">
  <div id="padLeft">
    <button class="pb" data-hold="ArrowLeft">&lt;</button>
    <button class="pb" data-hold="ArrowRight">&gt;</button>
  </div>
  <div id="padExtras"></div>
  <div id="padRight">
    <button class="pb small" data-tap="spell">SPELL</button>
    <button class="pb small" data-tap="KeyV">NEXT</button>
    <button class="pb" data-hold="KeyF">SHOOT</button>
    <button class="pb big" data-hold="Space">JUMP</button>
  </div>
</div>
<button id="pauseBtn" class="pb hidden" data-tap="KeyP">II</button>

];

// ---------- Biomes (Round 7 sections, redone in Round 10) ----------
// From the bottom of the sea to the black hole. Each one has its own sky, platforms,
// background, gravity (x normal), fall speed (x normal) and something new.
const SECTIONS = [
  { id: "water", name: "UNDER THE SEA", from: 0, to: 120, color: "#5ad1ff", tip: "WATER MAKES YOU FLOATY",
    sky: [[20, 70, 140], [40, 120, 190]], top: [90, 210, 180], body: [60, 80, 120], gravity: 0.6, fall: 0.45 },
  { id: "jungle", name: "THE JUNGLE", from: 120, to: 300, color: "#7dff7a", tip: "BOUNCY MUSHROOMS! HOLD JUMP",
    sky: [[110, 190, 130], [140, 205, 175]], top: [100, 200, 60], body: [110, 75, 45], gravity: 1, fall: 1 },
  { id: "mountains", name: "THE MOUNTAINS", from: 300, to: 520, color: "#d2c8b4", tip: "FALLING ROCKS! THE DANGER ZONE",
    sky: [[140, 180, 225], [115, 155, 210]], top: [160, 155, 140], body: [100, 95, 90], gravity: 1, fall: 1 },
  { id: "snowy", name: "SNOWY PEAKS", from: 520, to: 700, color: "#e6f4ff", tip: "ICY PLATFORMS ARE SLIPPERY",
    sky: [[185, 205, 235], [150, 175, 220]], top: [235, 245, 255], body: [140, 160, 185], gravity: 1, fall: 1 },
  { id: "sky", name: "THE SKY", from: 700, to: 850, color: "#ffffff", tip: "WATCH OUT FOR WIND GUSTS",
    sky: [[100, 165, 245], [70, 125, 215]], top: [255, 255, 255], body: [200, 210, 235], gravity: 1, fall: 1 },
  { id: "darksky", name: "UPPER ATMOSPHERE", from: 850, to: 1000, color: "#ffd447", tip: "LIGHTNING STORMS!",
    sky: [[40, 40, 95], [18, 18, 58]], top: [255, 214, 90], body: [60, 62, 92], gravity: 1, fall: 1 },
  { id: "space", name: "OUTER SPACE", from: 1000, to: 1200, color: "#a0c8ff", tip: "LOW GRAVITY! SPACE JUNK CRUMBLES",
    sky: [[10, 12, 40], [8, 8, 30]], top: [160, 200, 255], body: [110, 116, 130], gravity: 0.55, fall: 0.6 },
  { id: "moon", name: "THE MOON", from: 1200, to: 1400, color: "#fff3b0", tip: "MOON GRAVITY! PLATFORMS BLINK OUT",
    sky: [[14, 14, 26], [10, 10, 20]], top: [236, 234, 226], body: [128, 124, 116], gravity: 0.42, fall: 0.55 },
  { id: "mars", name: "MARS", from: 1400, to: 1600, color: "#ff8a5a", tip: "RED DUST STORMS!",
    sky: [[120, 60, 40], [80, 36, 28]], top: [230, 120, 80], body: [140, 60, 40], gravity: 0.7, fall: 0.75 },
  { id: "sun", name: "THE SUN", from: 1600, to: 1800, color: "#ff9f40", tip: "SOLAR FLARES! THE SUN KING!",
    sky: [[70, 28, 18], [40, 16, 20]], top: [255, 200, 90], body: [170, 70, 40], gravity: 0.55, fall: 0.6 },
  { id: "blackhole", name: "THE BLACK HOLE", from: 1800, to: 2000, color: "#c39bff", tip: "ASTEROIDS! THE FINAL BOSS AWAITS",
    sky: [[24, 8, 36], [4, 0, 8]], top: [190, 120, 255], body: [50, 30, 70], gravity: 0.55, fall: 0.6 },
];
const secIndex = id => SECTIONS.findIndex(s => s.id === id);
const sectionAt = m => { for (let i = SECTIONS.length - 1; i > 0; i--) if (m >= SECTIONS[i].from) return i; return 0; };
const BLINK_CYCLE = 3.4, BLINK_ON = 2.2;   // aurora platforms: solid 2.2 s, gone 1.2 s

// The dog learns a new spell in each section. V switches, CTRL+B casts.
const SPELLS = [
  { id: "cloud", name: "PURPLE CLOUD", cd: 15, color: "200,120,255" },     // enemies can't touch you for 5 s
  { id: "bubble", name: "BUBBLE BOUNCE", cd: 12, color: "150,220,255" },   // a bouncy bubble under your feet
  { id: "zap", name: "LIGHTNING ZAP", cd: 15, color: "255,240,120" },      // zaps every enemy on screen
  { id: "tailwind", name: "TAILWIND", cd: 14, color: "200,255,220" },      // a big whoosh upward
  { id: "rainbow", name: "RAINBOW BRIDGE", cd: 18, color: "255,150,230" }, // a wide rainbow to stand on

  { id: "moonhowl", name: "MOON HOWL", cd: 25, color: "255,250,210" },     // full super jumps + star power
];

// ---------- The flying Boston terrier (Round 5) ----------
const DOG_SPELL = { length: 5, cooldown: 15 };   // purple cloud lasts 5 s, recharges in 15 s

// ---------- Sandbox and custom characters (Round 6) ----------
const LEVEL_SLOTS = 5;
const EDIT_MAX_Y = 900 * PX_PER_M;    // how tall a sandbox level can be
const SANDBOX_KEY = "moonhop.sandbox.v1";
const PALETTE = ["#f5f7fc", "#aab3c8", "#3a3a48", "#ff5a5a", "#ff9f40", "#ffd447", "#7dff7a",
                 "#3fd0c9", "#5a9bff", "#a565f0", "#ff8fd0", "#8b5a2b"];
const HATS = ["NONE", "CAP", "CROWN", "PARTY HAT", "BOW", "ANTENNA", "COWBOY HAT", "FLOWER"];
const DEFAULT_CHARACTER = { name: "ASTRO", suit: 0, visor: 8, pack: 1, hat: 0, hatColor: 3, wings: 9 };
const TOOLS = [
  { id: "plat", name: "PLATFORM", tip: "DRAG LEFT TO RIGHT TO DRAW A PLATFORM" },
  { id: "move", name: "MOVING PLATFORM", tip: "DRAW ONE, OR CLICK A PLATFORM TO MAKE IT MOVE" },
  { id: "sweep", name: "SWEEPER", tip: "CLICK A PLATFORM TO ADD OR REMOVE A SWEEPER" },
  { id: "poppy", name: "POPPY", tip: "CLICK A PLATFORM TO PLANT OR PICK A POPPY" },
  { id: "grumble", name: "GRUMPY CLOUD", tip: "CLICK TO PLACE AN ENEMY", enemy: true },
  { id: "buzzer", name: "BUZZ BUG", tip: "CLICK TO PLACE AN ENEMY", enemy: true },
  { id: "swooper", name: "SWOOPER BIRD", tip: "CLICK TO PLACE AN ENEMY", enemy: true },

  { id: "goal", name: "GOAL STAR", tip: "CLICK TO PUT THE FINISH LINE (TOUCH IT TO WIN)" },
  { id: "erase", name: "ERASER", tip: "CLICK SOMETHING TO REMOVE IT (OR RIGHT-CLICK)" },
];
const TOOLBAR_H = 56;

const MAX_SCORES = 10;
const SCORE_KEY = "moonhop.scores.v1";
const FONT = '"Press Start 2P", "Courier New", monospace';

// ---------- Little helpers ----------
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpRGB = (a, b, t) => [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], t)));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (h, to, k) => rgb(lerpRGB(hexRGB(h), to, k));   // blend a color toward `to` ([r,g,b])
const snap = v => Math.round(v / 10) * 10;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function gradientAt(stops, t) {
  t = clamp(t, stops[0][0], stops[stops.length - 1][0]);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
      return lerpRGB(c0, c1, (t - p0) / (p1 - p0));
    }
  }
  return stops[stops.length - 1][1];
}

// ---------- Canvas ----------
const canvas = document.getElementById("game");
const mainCtx = canvas.getContext("2d");
// The pixel look (Round 7): the world is drawn at half size, then blown up with
// chunky pixels. Words stay sharp: any text drawn during the world part waits in
// textQueue and goes on top afterward.
const PIXEL = 2;
const worldCanvas = document.createElement("canvas");
worldCanvas.width = VIEW_W / PIXEL;
worldCanvas.height = VIEW_H / PIXEL;
const wctx = worldCanvas.getContext("2d");
let ctx = mainCtx;
const textQueue = [];

// Touch screens (Round 9): on-screen buttons go below the game when the device is
// upright, or beside it when it's sideways, so they never cover the action.
const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const PAD_BELOW = 196, PAD_SIDE = 200;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  const portrait = H >= W;
  const roomW = IS_TOUCH && !portrait ? W - PAD_SIDE * 2 : W;
  const roomH = IS_TOUCH && portrait ? H - PAD_BELOW : H;
  const scale = Math.max(0.2, Math.min(roomW / VIEW_W, roomH / VIEW_H));
  const cw = Math.floor(VIEW_W * scale), ch = Math.floor(VIEW_H * scale);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  if (IS_TOUCH) {
    const left = Math.floor((W - cw) / 2), top = portrait ? Math.max(0, Math.floor((roomH - ch) / 2)) : Math.floor((H - ch) / 2);
    Object.assign(canvas.style, { position: "absolute", left: left + "px", top: top + "px" });
    Object.assign(document.getElementById("pauseBtn").style, { left: left + cw - 48 + "px", top: top + Math.floor(ch * 0.075) + "px" });
  }
  canvas.width = Math.floor(VIEW_W * scale * dpr);
  canvas.height = Math.floor(VIEW_H * scale * dpr);
  mainCtx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function txt(str, x, y, size, color, align = "left") {
  if (ctx === wctx) { textQueue.push([txt, str, x, y, size, color, align, ctx.globalAlpha]); return; }
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  const off = Math.max(1, Math.round(size / 8));
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText(str, x + off, y + off);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function txtPlain(str, x, y, size, color, align = "left") {
  if (ctx === wctx) { textQueue.push([txtPlain, str, x, y, size, color, align, ctx.globalAlpha]); return; }
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function wrapLines(str, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const lines = [];
  let line = "";
  for (const word of str.split(" ")) {
    const test = line ? line + " " + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(8,10,30,0.97)";
  rr(x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 2;
  ctx.stroke();
}

// =====================================================================
//  THE TOWER - platforms from the ground up to the Moon.
//  Kinds: "ground", "step" (normal), "ledge" (wide rest stop every 100 m),
//  "pad" (the last platform, right under the Moon).
// =====================================================================
function jumpReach(gap) {
  // How far sideways you can travel while jumping up onto something `gap` pixels higher.
  const disc = JUMP_V * JUMP_V - 2 * GRAVITY * gap;
  if (disc <= 0) return 0;
  return MAX_RUN * (JUMP_V + Math.sqrt(disc)) / GRAVITY;
}

function buildTower() {
  const rnd = mulberry32(TOWER_SEED);
  const R = (a, b) => a + (b - a) * rnd();
  const list = [{ x: -40, y: 0, w: VIEW_W + 80, kind: "ground" }];
  const padY = MOON_Y - 80;
  let prev = { x: VIEW_W / 2 - 80, y: 0, w: 160 };
  let nextMark = 100 * PX_PER_M;

  while (true) {
    const d = prev.y / MOON_Y;                     // 0 at the ground, 1 at the Moon
    const maxGap = lerp(74, 108, d);
    const remaining = padY - prev.y;
    if (remaining <= maxGap) break;

    let gap = R(lerp(56, 92, d), maxGap);
    if (remaining - gap < 50) gap = remaining / 2;
    let y = prev.y + gap;
    let kind = "step", mark = 0;
    if (y >= nextMark) {
      kind = "ledge";
      mark = nextMark / PX_PER_M;
      if (nextMark - prev.y >= 45) y = nextMark;
      nextMark += 100 * PX_PER_M;
    }

    // Platforms get narrower and farther apart the higher you go,
    // and 30% smaller again past the difficulty turn.
    let w = kind === "ledge" ? 190 : clamp(R(lerp(130, 48, d), lerp(170, 74, d)), 44, 190);
    if (kind === "step" && y >= DANGER_Y) w = Math.max(DANGER_MIN_W, w * DANGER_SHRINK);
    const edgeMax = jumpReach(y - prev.y) * lerp(0.3, 0.7, d);
    const edge = R(-0.35 * Math.min(w, prev.w), edgeMax);   // sideways gap between edges
    const dist = (prev.w + w) / 2 + edge;
    const pc = prev.x + prev.w / 2;
    const dir = rnd() < 0.5 ? -1 : 1;
    const lo = w / 2 + 6, hi = VIEW_W - w / 2 - 6;
    let c = pc + dir * dist;
    if (c < lo || c > hi) c = pc - dir * dist;
    c = clamp(c, lo, hi);

    const p = { x: c - w / 2, y, w, kind };
    if (kind === "ledge") p.mark = mark;
    list.push(p);
    prev = p;
  }
  list.push({ x: VIEW_W / 2 - 90, y: padY, w: 180, kind: "pad" });
  return list;
}
const tower = buildTower();

// The difficulty turn: above DANGER_Y some platforms move or get a sweeper.
// Rest ledges and the last pad are left alone. Uses its own dice, so it's the same every game.
function applyDangerZone() {
  const rnd = mulberry32(TOWER_SEED + 2);
  const R = (a, b) => a + (b - a) * rnd();
  for (const s of tower) {
    if (s.kind !== "step" || s.y < DANGER_Y) continue;
    const d = (s.y - DANGER_Y) / (MOON_Y - DANGER_Y);     // 0 at the turn, 1 at the Moon
    if (rnd() < lerp(MOVER_CHANCE[0], MOVER_CHANCE[1], d)) {
      const room = Math.min(s.x - 4, VIEW_W - 4 - (s.x + s.w));
      const amp = Math.min(R(40, 90), room);
      if (amp >= 20) Object.assign(s, { baseX: s.x, amp, period: R(2.5, 4.5), phase: R(0, 6.28), ang: 0, dx: 0 });
    } else if (s.w >= 44 && rnd() < lerp(SWEEPER_CHANCE[0], SWEEPER_CHANCE[1], d)) {
      s.sweeper = { period: R(1.8, 2.8), phase: R(0, 1), u: 0, x: s.x, dir: 1, frozen: 0 };
    }
  }
}
applyDangerZone();

// Section platforms (Round 7): bouncy clouds, blinking aurora platforms and crumbling space junk.
function applySections() {
  const rnd = mulberry32(TOWER_SEED + 4);
  for (const s of tower) {
    if (s.kind !== "step") continue;
    const sec = SECTIONS[sectionAt(s.y / PX_PER_M)].id, r = rnd();
    if (sec === "jungle" && r < 0.35) s.bouncy = true;                                   // bouncy mushrooms
    else if (sec === "snowy" && r < 0.4 && !s.sweeper) s.icy = true;                     // slippery ice
    else if (sec === "space" && r < 0.3 && !s.amp && !s.sweeper) s.crumble = true;       // crumbling space junk
    else if (sec === "moon" && r < 0.3 && !s.amp && !s.sweeper) { s.blink = true; s.blinkPh = rnd() * BLINK_CYCLE; }
  }
}
applySections();
const movers = tower.filter(s => s.amp);
const sweepers = tower.filter(s => s.sweeper);

// Poppies use their own dice, so the tower itself stays exactly the same.
// Each poppy remembers its platform, so it rides along if the platform moves.
function buildPoppies() {
  const rnd = mulberry32(TOWER_SEED + 1);
  const list = [{ x: 130, y: 0, plat: tower[0] }];     // one on the ground to say hello
  for (const s of tower) {
    if (s.kind !== "step" && s.kind !== "ledge") continue;
    if (rnd() >= POPPY_CHANCE) continue;
    const lo = s.kind === "ledge" ? s.x + s.w * 0.55 : s.x + 10;   // stay clear of ledge signs
    list.push({ x: lerp(lo, s.x + s.w - 10, rnd()), y: s.y, plat: s });
  }
  for (const f of list) Object.assign(f, { off: f.x - f.plat.x, cool: 0, bounce: 0, ph: rnd() * 6.28 });
  return list;
}
const poppies = buildPoppies();

// Enemies float between the platforms. Same spots every game; more of them higher up.
function buildEnemies() {
  const rnd = mulberry32(TOWER_SEED + 3);
  const R = (a, b) => a + (b - a) * rnd();
  const list = [];
  for (let m = 45; m < MOON_METERS - 40; m += lerp(70, 30, m / MOON_METERS) * R(0.8, 1.2)) {
    const kinds = Object.keys(ENEMY_INFO).filter(k => m >= ENEMY_INFO[k].from && m <= ENEMY_INFO[k].to);
    const type = kinds[Math.floor(rnd() * kinds.length)];
    list.push({
      type, hx: R(40, VIEW_W - 40), hy: m * PX_PER_M + R(30, 70), maxHp: ENEMY_INFO[type].hp,
      r: ENEMY_INFO[type].r, ph: R(0, 6.28), amp: R(70, 150), period: R(4.5, 7),
    });
  }
  return list;
}
const enemies = buildEnemies();

// ---------- Swapping worlds: the main climb, or a level you built ----------
const MAIN_WORLD = { tower: tower.slice(), movers: movers.slice(), sweepers: sweepers.slice(),
                     poppies: poppies.slice(), enemies: enemies.slice() };

function setWorld(w) {
  for (const [arr, items] of [[tower, w.tower], [movers, w.movers], [sweepers, w.sweepers],
                              [poppies, w.poppies], [enemies, w.enemies]]) {
    arr.length = 0;
    arr.push(...items);
  }
}

const emptyLevel = () => ({ platforms: [], enemies: [], goal: null });

// Turn a saved sandbox level into platforms, sweepers, poppies and enemies.
function buildLevelWorld(L) {
  const t = [{ x: -40, y: 0, w: VIEW_W + 80, kind: "ground" }];
  const pops = [];
  for (const p of L.platforms) {
    const s = { x: p.x, y: p.y, w: p.w, kind: "step" };
    if (p.move) {
      const amp = Math.min(70, p.x - 4, VIEW_W - 4 - (p.x + p.w));
      if (amp >= 10) Object.assign(s, { baseX: p.x, amp, period: 3.5, phase: 0, ang: 0, dx: 0 });
    }
    if (p.sweep && !s.amp) s.sweeper = { period: 2.2, phase: 0, u: 0, x: p.x, dir: 1, frozen: 0 };
    t.push(s);
    if (p.poppy != null) pops.push({ x: p.x + p.poppy, y: p.y, plat: s, off: p.poppy, cool: 0, bounce: 0, ph: p.x });
  }
  const ens = L.enemies.map(e => ({
    type: e.type, hx: e.x, hy: e.y, maxHp: ENEMY_INFO[e.type].hp, r: ENEMY_INFO[e.type].r,
    ph: 0, amp: 100, period: 5.5,
  }));
  return { tower: t, movers: t.filter(s => s.amp), sweepers: t.filter(s => s.sweeper), poppies: pops, enemies: ens };
}

const cm = { row: 0 };          // character maker

const toScreenY = y => VIEW_H - (y - camY);

function resetWorld() {

  taken = [];

    x: VIEW_W / 2 - PLAYER_W / 2, y: 0, vx: 0, vy: 0, landY: 0,

    onGround: true, coyote: 0, buffer: 0, jumping: false,
    facing: 1, squash: 1, walk: 0,

function resetEnemies() {

      x: e.hx, y: e.hy, hp: e.maxHp, alive: true, t: 0, pvx: 0, pvy: 0, frozen: 0,

function startRun() {

const currentLevel = () => sandbox.levels[ed.level];

  mode = "main";
  setWorld(MAIN_WORLD);
  resetWorld();

  state = "sandbox";

function openEditor(i) {
  if (ed.level !== i) ed.camY = CAM_MIN;
  ed.level = i;
  if (!sandbox.levels[i]) sandbox.levels[i] = emptyLevel();
  mode = "sandbox";
  setWorld(buildLevelWorld(sandbox.levels[i]));
  resetWorld();
  ed.drag = null;
  state = "editor";
}

function playLevel(i, from) {
  ed.level = i;
  sbReturn = from;
  mode = "sandbox";
  setWorld(buildLevelWorld(sandbox.levels[i] || emptyLevel()));

function sandboxEnd(won) {

  state = "over";

  overTimer = 0.6;
  if (won) confettiBurst();
}

function touchesGoal() {
  const g = currentLevel() && currentLevel().goal;
  if (!g) return false;
  const nx = clamp(g.x, player.x, player.x + PLAYER_W), ny = clamp(g.y, player.y, player.y + PLAYER_H);
  return (nx - g.x) ** 2 + (ny - g.y) ** 2 < 18 * 18;
}

// =====================================================================
//  HIGH SCORES
//  Started with "Play Moon Hop", scores are saved in scores.json in the
//  game folder (so they survive every new build). This browser keeps a copy too.
// =====================================================================
// Only the home launcher (Play Moon Hop) has a save-file server; on the website, scores live in the browser.
const SERVED = location.protocol === "http:" && (location.hostname === "localhost" || location.hostname === "127.0.0.1");
const ON_WEB = location.protocol === "https:";
const compareScores = (a, b) => (b.height - a.height) || (a.time - b.time);

function cleanScores(arr) {
  if (!Array.isArray(arr)) return [];
  return arr
    .filter(s => s && typeof s.initials === "string" && typeof s.height === "number")
    .sort(compareScores)
    .slice(0, MAX_SCORES);
}

function mergeScores(a, b) {
  const seen = new Set(), out = [];
  for (const s of [...a, ...b]) {
    const key = `${s.initials}|${s.height}|${s.time}|${!!s.moon}`;
    if (!seen.has(key)) { seen.add(key); out.push(s); }
  }
  return cleanScores(out);
}

function loadLocalScores() {
  try { return cleanScores(JSON.parse(localStorage.getItem(SCORE_KEY) || "[]")); }
  catch (e) { return []; }
}

const localOK = (() => {
  try {
    localStorage.setItem("moonhop.test", "1");
    localStorage.removeItem("moonhop.test");
    return true;
  } catch (e) { return false; }
})();
let fileScoresOK = false;
let scores = loadLocalScores();

function storeScores() {
  try { localStorage.setItem(SCORE_KEY, JSON.stringify(scores)); } catch (e) { /* the file copy still works */ }
  if (SERVED) {
    fetch("/api/scores", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(scores) })
      .then(r => { fileScoresOK = r.ok; })
      .catch(() => { fileScoresOK = false; });
  }
}

if (SERVED) {
  fetch("/api/scores", { cache: "no-store" })
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(arr => {
      const fromFile = cleanScores(arr);
      fileScoresOK = true;
      scores = mergeScores(fromFile, scores);
      if (scores.length !== fromFile.length) storeScores();   // copy browser-only scores into the file
    })
    .catch(() => { fileScoresOK = false; });
}

// ---------- Sandbox levels and custom characters: saved in sandbox.json ----------
function cleanSandbox(d) {
  const out = { levels: [], characters: [], selected: 0 };
  for (let i = 0; i < LEVEL_SLOTS; i++) {
    const L = d && Array.isArray(d.levels) ? d.levels[i] : null;
    out.levels.push(L && Array.isArray(L.platforms) ? {
      platforms: L.platforms.filter(p => p && typeof p.x === "number" && typeof p.y === "number"),
      enemies: Array.isArray(L.enemies) ? L.enemies.filter(e => e && ENEMY_INFO[e.type]) : [],
      goal: L.goal && typeof L.goal.x === "number" ? L.goal : null,
    } : null);
  }
  const chars = d && Array.isArray(d.characters) && d.characters.length ? d.characters : [DEFAULT_CHARACTER];
  out.characters = chars.slice(0, 8).map(c => ({ ...DEFAULT_CHARACTER, ...c }));
  out.selected = clamp(Number(d && d.selected) || 0, 0, out.characters.length - 1);
  return out;
}

let sandbox = (() => {
  try { return cleanSandbox(JSON.parse(localStorage.getItem(SANDBOX_KEY) || "null")); }
  catch (e) { return cleanSandbox(null); }
})();
const currentChar = () => sandbox.characters[sandbox.selected] || DEFAULT_CHARACTER;

function saveSandbox() {
  try { localStorage.setItem(SANDBOX_KEY, JSON.stringify(sandbox)); } catch (e) { /* the file copy still works */ }
  if (SERVED) {
    fetch("/api/sandbox", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sandbox) })
      .catch(() => {});
  }
}

if (SERVED) {
  fetch("/api/sandbox", { cache: "no-store" })
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(d => { if (d && Array.isArray(d.levels)) sandbox = cleanSandbox(d); })
    .catch(() => {});
}

function qualifies(r) {
  return r.height > 0 && (scores.length < MAX_SCORES || compareScores(r, scores[MAX_SCORES - 1]) < 0);
}

function endRun(moon) {
  if (moon) maxHeightPx = MOON_Y;
  result = {
    moon,
    height: moon ? MOON_METERS : Math.floor(maxHeightPx / PX_PER_M),
    time: Math.round(runTime * 10) / 10,
  };
  state = "over";
  overTimer = 0.9;              // short pause so a held key doesn't skip the screen
  highlightIndex = -1;
  if (qualifies(result)) {
    overPhase = "initials";
    const fromName = (currentChar().name.toUpperCase().replace(/[^A-Z]/g, "") + "AAA").slice(0, 3);
    entry = { letters: fromName.split(""), pos: 0 };          // starts as your character's name
  } else {
    overPhase = "board";
  }
}

function saveEntry() {
  const rec = { initials: entry.letters.join(""), height: result.height, moon: result.moon, time: result.time };
  scores.push(rec);
  scores.sort(compareScores);
  scores = scores.slice(0, MAX_SCORES);
  highlightIndex = scores.indexOf(rec);
  storeScores();
  overPhase = "board";
  overTimer = 0.3;
}

// =====================================================================
//  INPUT
// =====================================================================
const keys = {};
const JUMP_CODES = ["Space", "ArrowUp", "KeyW"];
const NO_SCROLL = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Backspace"];

window.addEventListener("keydown", e => {
  if (NO_SCROLL.includes(e.code)) e.preventDefault();
  if (e.code === "KeyB" && (e.ctrlKey || e.metaKey)) {   // CTRL+B: the dog's glitter spell
    e.preventDefault();                                  // (stops the browser's bookmark bar)
    if (state === "playing" && !e.repeat) castDogSpell();
    return;
  }
  keys[e.code] = true;
  const initials = state === "over" && overPhase === "initials";
  if (e.repeat && !initials) return;
  onKeyPress(e);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  if (state === "playing") state = "paused";
});

function onKeyPress(e) {
  const c = e.code;
  if (state === "title") {
    if (c === "Space" || c === "Enter") startRun();
    else if (c === "KeyC") openCredits();
    else if (c === "KeyS") openSandbox();
  } else if (state === "sandbox") {
    handleSandboxKey(e);
  } else if (state === "editor") {
    handleEditorKey(e);
  } else if (state === "chars") {
    handleCharKey(e);
  } else if (state === "credits") {
    state = "title";
  } else if (state === "playing") {
    if (JUMP_CODES.includes(c)) player.buffer = JUMP_BUFFER;
    else if (c === "KeyP" || c === "Escape") state = "paused";
    else if (c === "ArrowDown" || c === "KeyS") useDive();
    else if (c === "ShiftLeft" || c === "ShiftRight") useDash();
    else if (c === "KeyQ") useTimeBubble();
    else if (c === "KeyE") useBlink();
    else if (c === "KeyC") useCloud();
    else if (c === "KeyV" && player.spells.length > 1) player.spellSel = (player.spellSel + 1) % player.spells.length;
  } else if (state === "paused") {
    if (c === "KeyP" || c === "Escape" || c === "Enter") state = "playing";
    else if (mode === "sandbox" && c === "KeyE") openEditor(ed.level);
  } else if (state === "choose") {
    handleChooseKey(e);
  } else if (state === "over") {
    handleOverKey(e);
  }
}

function shiftLetter(ch, step) {
  const n = (ch.charCodeAt(0) - 65 + step + 26) % 26;
  return String.fromCharCode(65 + n);
}

function handleOverKey(e) {
  if (overTimer > 0) return;
  const c = e.code;
  if (overPhase === "sandbox") {
    if (c === "KeyR" || c === "Space" || c === "Enter") playLevel(ed.level, sbReturn);
    else if (c === "KeyE") openEditor(ed.level);
    else if (c === "Escape") openSandbox();
    return;
  }
  if (overPhase === "initials") {
    const L = entry.letters;
    if (c === "ArrowUp") L[entry.pos] = shiftLetter(L[entry.pos], 1);
    else if (c === "ArrowDown") L[entry.pos] = shiftLetter(L[entry.pos], -1);
    else if (c === "ArrowLeft" || c === "Backspace") entry.pos = Math.max(0, entry.pos - 1);
    else if (c === "ArrowRight") entry.pos = Math.min(2, entry.pos + 1);
    else if (c === "Enter") { if (entry.pos < 2) entry.pos++; else saveEntry(); }
    else if (/^[a-z]$/i.test(e.key)) {
      L[entry.pos] = e.key.toUpperCase();
      if (entry.pos < 2) entry.pos++;
    }
  } else {
    if (c === "Space" || c === "Enter") startRun();
    else if (c === "Escape") showTitle();
  }
}

// ---------- Sandbox menu ----------
function handleSandboxKey(e) {
  const c = e.code;
  if (c !== "KeyX") clearArmed = false;
  if (c === "ArrowUp" || c === "KeyW") sbSel = (sbSel + LEVEL_SLOTS - 1) % LEVEL_SLOTS;
  else if (c === "ArrowDown" || c === "KeyS") sbSel = (sbSel + 1) % LEVEL_SLOTS;
  else if (c === "Enter") openEditor(sbSel);
  else if (c === "Space") { if (sandbox.levels[sbSel]) playLevel(sbSel, "sandbox"); }
  else if (c === "KeyX" && sandbox.levels[sbSel]) {
    if (clearArmed) { sandbox.levels[sbSel] = null; saveSandbox(); clearArmed = false; }
    else clearArmed = true;
  }
  else if (c === "KeyC") { cm.row = 0; state = "chars"; }
  else if (c === "Escape") showTitle();
}

// ---------- Level builder ----------
const edWorldY = my => ed.camY + (VIEW_H - my);
const edMsg = str => { ed.msg = str; ed.msgT = 1.6; };

function handleEditorKey(e) {
  const c = e.code;
  if (/^Digit[0-9]$/.test(c)) ed.tool = (Number(c.slice(5)) + 9) % 10;     // 1..9 then 0
  else if (c === "Enter" || c === "KeyP") { saveSandbox(); playLevel(ed.level, "editor"); }
  else if (c === "Escape") { saveSandbox(); openSandbox(); }
}

function editorChanged() {
  setWorld(buildLevelWorld(currentLevel()));
  resetMovers();
  resetEnemies();
  saveSandbox();
}

function platAt(L, x, wy) {
  for (let i = L.platforms.length - 1; i >= 0; i--) {
    const p = L.platforms[i];
    if (x >= p.x - 4 && x <= p.x + p.w + 4 && wy >= p.y - 14 && wy <= p.y + 28) return p;
  }
  return null;
}

function eraseAt(L, x, wy) {
  const ei = L.enemies.findIndex(e => Math.hypot(e.x - x, e.y - wy) < ENEMY_INFO[e.type].r + 10);
  if (ei >= 0) { L.enemies.splice(ei, 1); return; }
  if (L.goal && Math.hypot(L.goal.x - x, L.goal.y - wy) < 26) { L.goal = null; return; }
  const withPoppy = L.platforms.find(p => p.poppy != null && Math.abs(p.x + p.poppy - x) < 10 && wy > p.y + 8 && wy < p.y + 34);
  if (withPoppy) { withPoppy.poppy = null; return; }
  const p = platAt(L, x, wy);
  if (p) L.platforms.splice(L.platforms.indexOf(p), 1);
}

function editorPress(m, button) {
  if (m.y >= VIEW_H - TOOLBAR_H) {                               // the toolbar
    const i = Math.floor(m.x / (VIEW_W / TOOLS.length));
    if (TOOLS[i]) ed.tool = i;
    return;
  }
  const L = currentLevel(), tool = TOOLS[ed.tool];
  const x = clamp(m.x, 0, VIEW_W), wy = edWorldY(m.y);
  if (button === 2 || tool.id === "erase") { eraseAt(L, x, wy); editorChanged(); return; }
  if (wy > EDIT_MAX_Y) { edMsg("THAT'S AS HIGH AS LEVELS GO"); return; }
  const hit = platAt(L, x, wy);

  if (tool.id === "plat" || tool.id === "move") {
    if (tool.id === "move" && hit) {
      hit.move = hit.move ? 0 : 1;
      if (hit.move) hit.sweep = 0;
      editorChanged();
      return;
    }
    if (wy < 40) { edMsg("TOO CLOSE TO THE GROUND"); return; }
    ed.drag = { x: snap(x), y: snap(wy), move: tool.id === "move" };
  } else if (tool.id === "sweep") {
    if (!hit) { edMsg("CLICK ON A PLATFORM"); return; }
    if (!hit.sweep && (hit.move || hit.w < 44)) { edMsg(hit.move ? "NOT ON MOVING PLATFORMS" : "PLATFORM IS TOO SMALL"); return; }
    hit.sweep = hit.sweep ? 0 : 1;
    editorChanged();
  } else if (tool.id === "poppy") {
    if (!hit) { edMsg("CLICK ON A PLATFORM"); return; }
    hit.poppy = hit.poppy != null ? null : clamp(x - hit.x, 6, hit.w - 6);
    editorChanged();
  } else if (tool.enemy) {
    if (L.enemies.length >= 60) { edMsg("THAT'S A LOT OF ENEMIES!"); return; }
    L.enemies.push({ type: tool.id, x: clamp(x, 16, VIEW_W - 16), y: Math.max(50, wy) });
    editorChanged();
  } else if (tool.id === "goal") {
    L.goal = { x: clamp(x, 16, VIEW_W - 16), y: Math.max(50, wy) };
    editorChanged();
  }
}

function editorRelease(m) {
  const d = ed.drag;
  ed.drag = null;
  let x1 = Math.min(d.x, snap(m.x)), x2 = Math.max(d.x, snap(m.x));
  if (x2 - x1 < 20) { x1 = d.x - 40; x2 = d.x + 40; }                  // just a click: a normal-size platform
  x1 = clamp(x1, 0, VIEW_W - 30);
  x2 = clamp(x2, x1 + 30, VIEW_W);
  const L = currentLevel();
  if (L.platforms.length >= 300) { edMsg("THAT'S A LOT OF PLATFORMS!"); return; }
  L.platforms.push({ x: x1, y: d.y, w: x2 - x1, move: d.move ? 1 : 0, sweep: 0, poppy: null });
  editorChanged();
}

function mouseToGame(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * VIEW_W, y: (ev.clientY - r.top) / r.height * VIEW_H };
}
// Pointer events work for a mouse AND a finger. Taps first check the on-screen
// buttons that menus draw on touch screens (uiButtons), then the level builder.
const uiButtons = [];
function uiButton(label, x, y, w, h, action, color = "#7dff7a", size = 10, draw = true) {
  if (draw) {
    ctx.fillStyle = "rgba(20,24,56,0.94)";
    rr(x, y, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    txt(label, x + w / 2, y + h / 2 - size / 2, size, color, "center");
  }
  uiButtons.push({ x, y, w, h, action });
}

canvas.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const m = mouseToGame(ev);
  Object.assign(ed.mouse, { x: m.x, y: m.y, in: true });
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { b.action(m); return; }
  }
  if (state === "editor") editorPress(m, ev.button);
});
window.addEventListener("pointermove", ev => {
  const m = mouseToGame(ev);
  Object.assign(ed.mouse, { x: m.x, y: m.y, in: m.x >= 0 && m.x <= VIEW_W && m.y >= 0 && m.y <= VIEW_H });
});
window.addEventListener("pointerup", ev => { if (state === "editor" && ed.drag) editorRelease(mouseToGame(ev)); });
canvas.addEventListener("wheel", ev => {
  if (state !== "editor") return;
  ev.preventDefault();
  ed.camY = clamp(ed.camY - ev.deltaY * 0.8, CAM_MIN, EDIT_MAX_Y - VIEW_H + 200);
}, { passive: false });
canvas.addEventListener("contextmenu", ev => ev.preventDefault());

// ---------- Character maker ----------
const CHAR_ROWS = ["CHARACTER", "NAME", "SUIT", "VISOR", "BACKPACK", "HAT", "HAT COLOR", "DOG WINGS"];
const COLOR_ROWS = { SUIT: "suit", VISOR: "visor", BACKPACK: "pack", "HAT COLOR": "hatColor", "DOG WINGS": "wings" };

function handleCharKey(e) {
  const c = e.code, ch = currentChar(), row = CHAR_ROWS[cm.row];
  const step = c === "ArrowLeft" ? -1 : c === "ArrowRight" ? 1 : 0;
  if (c === "ArrowUp") cm.row = (cm.row + CHAR_ROWS.length - 1) % CHAR_ROWS.length;
  else if (c === "ArrowDown") cm.row = (cm.row + 1) % CHAR_ROWS.length;
  else if (c === "Escape" || c === "Enter") { saveSandbox(); state = "sandbox"; }
  else if (c === "Insert" || (c === "KeyN" && row !== "NAME")) {
    if (sandbox.characters.length < 8) {
      sandbox.characters.push({ ...DEFAULT_CHARACTER, name: "NEW" });
      sandbox.selected = sandbox.characters.length - 1;
      cm.row = 1;
    }
  } else if (c === "Delete" && sandbox.characters.length > 1) {
    sandbox.characters.splice(sandbox.selected, 1);
    sandbox.selected = Math.min(sandbox.selected, sandbox.characters.length - 1);
  } else if (step && row === "CHARACTER") {
    sandbox.selected = (sandbox.selected + step + sandbox.characters.length) % sandbox.characters.length;
  } else if (step && row === "HAT") {
    ch.hat = (ch.hat + step + HATS.length) % HATS.length;
  } else if (step && COLOR_ROWS[row]) {
    const k = COLOR_ROWS[row];
    ch[k] = (ch[k] + step + PALETTE.length) % PALETTE.length;
  } else if (row === "NAME") {
    if (c === "Backspace") ch.name = ch.name.slice(0, -1);
    else if (e.key && /^[a-z0-9 ]$/i.test(e.key) && ch.name.length < 8) ch.name += e.key.toUpperCase();
  }
}

// ---------- The upgrade picker ----------
const rerollsLeft = () => st.rerolls - player.rerollsUsed;

function randomCard(cat, exclude) {
  const pool = UPGRADES[cat].filter(u => !taken.includes(u) && !exclude.includes(u) && (!u.needs || u.needs(st)));
  return pool.length ? pick(pool) : null;
}

function dealCards() {
  const cards = [];
  for (const cat of ["jump", "weapon", "ability"]) {
    const card = randomCard(cat, cards);
    if (card) cards.push(card);
  }
  if (st.extraCard) {                                  // Lucky Clover: one bonus card
    for (let tries = 0; tries < 6; tries++) {
      const card = randomCard(pick(["jump", "weapon", "ability"]), cards);
      if (card) { cards.push(card); break; }
    }
  }
  choice.cards = cards;
  choice.sel = 0;
}

function openChoice() {
  choice = { cards: [], sel: 0, delay: 0.6, mark: (milestonesDone - pendingPicks + 1) * UPGRADE_EVERY_M, bonus: boss.prize };
  boss.prize = false;
  dealCards();
  if (!choice.cards.length) { pendingPicks = 0; choice = null; return; }   // nothing left to offer
  state = "choose";
}

function takeCard(i) {
  const card = choice.cards[i];
  if (!card) return;
  card.apply(st);
  taken.push(card);
  floatText(player.x + PLAYER_W / 2, player.y + PLAYER_H + 30, card.name.toUpperCase(), CATEGORY[card.cat].color);
  pendingPicks--;
  if (pendingPicks > 0) openChoice();
  else { state = "playing"; choice = null; }
}

function handleChooseKey(e) {
  if (choice.delay > 0) return;
  const c = e.code, n = choice.cards.length;
  if (c === "ArrowLeft" || c === "KeyA") choice.sel = (choice.sel + n - 1) % n;
  else if (c === "ArrowRight" || c === "KeyD") choice.sel = (choice.sel + 1) % n;
  else if (c === "Enter" || c === "Space") takeCard(choice.sel);
  else if (/^Digit[1-4]$/.test(c)) takeCard(Number(c.slice(5)) - 1);
  else if (c === "KeyR" && rerollsLeft() > 0) { player.rerollsUsed++; dealCards(); }
}

// Upgrade picks wait until you're standing still-safe: on solid ground that won't move,
// crumble, blink, bounce or get swept, so nothing can knock you off when the game goes on.
function onSafeGround() {
  const p = player, s = p.standOn;
  if (!p.onGround || !s || p.stun > 0) return false;
  if (s.amp || s.crumble || s.blink || s.bouncy || s.sweeper || s.icy) return false;
  return s.kind === "step" || s.kind === "ledge" || s.kind === "ground" || s.kind === "pad";
}

function onMilestone() {
  if (st.refillBoosts) boosts = st.boostMax;
  if (st.starPower) { player.invuln = Math.max(player.invuln, 5); player.starTime = 5; }
}

// =====================================================================
//  UPDATE
// =====================================================================
function puff(x, y, n, spread, color = "255,255,255") {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() * 2 - 1) * spread, vy: 20 + Math.random() * 60,
      life: 0.3 + Math.random() * 0.25, max: 0.55, color,
    });
  }
}
const ring = (x, y, r, color) => rings.push({ x, y, r, color, life: 0.35 });
const floatText = (x, y, str, color) => texts.push({ x, y, str, color, life: 0.9 });

// When you jump, every nearby poppy shoots a spray of petals at you.
function poppiesShoot() {
  const px = player.x + PLAYER_W / 2, py = player.y + PLAYER_H / 2;
  const count = PETALS_PER_SHOT + st.extraPetals;
  for (const f of poppies) {
    if (f.cool > 0) continue;
    const hx = f.x, hy = f.y + 20;                   // the flower head
    const sy = toScreenY(hy);
    if (sy < 0 || sy > VIEW_H) continue;             // only poppies you can see
    if (Math.hypot(px - hx, py - hy) > POPPY_RANGE) continue;
    f.cool = POPPY_COOLDOWN;
    f.bounce = 1;
    // Aim at where you'll be near the top of your jump, not where you were.
    const T = 0.35;
    const tx = clamp(px + player.vx * T, 0, VIEW_W);
    const ty = py + player.vy * T - 0.5 * gravityAt(player.y) * T * T;
    const dx = tx - hx, dy = ty - hy;
    const aim = Math.atan2(dy, dx);
    const speed = Math.max(40, Math.hypot(dx, dy)) * 4.3;   // arrives in about T seconds, then flutters
    for (let i = 0; i < count; i++) {
      const a = aim + (i - (count - 1) / 2) * 0.18 + (Math.random() - 0.5) * 0.08;
      petals.push({
        x: hx, y: hy, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        age: 0, rot: Math.random() * 6.28, spin: (Math.random() * 2 - 1) * 6, ph: Math.random() * 6.28,
      });
    }
  }
}

// Petals zoom out, slow down, then flutter gently down. Touch one to catch it.
function updatePoppies(dt) {
  for (const f of poppies) {
    if (f.cool > 0) f.cool -= dt;
    f.bounce = Math.max(0, f.bounce - dt * 3);
  }
  const drag = Math.min(1, 2.5 * dt);
  const reach = 8 + st.petalReach;
  for (let i = petals.length - 1; i >= 0; i--) {
    const q = petals[i];
    q.vx -= q.vx * drag;
    q.vy -= q.vy * drag;
    q.vy -= 120 * (gravityAt(q.y) / GRAVITY) * dt;
    q.x += (q.vx + Math.sin(q.age * 3 + q.ph) * 25) * dt;
    q.y += q.vy * dt;
    q.rot += q.spin * dt;
    q.age += dt;
    const caught = q.x > player.x - reach && q.x < player.x + PLAYER_W + reach &&
                   q.y > player.y - reach && q.y < player.y + PLAYER_H + reach;
    if (caught) {
      if (boosts < st.boostMax) boosts++;
      puff(q.x, q.y, 5, 60, "255,90,80");
      petals.splice(i, 1);
      if (st.petalBurst) {                             // Petal Blaster: a free shot
        const x = player.x + PLAYER_W / 2, y = player.y + PLAYER_H * 0.55;
        const target = nearestTarget(x, y, st.aimRange * 1.3);
        if (target) makeShot(x, y, Math.atan2(target.y - y, target.x - x), st.damage);
      }
    } else if (q.age > PETAL_LIFE) {
      petals.splice(i, 1);
    }
  }
}

// Moving platforms slide back and forth; sweepers zoom along their platforms.
function resetMovers() {
  for (const s of movers) { s.ang = s.phase; s.x = s.baseX + s.amp * Math.sin(s.ang); s.dx = 0; }
  for (const s of sweepers) { s.sweeper.u = s.sweeper.phase; s.sweeper.frozen = 0; }
  updateMovers(0);
}

function updateMovers(dt) {
  const ws = worldScale();
  for (const s of movers) {
    s.ang += dt * ws * st.moverSpeed * 2 * Math.PI / s.period;
    const nx = s.baseX + s.amp * Math.sin(s.ang);
    s.dx = nx - s.x;
    s.x = nx;
  }
  for (const s of sweepers) {
    const sw = s.sweeper;
    if (sw.frozen > 0) sw.frozen -= dt;
    else sw.u = (sw.u + dt * ws * st.sweeperSpeed / sw.period) % 1;
    sw.dir = sw.u < 0.5 ? 1 : -1;
    sw.x = s.x + (sw.u < 0.5 ? sw.u * 2 : 2 - sw.u * 2) * (s.w - SWEEPER_W);
  }
  for (const f of poppies) f.x = f.plat.x + f.off;
  for (const s of tower) {                                   // crumbling space junk
    if (!s.crumble) continue;
    if (s.crumbleT > 0) {
      s.crumbleT -= dt;
      if (s.crumbleT <= 0) {
        s.gone = 4;                                            // falls away, back in 4 seconds
        for (let k = 0; k < 4; k++) puff(s.x + Math.random() * s.w, s.y, 3, 60, "150,160,180");
      }
    } else if (s.gone > 0) s.gone -= dt;
  }
}

// ---------- Section hazards (Round 7) ----------
function spawnFlyer(type, x, y, vx, vy, warn = 0) {
  const info = ENEMY_INFO[type];
  enemies.push({
    type, dyn: true, hx: x, hy: y, x, y, vx, vy, warn, maxHp: info.hp, hp: info.hp,
    r: info.r * (type === "asteroid" ? 0.8 + Math.random() * 0.5 : 1), alive: true, t: 0,
    pvx: 0, pvy: 0, frozen: 0, burn: 0, burnTick: 0, flash: 0, moonCd: 0,
    ph: Math.random() * 6.28, spin: (Math.random() - 0.5) * 3,
  });
  return enemies[enemies.length - 1];
}

function updateSections(dt) {
  const p = player, px = p.x + PLAYER_W / 2, ws = worldScale();
  const sec = SECTIONS[sectionAt(p.y / PX_PER_M)].id;
  const calm = boss.phase !== "none" && boss.phase !== "won";   // no surprises during a boss fight

  // Upper Atmosphere: a warning flicker, then a lightning bolt straight down
  if (storm.warn > 0) {
    storm.warn -= dt * ws;
    if (storm.warn <= 0) { storm.strike = 0.25; storm.hit = false; }
  } else if (storm.strike > 0) {
    storm.strike -= dt;
    if (!storm.hit && Math.abs(px - storm.x) < 18) {
      storm.hit = true;
      if (hitPlayer(px >= storm.x ? 1 : -1, 340, 280)) puff(px, p.y + 16, 12, 120, "255,240,120");
    }
  } else if (sec === "darksky") {
    storm.t -= dt * ws;
    if (storm.t <= 0) {
      storm.x = clamp(px + (Math.random() - 0.5) * 180, 20, VIEW_W - 20);
      storm.warn = 0.9;
      storm.t = 2.5 + Math.random() * 2;
    }
  }

  // Windy Heights: a warning, then a gust that pushes you sideways
  if (wind.phase === "warn") {
    wind.timer -= dt;
    if (wind.timer <= 0) { wind.phase = "blow"; wind.timer = 2.5; }
  } else if (wind.phase === "blow") {
    wind.timer -= dt;
    p.x = clamp(p.x + wind.dir * (p.onGround ? 70 : 140) * dt * ws, 0, VIEW_W - PLAYER_W);   // slides you along
    if (wind.timer <= 0) { wind.phase = "calm"; wind.t = 3 + Math.random() * 2.5; }
  } else if (sec === "sky" || sec === "mars") {             // wind in the sky, dust storms on Mars
    wind.t -= dt;
    if (wind.t <= 0) { wind.phase = "warn"; wind.timer = 1.1; wind.dir = Math.random() < 0.5 ? -1 : 1; }
  }

  // The Sun: solar flares shoot across from the right (with a warning first)
  if (sec === "sun" && !calm) {
    flareT -= dt * ws;
    if (flareT <= 0) {
      flareT = 2 + Math.random() * 1.3;
      spawnFlyer("flare", VIEW_W + 20, p.y + 16 + (Math.random() - 0.3) * 260, -240, 0, 0.8);
    }
  }
  // The Black Hole: asteroids drift down. The Mountains: rocks tumble down faster.
  if ((sec === "blackhole" || sec === "mountains") && !calm) {
    rockT -= dt * ws;
    if (rockT <= 0) {
      const rocks = sec === "mountains";
      rockT = (rocks ? 1.8 : 1.4) + Math.random() * 1.2;
      const r = spawnFlyer("asteroid", 30 + Math.random() * (VIEW_W - 60), camY + VIEW_H + 30,
                           (Math.random() - 0.5) * (rocks ? 60 : 120), -(rocks ? 110 + Math.random() * 70 : 50 + Math.random() * 70));
      if (rocks) r.rock = true;
    }
  }
}

// ---------- Boss fights (Round 8) ----------
function startBossFight() {
  const def = boss.def;
  boss.phase = "intro";
  boss.timer = 2.2;
  for (const e of enemies) {                                    // clear the arena for the big fight
    if (e.dyn || (e.y > boss.ledge.y - 300 && e.y < boss.ceiling + 300)) e.alive = false;
  }
  const e = {
    type: "boss", boss: true, hx: VIEW_W / 2, hy: boss.ceiling - 170, x: VIEW_W / 2, y: boss.ceiling + 150,
    maxHp: def.hp, hp: def.hp, r: def.r, kind: def.kind, alive: true, t: 0, pvx: 0, pvy: 0, frozen: 0,
    burn: 0, burnTick: 0, flash: 0, moonCd: 0, ph: 0, mode: "hover", shootT: 2, diveT: def.diveGap[0],
  };
  enemies.push(e);
  boss.e = e;
}

function updateBoss(dt) {
  const p = player;
  if (boss.phase === "none") {                    // getting close to a boss you haven't beaten?
    const def = BOSSES.find(b => !boss.beaten.includes(b.at) && b.at < MOON_METERS &&
                                 p.y >= b.at * PX_PER_M - 600 && p.y < b.at * PX_PER_M + ARENA_H);
    const ledge = def && tower.find(s => s.kind === "ledge" && s.mark === def.at);
    if (!ledge) return;
    Object.assign(boss, {
      phase: "waiting", def, ledge, ceiling: ledge.y + ARENA_H, camY: ledge.y - 140,
      gate: { x: ledge.x + ledge.w - 50, w: 36, h: 52 },
    });
  }
  if (boss.phase === "waiting") {                 // walk into the gate to start the fight
    const g = boss.gate;
    if (p.onGround && p.standOn === boss.ledge && p.x + PLAYER_W > g.x + 8 && p.x < g.x + g.w - 8) startBossFight();
  } else if (boss.phase === "intro") {
    boss.timer -= dt;
    if (boss.timer <= 0) boss.phase = "fight";
  } else if (boss.phase === "fight" && !boss.e.alive) {   // you won!
    boss.phase = "won";
    boss.timer = 4;
    boss.beaten.push(boss.def.at);
    for (const e of enemies) if (e.dyn) e.alive = false;
    confettiBurst();
    boosts = st.boostMax;
    p.invuln = Math.max(p.invuln, 4);
    p.starTime = 4;
    if (boss.def.final) boss.timer = 3;           // the final boss: you win the whole game!
    else { pendingPicks++; boss.prize = true; }   // the prize: a free upgrade pick
  } else if (boss.phase === "won") {
    boss.timer -= dt;
    if (boss.timer <= 0) {
      if (boss.def.final) { endRun(true); return; }
      boss.phase = "none";
    }
  }
  // The Black Hole slowly pulls you toward it during the fight
  if (boss.phase === "fight" && boss.def.kind === "void" && boss.e.alive) {
    const pull = Math.sign(boss.e.x - (p.x + PLAYER_W / 2)) * 35 * dt * worldScale();
    p.x = clamp(p.x + pull, 0, VIEW_W - PLAYER_W);
  }
  // The barrier: no climbing past the boss until it's beaten
  if (barrierUp() && p.y + PLAYER_H > boss.ceiling && p.y < boss.ceiling + 120) {
    p.y = boss.ceiling - PLAYER_H;
    if (p.vy > 0) p.vy = 0;
    p.jumping = false;
  }
}

function updateTempPlats(dt) {
  for (let i = tempPlats.length - 1; i >= 0; i--) {
    tempPlats[i].life -= dt;
    if (tempPlats[i].life <= 0) tempPlats.splice(i, 1);
  }
}

// Your body for getting hit. Tiny Mode makes it smaller (your feet stay put).
function hazardBox() {
  const p = player;
  return st.tiny ? { x: p.x + 4, y: p.y, w: PLAYER_W - 8, h: PLAYER_H - 10 }
                 : { x: p.x, y: p.y, w: PLAYER_W, h: PLAYER_H };
}

// Something bumped you. Returns true if it actually knocked you.
function hitPlayer(dirX, kx, ky, enemy = null) {
  const p = player;
  if (p.domeTime > 0) {                                            // the dog's Safety Dome blocks everything
    if (enemy) enemy.pvx -= dirX * 260;
    return false;
  }
  if (enemy && p.spellTime > 0) {                                  // the dog's purple cloud:
    enemy.pvx -= dirX * 260;                                       // enemies bounce right off
    enemy.pvy += 120;
    return false;
  }
  if (p.invuln > 0) return false;
  const moving = keys.ArrowLeft || keys.ArrowRight || keys.KeyA || keys.KeyD;
  if (st.anchor && p.onGround && !moving) return false;            // Anchor Boots
  if (enemy && st.thorns) damageEnemy(enemy, st.thorns);           // Thorn Armor
  const cx = p.x + PLAYER_W / 2, cy = p.y + PLAYER_H / 2;
  if (st.shield && p.shieldReady) {                                 // Bubble Shield
    p.shieldReady = false;
    p.shieldTimer = SHIELD_RECHARGE;
    p.invuln = 0.6;
    ring(cx, cy, 40, "120,220,255");
    floatText(cx, p.y + PLAYER_H + 20, "BLOCKED!", "#8fe3ff");
    return false;
  }
  p.vx = dirX * kx * st.knockResist;
  p.vy = ky * st.knockResist;
  Object.assign(p, { onGround: false, standOn: null, coyote: 0, jumping: false, diving: false, dashTime: 0 });
  p.stun = st.noStun ? 0 : STUN_TIME;
  p.squash = 0.75;
  p.invuln = Math.max(HIT_GRACE, st.ghostTime);
  if (st.revenge) blastAround(cx, cy, 110, 2, 0, "255,120,120");   // Revenge Burst
  return true;
}

// Touch a sweeper and it knocks you sideways in the direction it's going.
function checkSweepers() {
  const p = player, hb = hazardBox();
  for (const s of sweepers) {
    const sw = s.sweeper;
    if (sw.frozen > 0) continue;
    if (hb.x + hb.w > sw.x + 2 && hb.x < sw.x + SWEEPER_W - 2 && hb.y < s.y + SWEEPER_H && hb.y + hb.h > s.y) {
      if (hitPlayer(sw.dir, SWEEP_KNOCK_X, SWEEP_KNOCK_Y)) puff(p.x + PLAYER_W / 2, p.y + 10, 10, 120, "255,212,71");
      break;
    }
  }
}

// ---------- Jumping and moving ----------
function doJump(kind, wallDir = 0) {
  const p = player;
  const inSpace = p.y >= SPACE_Y;
  let v = JUMP_V * Math.sqrt(st.jumpHeight * (inSpace ? st.spaceJump : 1));
  let superJump = false;
  if (kind === "ground") {
    p.jumpCount++;
    p.airJumpsLeft = st.airJumps;                           // leaving the ground refills mid-air jumps
    const free = (st.ledgeLaunch && p.standOn && p.standOn.kind === "ledge") ||
                 (st.superEvery > 0 && p.jumpCount % st.superEvery === 0);
    if (free) superJump = true;
    else if (boosts > 0) { boosts--; superJump = true; }   // saved petals power up your next jump
  } else if (kind === "air") {
    p.airJumpsLeft--;
    v *= st.airJumpPower;
  } else {                                                   // wall kick
    p.wallKicked = true;
    v *= 0.95;
    p.vx = wallDir * MAX_RUN * st.runSpeed;
    p.facing = wallDir;
  }
  if (superJump) v *= st.boostPower;
  p.vy = v;
  Object.assign(p, { onGround: false, standOn: null, coyote: 0, buffer: 0, jumping: true, diving: false });
  p.superAir = superJump;
  p.squash = superJump ? 1.45 : 1.3;
  const cx = p.x + PLAYER_W / 2;
  if (superJump) puff(cx, p.y, 14, 120, "235,50,43");
  else if (kind === "air") puff(cx, p.y, 8, 70, "200,230,255");
  else puff(cx, p.y, 4, 50);
  if (kind !== "air") poppiesShoot();
}

function land(s, impact, wasGround) {
  const p = player;
  p.y = s.y;
  p.landY = s.y;
  p.vy = 0;
  p.onGround = true;
  p.standOn = s;
  p.airJumpsLeft = st.airJumps;
  p.dashReady = true;
  p.hoverLeft = st.hover;
  p.diving = false;
  p.wallKicked = false;                                      // landing gives your Wall Kick back
  if (s.kind === "ledge" || s.kind === "ground") p.lastLedge = s;
  if (s.crumble && !(s.crumbleT > 0)) s.crumbleT = 0.6;              // space junk starts to crumble
  if (s.bouncy) {                                                    // bouncy cloud: boing! (hold jump to go high)
    Object.assign(p, { vy: JUMP_V * 1.3, onGround: false, standOn: null, jumping: true, superAir: false, squash: 0.7 });
    puff(p.x + PLAYER_W / 2, p.y, 6, 60, "235,240,255");
    return;
  }
  if (wasGround) return;
  p.squash = impact > 550 ? 0.7 : 0.85;
  if (impact > 350) puff(p.x + PLAYER_W / 2, p.y, 6, 70);
  if (p.superAir && st.shockwave) blastAround(p.x + PLAYER_W / 2, p.y + 10, 130, 2, 320, "255,200,90");
  p.superAir = false;
  if (st.autoHop && (keys.Space || keys.ArrowUp || keys.KeyW)) p.buffer = JUMP_BUFFER;   // Bunny Hop
}

function updatePlayer(dt) {
  const p = player;
  if (p.onGround && p.standOn) p.x += p.standOn.dx || 0;   // ride along on moving platforms
  if (p.stun > 0) p.stun -= dt;
  const left = keys.ArrowLeft || keys.KeyA;
  const right = keys.ArrowRight || keys.KeyD;
  const held = keys.Space || keys.ArrowUp || keys.KeyW;
  const dir = p.stun > 0 ? 0 : (right ? 1 : 0) - (left ? 1 : 0);   // no steering while knocked
  const inSpace = p.y >= SPACE_Y;
  const maxRun = MAX_RUN * st.runSpeed * (p.onGround ? 1 : st.airSpeed);

  // Running
  if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.vx = p.facing * 640;
  } else if (st.grip && p.onGround) {
    if (dir) p.facing = dir;
    p.vx = dir * maxRun;
  } else if (dir !== 0) {
    p.facing = dir;
    const onIce = p.onGround && p.standOn && p.standOn.icy;  // ice: slow to speed up, slides when you let go
    const accel = p.onGround ? RUN_ACCEL * (onIce ? 0.3 : 1) : AIR_ACCEL * st.airControl;
    const turning = Math.sign(p.vx) === -dir;
    p.vx = clamp(p.vx + dir * accel * dt * (turning ? 1.6 : 1), -maxRun, maxRun);
  } else {
    const onIce = p.onGround && p.standOn && p.standOn.icy;
    const slow = (p.onGround ? (onIce ? 220 : RUN_DECEL) : AIR_DECEL) * dt;
    p.vx = Math.abs(p.vx) <= slow ? 0 : p.vx - Math.sign(p.vx) * slow;
  }

  // Jumping: from the ground, off a wall (Wall Kick), or in mid-air (Double Jump)
  p.coyote = p.onGround ? st.coyote : p.coyote - dt;
  p.buffer -= dt;
  const wall = p.x <= 0.5 ? -1 : (p.x >= VIEW_W - PLAYER_W - 0.5 ? 1 : 0);
  if (p.buffer > 0 && p.stun <= 0) {
    if (p.coyote > 0) doJump("ground");
    else if (st.wallKick && wall !== 0 && !p.wallKicked) doJump("wall", -wall);   // once until you land
    else if (p.airJumpsLeft > 0) doJump("air");
  }
  if (p.jumping && !held && p.vy > 0) { p.vy *= JUMP_CUT; p.jumping = false; }
  if (p.vy <= 0) p.jumping = false;

  // Gravity (switched off for a moment during an Air Dash)
  if (p.dashTime > 0) {
    p.vy = 0;
  } else {
    const maxFall = p.diving ? MAX_FALL * 1.6 : MAX_FALL * fallAt(p.y) * st.fallSpeed;
    p.vy = Math.max(p.vy - gravityAt(p.y) * st.gravity * dt, -maxFall);
    if (st.hover && held && p.vy < 0 && p.hoverLeft > 0 && !p.diving) {   // Hover Jets
      p.vy = Math.max(p.vy, -35);
      p.hoverLeft -= dt;
      if (Math.random() < 0.35) puff(p.x + PLAYER_W / 2, p.y, 1, 30, "120,220,255");
    }
  }

  // Sideways movement, with the screen edges as walls
  p.x += p.vx * dt;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x > VIEW_W - PLAYER_W) { p.x = VIEW_W - PLAYER_W; p.vx = 0; }

  // Up and down. Platforms are one-way: jump up through them, land on top.
  const prevY = p.y;
  const wasGround = p.onGround;
  p.y += p.vy * dt;
  p.onGround = false;
  if (p.vy <= 0) {
    const edge = 3 - st.wideFeet;
    search:
    for (const list of [tower, tempPlats]) {
      for (const s of list) {
        if (prevY >= s.y && p.y <= s.y && p.x + PLAYER_W > s.x + edge && p.x < s.x + s.w - edge && solidNow(s)) {
          land(s, -p.vy, wasGround);
          break search;
        }
      }
    }
  }

  if (!p.onGround) p.standOn = null;
  p.squash += (1 - p.squash) * Math.min(1, dt * 14);
  if (p.onGround && Math.abs(p.vx) > 20) p.walk += dt * Math.abs(p.vx) * 0.06;
}

// ---------- Ability buttons ----------
function useDive() {
  const p = player;
  if (!st.dive || p.onGround) return;
  p.diving = true;
  p.jumping = false;
  p.dashTime = 0;
  p.vy = Math.min(p.vy, -700);
}

function useDash() {
  const p = player;
  if (!st.dash || p.onGround || !p.dashReady) return;
  p.dashReady = false;
  p.dashTime = 0.16;
  p.diving = false;
  puff(p.x + PLAYER_W / 2, p.y + 12, 8, 60, "200,230,255");
}

function useTimeBubble() {
  if (!st.timeBubble || player.timeCd > 0) return;
  timeSlow = TIME_BUBBLE.length;
  player.timeCd = TIME_BUBBLE.cooldown;
}

function useBlink() {
  const p = player;
  if (!st.blink || p.blinkCd > 0) return;
  puff(p.x + PLAYER_W / 2, p.y + 16, 10, 80, "195,155,255");
  p.x = clamp(p.x + p.facing * BLINK.dist, 0, VIEW_W - PLAYER_W);
  if (!p.onGround) p.vy = Math.max(p.vy, 0);
  p.blinkCd = BLINK.cooldown;
  puff(p.x + PLAYER_W / 2, p.y + 16, 10, 80, "195,155,255");
}

function useCloud() {
  const p = player;
  if (!st.cloud || p.cloudCd > 0) return;
  tempPlats.push({ x: p.x + PLAYER_W / 2 - CLOUD.width / 2, y: p.y - 2, w: CLOUD.width, kind: "cloud", life: CLOUD.life, dx: 0 });
  p.cloudCd = CLOUD.cooldown;
}

// ---------- The flying Boston terrier ----------
// She flies just behind you. CTRL+B: she sprays glitter from her butt, and it
// becomes a purple cloud that keeps enemies off you for a few seconds.
function castDogSpell() {
  const p = player, sp = SPELLS[p.spells[p.spellSel]];
  if ((p.spellCds[sp.id] || 0) > 0) return;
  p.spellCds[sp.id] = sp.cd;
  glitterTime = 0.5;
  glitterColor = sp.color;
  const cx = p.x + PLAYER_W / 2;
  floatText(cx, p.y + PLAYER_H + 28, sp.name + "!", `rgb(${sp.color})`);
  switch (sp.id) {
    case "cloud": p.spellTime = DOG_SPELL.length; break;
    case "bubble":
      tempPlats.push({ x: clamp(cx - 35, 0, VIEW_W - 70), y: p.y - 2, w: 70, kind: "bubble", life: 3, dx: 0, bouncy: true });
      break;
    case "zap":
      for (const e of enemies) {
        if (!e.alive || e.warn > 0 || !onScreen(e.y)) continue;
        zaps.push({ x1: dog.x, y1: dog.y, x2: e.x, y2: e.y, life: 0.3 });
        damageEnemy(e, 2);
      }
      break;
    case "tailwind":
      Object.assign(p, { vy: Math.max(p.vy, JUMP_V * 1.5), onGround: false, standOn: null, jumping: false, diving: false });
      puff(cx, p.y, 14, 100, sp.color);
      break;
    case "rainbow":
      tempPlats.push({ x: clamp(cx - 110, 0, VIEW_W - 220), y: p.y - 2, w: 220, kind: "rainbow", life: 6, dx: 0 });
      break;
    case "dome": p.domeTime = 3; break;
    case "howl": timeSlow = 4; break;
    case "smash": blastAround(cx, p.y + 16, 700, 3, 300, sp.color); break;
    case "moonhowl":
      boosts = st.boostMax;
      p.invuln = Math.max(p.invuln, 5);
      p.starTime = 5;
      break;
  }
}

function updateDog(dt) {
  const p = player, cx = p.x + PLAYER_W / 2;
  const tx = cx - p.facing * 30, ty = p.y + PLAYER_H + 14;
  dog.x += (tx - dog.x) * Math.min(1, dt * 4);
  dog.y += (ty - dog.y) * Math.min(1, dt * 4);
  if (Math.abs(cx - dog.x) > 4) dog.facing = cx > dog.x ? 1 : -1;
  if (glitterTime > 0) {                                   // glitter streams from her butt to you
    glitterTime -= dt;
    const bx = dog.x - dog.facing * 11, by = dog.y + 2;
    const dx = cx - bx, dy = p.y + PLAYER_H / 2 - by;
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: bx, y: by, vx: dx * 2.4 + (Math.random() - 0.5) * 70, vy: dy * 2.4 + 90 + (Math.random() - 0.5) * 70,
        life: 0.45 + Math.random() * 0.2, max: 0.65,
        color: pick([glitterColor, glitterColor, "255,230,120", "255,255,255"]),
      });
    }
  }
}

// ---------- The blaster ----------
function nearestTarget(x, y, range) {
  let best = null, bestD = range;
  for (const e of enemies) {
    if (!e.alive || e.warn > 0 || !onScreen(e.y)) continue;
    let d = Math.hypot(e.x - x, e.y - y);
    if (e.boss) d = Math.min(d, 120);         // in a boss fight, aim at the boss unless something is right next to you
    if (d < bestD) { bestD = d; best = e; }
  }
  if (st.stopSweepers) {                     // Sweeper Stopper: sweepers are targets too
    for (const s of sweepers) {
      if (s.sweeper.frozen > 0) continue;
      const tx = s.sweeper.x + SWEEPER_W / 2, ty = s.y + SWEEPER_H / 2;
      if (!onScreen(ty)) continue;
      const d = Math.hypot(tx - x, ty - y);
      if (d < bestD) { bestD = d; best = { x: tx, y: ty }; }
    }
  }
  return best;
}

function makeShot(x, y, angle, dmg, opts = {}) {
  shots.push({
    x, y, vx: Math.cos(angle) * st.shotSpeed, vy: Math.sin(angle) * st.shotSpeed,
    life: Math.max(st.shotRange, opts.reach ? opts.reach / st.shotSpeed + 0.15 : 0), dmg, pierce: st.pierce, hit: new Set(), size: st.shotSize * (opts.big ? 1.6 : 1),
    bounces: st.bounceShots, back: false, big: !!opts.big, drone: !!opts.drone,
  });
}

// Your blaster aims itself at the nearest enemy. No enemy? It shoots the way you face.
function fireBlaster() {
  const p = player, x = p.x + PLAYER_W / 2, y = p.y + PLAYER_H * 0.55;
  const target = nearestTarget(x, y, st.aimRange);
  const aim = target ? Math.atan2(target.y - y, target.x - x) : (p.facing > 0 ? 0.1 : Math.PI - 0.1);
  p.shotCount++;
  const big = st.overcharge > 0 && p.shotCount % st.overcharge === 0;
  const reach = target && target.boss ? Math.hypot(target.x - x, target.y - y) : 0;   // shots reach the boss
  for (let i = 0; i < st.shots; i++) {
    makeShot(x, y, aim + (i - (st.shots - 1) / 2) * st.spread, st.damage * (big ? 3 : 1), { big, reach });
  }
}

const moonletPos = () => ({
  x: player.x + PLAYER_W / 2 + Math.cos(moonletAngle) * 36,
  y: player.y + PLAYER_H / 2 + Math.sin(moonletAngle) * 36,
});

function damageEnemy(e, amount) {
  if (!e.alive) return;
  e.hp -= amount;
  e.flash = 0.12;
  floatText(e.x, e.y + e.r + 4, `-${amount}`, "#ffffff");
  if (e.hp <= 0) {
    e.alive = false;
    puff(e.x, e.y, 16, 150, ENEMY_INFO[e.type].color);
  }
}

// Shockwave and Revenge Burst: hurt and push every enemy within `radius`.
function blastAround(x, y, radius, dmg, push, color) {
  ring(x, y, radius, color);
  for (const e of enemies) {
    if (!e.alive || e.warn > 0) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d > radius + e.r) continue;
    damageEnemy(e, dmg);
    if (push && d > 0.1) { e.pvx += (e.x - x) / d * push; e.pvy += (e.y - y) / d * push; }
  }
}

function shotHits(e, s) {
  let dmg = s.dmg;
  if (st.lucky && Math.random() < st.lucky) { dmg *= 3; floatText(e.x, e.y + 34, "LUCKY!", "#7dff7a"); }
  damageEnemy(e, dmg);
  if (st.freeze) e.frozen = st.freeze;
  if (st.burn) { if (e.burn <= 0) e.burnTick = 1; e.burn = st.burn; }
  if (st.knockback) {
    const sp = Math.hypot(s.vx, s.vy) || 1;
    e.pvx += s.vx / sp * st.knockback;
    e.pvy += s.vy / sp * st.knockback;
  }
  if (st.splash) {
    ring(e.x, e.y, st.splash, "255,160,60");
    for (const o of enemies) {
      if (o !== e && o.alive && Math.hypot(o.x - e.x, o.y - e.y) < st.splash + o.r) damageEnemy(o, 1);
    }
  }
  if (st.chain) {
    const zapped = new Set([e]);
    let from = e;
    for (let k = 0; k < st.chain; k++) {
      let next = null, bestD = 150;
      for (const o of enemies) {
        if (!o.alive || zapped.has(o)) continue;
        const d = Math.hypot(o.x - from.x, o.y - from.y);
        if (d < bestD) { bestD = d; next = o; }
      }
      if (!next) break;
      zaps.push({ x1: from.x, y1: from.y, x2: next.x, y2: next.y, life: 0.2 });
      damageEnemy(next, 1);
      zapped.add(next);
      from = next;
    }
  }
}

function updateBlaster(dt) {
  const p = player;
  const px = p.x + PLAYER_W / 2, py = p.y + PLAYER_H * 0.55;
  p.fireCd -= dt;
  if ((keys.KeyF || keys.KeyJ) && p.fireCd <= 0) {
    fireBlaster();
    p.fireCd = st.fireDelay;
  }

  if (st.drone) {                                    // Helper Drone
    const tx = px - p.facing * 26, ty = p.y + PLAYER_H + 20;
    drone.x += (tx - drone.x) * Math.min(1, dt * 5);
    drone.y += (ty - drone.y) * Math.min(1, dt * 5);
    drone.cd -= dt;
    if (drone.cd <= 0) {
      const target = nearestTarget(drone.x, drone.y, st.aimRange);
      if (target) { makeShot(drone.x, drone.y, Math.atan2(target.y - drone.y, target.x - drone.x), 1, { drone: true }); drone.cd = 1.1; }
      else drone.cd = 0.2;
    }
  }
  if (st.moonlet) moonletAngle += dt * 3.2;

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    if (s.back) {                                     // Boomerang: fly home
      const dx = px - s.x, dy = py - s.y, d = Math.hypot(dx, dy);
      if (d < 16) { shots.splice(i, 1); continue; }
      s.vx = dx / d * st.shotSpeed;
      s.vy = dy / d * st.shotSpeed;
    } else if (st.homing) {                           // Homing Darts: curve toward enemies
      const target = nearestTarget(s.x, s.y, 220);
      if (target) {
        const want = Math.atan2(target.y - s.y, target.x - s.x);
        let cur = Math.atan2(s.vy, s.vx);
        const diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        cur += clamp(diff, -st.homing * dt, st.homing * dt);
        const sp = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(cur) * sp;
        s.vy = Math.sin(cur) * sp;
      }
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.x < 0 || s.x > VIEW_W) {
      if (s.bounces > 0) { s.bounces--; s.vx = -s.vx; s.x = clamp(s.x, 0, VIEW_W); }
      else if (!s.back) { shots.splice(i, 1); continue; }
    }
    if (s.life <= 0) {
      if (st.boomerang && !s.back) { s.back = true; s.hit.clear(); s.life = 2; }
      else { shots.splice(i, 1); continue; }
    }

    let gone = false;
    for (const e of enemies) {
      if (!e.alive || e.warn > 0 || s.hit.has(e)) continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.size) {
        s.hit.add(e);
        shotHits(e, s);
        if (s.pierce > 0) s.pierce--;
        else if (st.boomerang && !s.back) { s.back = true; s.hit.clear(); s.hit.add(e); s.life = 2; }
        else { gone = true; break; }
      }
    }
    if (!gone && st.stopSweepers) {
      for (const pl of sweepers) {
        const sw = pl.sweeper;
        if (sw.frozen > 0) continue;
        if (s.x > sw.x - s.size && s.x < sw.x + SWEEPER_W + s.size && s.y > pl.y - s.size && s.y < pl.y + SWEEPER_H + s.size) {
          sw.frozen = st.stopSweepers;
          ring(sw.x + SWEEPER_W / 2, pl.y + SWEEPER_H / 2, 24, "120,220,255");
          gone = true;
          break;
        }
      }
    }
    if (gone) shots.splice(i, 1);
  }
}

// ---------- Enemies ----------
function moveEnemy(e, edt, px, py) {
  const ease = (tx, ty, rate) => {
    const k = Math.min(1, edt * rate);
    e.x += (tx - e.x) * k;
    e.y += (ty - e.y) * k;
  };
  if (e.boss) {                        // the boss: glide, throw fireballs, dive-bomb
    const angry = e.hp <= e.maxHp / 2;
    if (boss.phase !== "fight") { ease(e.hx, e.hy, 2); return; }
    if (e.mode === "hover") {
      ease(VIEW_W / 2 + 150 * Math.sin(e.t * (angry ? 1.3 : 0.8)), e.hy + 20 * Math.sin(e.t * 1.7), 3);
      const def = boss.def, k = angry ? 1 : 0;          // each boss has its own attack pattern
      e.shootT -= edt;
      if (e.shootT <= 0) {
        e.shootT = def.shotGap[k];
        const n = def.shots[k], aim = Math.atan2(py - e.y, px - e.x);
        for (let i = 0; i < n; i++) {
          const a = aim + (i - (n - 1) / 2) * 0.25;
          const shot = spawnFlyer(def.ammo, e.x, e.y, Math.cos(a) * def.speed, Math.sin(a) * def.speed);
          if (def.tint) shot.tint = def.tint;
        }
      }
      e.diveT -= edt;
      if (e.diveT <= 0) Object.assign(e, { mode: "dive", tx: px, ty: py, diveTime: 1.2 });
    } else if (e.mode === "dive") {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy), stepLen = 380 * edt;
      e.diveTime -= edt;
      if (d <= stepLen || e.diveTime <= 0) { e.mode = "return"; e.diveT = boss.def.diveGap[angry ? 1 : 0]; }
      else { e.x += dx / d * stepLen; e.y += dy / d * stepLen; }
    } else {
      ease(VIEW_W / 2, e.hy, 2.5);
      if (Math.abs(e.y - e.hy) < 15) e.mode = "hover";
    }
  } else if (e.dyn) {                  // flares and asteroids fly in a straight line
    if (e.warn > 0) { e.warn -= edt; return; }
    e.x += e.vx * edt;
    e.y += e.vy * edt;
    if (e.x < -60 || e.x > VIEW_W + 60 || e.y < camY - 150 || e.y > camY + VIEW_H + 100) e.alive = false;   // gone off screen
  } else if (e.type === "grumble") {   // grumpy cloud: drifts back and forth
    ease(e.hx + e.amp * Math.sin(e.t * 2 * Math.PI / e.period + e.ph), e.hy + 8 * Math.sin(e.t * 1.7 + e.ph), 3);
  } else if (e.type === "buzzer") {    // zips all the way across the screen
    ease(VIEW_W / 2 + (VIEW_W / 2 - 30) * Math.sin(e.t * 0.9 + e.ph), e.hy + 22 * Math.sin(e.t * 3.2 + e.ph), 6);
  } else if (e.type === "swooper") {   // hovers, then dives at you
    if (e.mode === "hover") {
      ease(e.hx + 30 * Math.sin(e.t * 1.3 + e.ph), e.hy + 10 * Math.sin(e.t * 2 + e.ph), 3);
      e.cd -= edt;
      if (e.cd <= 0 && Math.hypot(px - e.x, py - e.y) < 230) {
        Object.assign(e, { mode: "dive", tx: px, ty: py, diveT: 0.9 });
      }
    } else if (e.mode === "dive") {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
      const stepLen = 320 * edt;
      e.diveT -= edt;
      if (d <= stepLen || e.diveT <= 0) { e.mode = "return"; e.cd = 2.5; }
      else { e.x += dx / d * stepLen; e.y += dy / d * stepLen; }
    } else {
      ease(e.hx, e.hy, 2);
      if (Math.hypot(e.hx - e.x, e.hy - e.y) < 12) e.mode = "hover";
    }
  } else {                             // space jelly: slowly floats after you
    const near = Math.hypot(px - e.hx, py - e.hy) < 320;
    const tx = near ? px : e.hx, ty = near ? py : e.hy;
    const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
    const stepLen = Math.min(45 * edt, d);
    e.x += dx / d * stepLen;
    e.y += dy / d * stepLen + Math.sin(e.t * 2 + e.ph) * 10 * edt;
  }
}

function updateEnemies(dt) {
  const p = player, px = p.x + PLAYER_W / 2, py = p.y + PLAYER_H / 2;
  const ws = worldScale();
  const hb = hazardBox();
  const moon = st.moonlet ? moonletPos() : null;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.y < camY - 250 || e.y > camY + VIEW_H + 300) continue;    // asleep until you get close
    const edt = dt * ws * (e.frozen > 0 ? 0.35 : 1);
    if (e.frozen > 0) e.frozen -= dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.moonCd > 0) e.moonCd -= dt;
    if (e.burn > 0) {
      e.burn -= dt;
      e.burnTick -= dt;
      if (e.burnTick <= 0) { e.burnTick += 1; damageEnemy(e, 1); if (!e.alive) continue; }
    }
    e.t += edt;
    moveEnemy(e, edt, px, py);

    if (st.repel) {                                   // Repel Field
      const d = Math.hypot(e.x - px, e.y - py);
      if (d < 90 && d > 0.1) { e.pvx += (e.x - px) / d * 900 * dt; e.pvy += (e.y - py) / d * 900 * dt; }
    }
    e.x += e.pvx * dt;
    e.y += e.pvy * dt;
    const drag = Math.min(1, 4 * dt);
    e.pvx -= e.pvx * drag;
    e.pvy -= e.pvy * drag;
    if (!e.dyn) e.x = clamp(e.x, e.r, VIEW_W - e.r);
    if (!e.alive || e.warn > 0) continue;

    if (moon && e.moonCd <= 0 && Math.hypot(e.x - moon.x, e.y - moon.y) < e.r + 8) {   // Orbiting Moonlet
      e.moonCd = 0.6;
      damageEnemy(e, 1);
      const d = Math.hypot(e.x - moon.x, e.y - moon.y) || 1;
      e.pvx += (e.x - moon.x) / d * 250;
      e.pvy += (e.y - moon.y) / d * 250;
      if (!e.alive) continue;
    }

    // Bumping into you knocks you away.
    const nx = clamp(e.x, hb.x, hb.x + hb.w), ny = clamp(e.y, hb.y, hb.y + hb.h);
    if ((nx - e.x) ** 2 + (ny - e.y) ** 2 < e.r * e.r) {
      const dir = px >= e.x ? 1 : -1;
      if (hitPlayer(dir, ENEMY_KNOCK_X, ENEMY_KNOCK_Y, e)) e.pvx -= dir * 200;
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dyn && !enemies[i].alive) enemies.splice(i, 1);
}

// ---------- Confetti ----------
// Two confetti cannons fire from the bottom corners of the screen.
function confettiBurst() {
  for (const side of [-1, 1]) {
    for (let i = 0; i < 80; i++) {
      const tilt = 0.12 + Math.random() * 0.5;            // angle away from straight up
      const speed = 850 + Math.random() * 650;
      confetti.push({
        x: side < 0 ? 0 : VIEW_W, y: VIEW_H,
        vx: -side * Math.sin(tilt) * speed, vy: -Math.cos(tilt) * speed,
        rot: Math.random() * 6.28, spin: (Math.random() * 2 - 1) * 10,
        flip: Math.random() * 6.28, flipSpeed: 6 + Math.random() * 8,
        ph: Math.random() * 6.28, age: 0, life: 3.5 + Math.random() * 1.5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      });
    }
  }
}

function updateConfetti(dt) {
  const drag = Math.min(1, 1.8 * dt);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.vx -= c.vx * drag;
    c.vy -= c.vy * drag;
    c.vy = Math.min(c.vy + 900 * dt, 110);                 // flutters down slowly
    c.x += (c.vx + Math.sin(c.age * 4 + c.ph) * 30) * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    c.flip += c.flipSpeed * dt;
    c.age += dt;
    if (c.age > c.life || c.y > VIEW_H + 20) confetti.splice(i, 1);
  }
}

function updateEffects(dt) {
  for (const list of [rings, zaps, texts]) {
    for (let i = list.length - 1; i >= 0; i--) {
      list[i].life -= dt;
      if (list === texts) list[i].y += 30 * dt;
      if (list[i].life <= 0) list.splice(i, 1);
    }
  }
}

function touchesMoon() {
  const cx = VIEW_W / 2, cy = MOON_Y + MOON_R;
  const nx = clamp(cx, player.x, player.x + PLAYER_W);
  const ny = clamp(cy, player.y, player.y + PLAYER_H);
  return (nx - cx) ** 2 + (ny - cy) ** 2 < MOON_R * MOON_R;
}

// You dropped off the bottom of the screen. Rebound and Safety Flag can save you.
function fellOff() {
  const p = player, cx = p.x + PLAYER_W / 2;
  if (st.rebounds - p.reboundsUsed > 0) {
    p.reboundsUsed++;
    Object.assign(p, { y: camY, vy: 1150, onGround: false, standOn: null, stun: 0, diving: false, jumping: false, dashTime: 0 });
    p.airJumpsLeft = st.airJumps;
    p.dashReady = true;
    ring(cx, camY + 10, 60, "195,155,255");
    floatText(cx, camY + 70, "BOING!", "#c39bff");
    return;
  }
  if (st.safetyFlag && !p.flagUsed) {
    p.flagUsed = true;
    const L = p.lastLedge;
    const x = L.kind === "ground" ? VIEW_W / 2 - PLAYER_W / 2 : L.x + L.w / 2 - PLAYER_W / 2;
    Object.assign(p, { x, y: L.y, vx: 0, vy: 0, onGround: true, standOn: L, landY: L.y, stun: 0, diving: false, invuln: 1.5 });
    camY = Math.max(CAM_MIN, L.y - VIEW_H * 0.42);
    floatText(x + PLAYER_W / 2, L.y + 60, "SAVED!", "#c39bff");
    return;
  }
  endRun(false);
}

function update(dt) {
  if (state === "playing") {
    const p = player;
    runTime += dt;
    if (timeSlow > 0) timeSlow -= dt;
    for (const k of ["timeCd", "blinkCd", "cloudCd", "invuln", "starTime", "spellTime", "domeTime"]) if (p[k] > 0) p[k] -= dt;
    for (const k in p.spellCds) if (p.spellCds[k] > 0) p.spellCds[k] -= dt;
    if (st.shield && !p.shieldReady) { p.shieldTimer -= dt; if (p.shieldTimer <= 0) p.shieldReady = true; }
    updateMovers(dt);
    updateTempPlats(dt);
    updatePlayer(dt);
    updateDog(dt);
    checkSweepers();
    updateBlaster(dt);
    updateEnemies(dt);
    updatePoppies(dt);
    maxHeightPx = Math.max(maxHeightPx, p.y);

    // Camera follows you up, but never comes back down. It also keeps the last
    // platform you stood on in view, so a big jump can't scroll it away.
    if (bossActive()) {
      camY += (boss.camY - camY) * Math.min(1, dt * 4);       // the screen locks onto the boss arena
    } else {
      let target = Math.min(p.y - VIEW_H * 0.42, p.landY - 40);
      target = Math.max(target, p.y + PLAYER_H + 80 - VIEW_H);     // never let you leave the top of the screen
      if (boss.phase === "waiting") target = Math.min(target, boss.camY);
      if (target > camY) camY += (target - camY) * Math.min(1, dt * 6);
      camY = Math.max(camY, p.y + PLAYER_H + 20 - VIEW_H);          // even a super-fast launch stays on screen
    }

    if (mode === "sandbox") {                   // your own level: reach the goal star
      if (touchesGoal()) sandboxEnd(true);
      else if (p.y + PLAYER_H < camY - 4) sandboxEnd(false);
    } else {
    if (!confettiDone && maxHeightPx >= CONFETTI_AT) { confettiDone = true; confettiBurst(); }
    // Entering a new section: show its name, and the dog learns a new spell
    const si = sectionAt(p.y / PX_PER_M);
    if (si > sectionReached) {
      sectionReached = si;
      sectionFlash = 3.5;
      newSpell = "";
      if (SPELLS[si] && !p.spells.includes(si)) {
        p.spells.push(si);
